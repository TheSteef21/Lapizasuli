<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica: Capacitor</title>
    <!-- Integración de Tailwind CSS para el diseño rápido de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans text-gray-800">

    <div class="bg-white shadow-xl rounded-2xl overflow-hidden max-w-md w-full border border-gray-200">
        
        <!-- Encabezado de la tarjeta -->
        <div class="bg-slate-800 text-white p-5 text-center border-b-4 border-blue-500">
            <h2 class="text-2xl font-bold tracking-wider uppercase">Capacitor de Marcha</h2>
            <p class="text-slate-300 text-sm mt-1">Inspección de Componente Eléctrico</p>
        </div>

        <!-- Contenido principal -->
        <div class="p-6">
            
            <div class="flex justify-center mb-6">
                <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center border border-gray-300 shadow-inner overflow-hidden">
                    <!-- Referencia al archivo de imagen proporcionado -->
                    <img src="image.png" alt="Capacitor MPP" class="object-cover w-full h-full opacity-80 hover:opacity-100 transition-opacity">
                </div>
            </div>

            <h3 class="text-lg font-semibold border-b pb-2 mb-4 text-gray-700">Especificaciones Técnicas</h3>
            
            <ul class="space-y-3">
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-medium text-gray-600">Tipo:</span>
                    <span class="font-bold text-gray-900">MPP</span>
                </li>
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-medium text-gray-600">Capacitancia:</span>
                    <span class="font-bold text-gray-900">10.0 µF <span class="text-sm font-normal text-gray-500">±5%</span></span>
                </li>
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-medium text-gray-600">Voltaje Máximo:</span>
                    <span class="font-bold text-gray-900">210 VAC <span class="text-sm font-normal text-gray-500">50/60Hz</span></span>
                </li>
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-medium text-gray-600">No. de Parte:</span>
                    <span class="font-mono text-sm font-bold text-blue-600">238C2606P002</span>
                </li>
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-medium text-gray-600">Origen:</span>
                    <span class="font-bold text-gray-900">India</span>
                </li>
            </ul>

        </div>

        <!-- Pie de la tarjeta -->
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-between items-center">
            <span class="text-xs text-gray-400 font-mono">Archivo: image.png</span>
            <span class="text-xs text-blue-500 font-bold tracking-widest">SADV41</span>
        </div>

    </div>

</body>
</html>

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600;800&display=swap');
        :root {
          --gold: #d4af37;
          --cyan: #00f3ff;
          --violet: #9d4edd;
          --red: #FB542B;
          --green: #1DB954;
          --blue: #7AF6FF;
          --bg: #030305;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; min-height:100vh; background: var(--bg); color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; overflow-x:hidden; }
        .mono { font-family: 'JetBrains Mono', monospace !important; }
        .cinzel { font-family: 'Cinzel', serif; }

        /* Chaos BG */
        .chaos-bg-container { position: fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#000; }
        .chaos-layer {
          position:absolute; inset:-20px; background-size:cover; background-position:center;
          opacity:0; mix-blend-mode:screen; filter: contrast(125%) brightness(95%) saturate(1.2);
          transition: opacity 3.5s cubic-bezier(0.4,0,0.2,1), transform 9s ease-in-out, filter 0.3s;
          will-change: opacity, transform, filter;
        }
        .chaos-layer.active { opacity:0.62; transform: scale(1.09) rotate(0.6deg); }
        .chaos-layer.all-active { opacity:0.42; transform: scale(1.06); }

        @keyframes pageGlitch {
          0% { transform: translate(0) skew(0deg); filter: hue-rotate(0deg); }
          20% { transform: translate(-8px,5px) skew(-4deg); filter: hue-rotate(90deg) contrast(150%) invert(0.1); }
          40% { transform: translate(8px,-5px) skew(4deg); filter: hue-rotate(-90deg) invert(0.2); }
          60% { transform: translate(-3px,3px) skew(-2deg); filter: hue-rotate(45deg); }
          80% { transform: translate(3px,-3px) skew(2deg); filter: hue-rotate(-45deg); }
          100% { transform: translate(0) skew(0deg); filter: hue-rotate(0deg); }
        }
        .glitch-active { animation: pageGlitch 0.6s cubic-bezier(.25,.46,.45,.94) both; }
        .layer-glitch {
          mix-blend-mode: exclusion !important;
          transform: scale(1.15) rotate(-3deg) !important;
          filter: contrast(200%) saturate(300%) hue-rotate(180deg) !important;
          opacity: 0.9 !important;
        }

        .scanline { position: fixed; left:0; width:100%; height:2px; background: linear-gradient(90deg, transparent, rgba(251,84,43,0.4), transparent); z-index:60; pointer-events:none; animation: scan 7s linear infinite; }
        @keyframes scan { 0%{top:0} 100%{top:100%} }

        .grid-pattern { position: fixed; inset:0; z-index:1; pointer-events:none; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size:28px 28px; opacity:0.35; }

        .glass { background: rgba(8,8,12,0.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border:1px solid rgba(255,255,255,0.08); }
        .glass-strong { background: rgba(10,10,16,0.94); backdrop-filter: blur(22px); border:1px solid rgba(212,175,55,0.25); }
        .gold-glow { box-shadow: 0 0 40px rgba(212,175,55,0.2), inset 0 0 22px rgba(212,175,55,0.05); }
        .cyan-glow { box-shadow: 0 0 40px rgba(0,243,255,0.1), inset 0 0 22px rgba(0,243,255,0.05); border-color: rgba(0,243,255,0.25); }

        main { position:relative; z-index:10; max-width:1400px; margin:0 auto; padding:1.5rem 1rem 3rem; }

        .btn { font-size:11px; padding:8px 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color:#fff; cursor:pointer; transition:0.2s; text-decoration:none; display:inline-block; text-align:center; }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--cyan); }
        .btn-gold { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.08); }
        .btn-cyan { border-color: var(--cyan); color: var(--cyan); background: rgba(0,243,255,0.08); }

        .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-bottom:1.5rem; }
        .stat-box { border-radius:14px; padding:1rem; position:relative; overflow:hidden; }
        .stat-box::after { content:''; position:absolute; bottom:0; left:0; height:3px; width:100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); opacity:0.6; }

        .gear-selector { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap:10px; margin-bottom:1.5rem; }
        .gear-card { border-radius:14px; padding:8px; cursor:pointer; transition: all 0.3s ease; border:1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.6); text-align:center; }
        .gear-card:hover, .gear-card.active { border-color: var(--cyan); transform: translateY(-3px); box-shadow: 0 0 20px rgba(0,243,255,0.3); }
        .gear-card img { width:100%; height:80px; object-fit:cover; border-radius:8px; margin-bottom:6px; background:#000; }

        .portal-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:12px; margin-bottom:1.5rem; }
        .portal-card { border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; transition:.25s; text-decoration:none; color:#fff; background: rgba(8,8,12,0.85); border:1px solid rgba(255,255,255,0.08); }
        .portal-card:hover { transform: translateY(-3px) scale(1.01); border-color: var(--gold); }
        .portal-thumb { width:100%; height:90px; border-radius:10px; object-fit:cover; opacity:0.85; background:#000; }

        .emblem-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; }
        .emblem-svg { width:100%; max-width:800px; height:auto; margin:0 auto; display:block; border-radius:20px; overflow:hidden; background:#0A0A0A; border:1px solid rgba(212,175,55,0.2); }

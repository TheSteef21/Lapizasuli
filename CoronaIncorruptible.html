<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Patrullaje Espiritual</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 15px; }
        #map { height: 350px; width: 100%; border-radius: 15px; border: 2px solid #555; margin-bottom: 15px; }
        .stats { display: flex; justify-content: space-around; background: #222; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .verse-box { background: #1a1a1a; padding: 15px; border-radius: 10px; border-left: 4px solid #fff; margin: 15px 0; font-style: italic; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { padding: 15px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        #btnStart { background: #0056b3; color: white; } /* Azul Panamá */
        #btnEnd { background: #d32f2f; color: white; display: none; } /* Rojo Panamá */
        #qr-code { margin-top: 15px; background: white; padding: 10px; display: none; inline-block; }
    </style>
</head>
<body>

    <h2>Misión SADV41: Victoria sobre la Carne</h2>
    
    <div id="map"></div>

    <div class="stats">
        <div>Vel: <span id="speed">0</span> km/h</div>
        <div>Dist: <span id="dist">0</span> m</div>
    </div>

    <div class="verse-box" id="verse">"Caminad en el Espíritu..."</div>

    <div class="controls">
        <button id="btnStart" onclick="startPatrol()">EMPEZAR PATRULLAJE</button>
        <button id="btnEnd" onclick="endPatrol()">FINALIZAR Y REPORTAR</button>
    </div>

    <div id="qr-result" style="margin-top:20px;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let map, pathLine, userMarker;
        let watchId, startTime, startCoords;
        let points = [];
        let totalDist = 0;

        const versiculos = [
            "No tenemos lucha contra sangre y carne... - Efesios 6:12",
            "Someteos a Dios; resistid al diablo... - Santiago 4:7",
            "Vence con el bien el mal. - Romanos 12:21"
        ];

        // Inicializar Mapa
        map = L.map('map').setView([8.948, -79.655], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function startPatrol() {
            startTime = new Date();
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnEnd').style.display = 'block';
            document.getElementById('verse').innerText = versiculos[Math.floor(Math.random()*versiculos.length)];
            
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
            }
        }

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const speed = (position.coords.speed || 0) * 3.6; // conv a km/h
            const currentPos = [lat, lon];

            if(!startCoords) startCoords = currentPos;
            
            document.getElementById('speed').innerText = speed.toFixed(1);
            
            // Lógica de colores (Panamá) y borde blanco (Paz)
            let color = speed > 5 ? "#d32f2f" : "#0056b3"; // Rojo si corre, Azul si camina
            
            if (points.length > 0) {
                let lastPos = points[points.length - 1];
                let d = map.distance(lastPos, currentPos);
                totalDist += d;
                document.getElementById('dist').innerText = totalDist.toFixed(0);

                L.polyline([lastPos, currentPos], {
                    color: "white", weight: 8, opacity: 0.5 // El borde de PAZ
                }).addTo(map);

                L.polyline([lastPos, currentPos], {
                    color: color, weight: 4 // El rastro de PANAMÁ
                }).addTo(map);
            }

            points.push(currentPos);
            if(userMarker) map.removeLayer(userMarker);
            userMarker = L.marker(currentPos).addTo(map);
            map.panTo(currentPos);
        }

        function endPatrol() {
            navigator.geolocation.clearWatch(watchId);
            const endTime = new Date();
            const duration = Math.round((endTime - startTime) / 60000);
            const endCoords = points[points.length - 1];

            const registro = `*SADV41 REPORT*\nInicio: ${startCoords}\nFin: ${endCoords}\nDist: ${totalDist.toFixed(0)}m\nTiempo: ${duration}min\nVerso: ${document.getElementById('verse').innerText}`;

            // Generar QR para escaneo manual o PDF
            document.getElementById('qr-result').innerHTML = "<b>QR DE REGISTRO INMORTAL:</b><br><div id='qrcode' style='display:inline-block; background:white; padding:10px;'></div>";
            new QRCode(document.getElementById("qrcode"), { text: registro, width: 128, height: 128 });

            // Enviar a WhatsApp
            const url = `https://api.whatsapp.com/send?phone=50769362166&text=${encodeURIComponent(mensajeWhatsApp(registro))}`;
            window.open(url, '_blank');
        }

        function mensajeWhatsApp(reg) {
            return `*REGISTRO DE PATRULLAJE ESPIRITUAL*\n\n${reg}\n\n_La victoria es del Espíritu sobre la carne._ 🎚`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Brújula Activa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 15px; }
        #map-container { position: relative; width: 100%; height: 350px; border-radius: 15px; border: 2px solid #555; margin-bottom: 15px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        
        /* Brújula interactiva */
        #compass { 
            position: absolute; top: 15px; right: 15px; width: 60px; height: 60px; 
            background: rgba(0,0,0,0.8); border-radius: 50%; border: 3px solid #fff; 
            z-index: 1000; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.3s;
        }
        #compass.active { border-color: #4CAF50; box-shadow: 0 0 15px #4CAF50; }
        #compass-arrow { transition: transform 0.1s linear; color: #d32f2f; font-size: 1.8em; font-weight: bold; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .stats span { font-weight: bold; font-size: 1.1em; color: #4CAF50; display: block; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
        #btnStart { background: #fff; color: #000; }
        #btnEnd { background: #d32f2f; color: white; display: none; }
    </style>
</head>
<body>

    <h2 style="margin-bottom:5px;">Misión SADV41</h2>
    <p style="font-size:0.8em; color:#888; margin-bottom:15px;">Toca la brújula para activar el giro por acelerómetro</p>
    
    <div id="map-container">
        <div id="compass" onclick="toggleCompass()">
            <span id="compass-arrow">↑</span>
        </div>
        <div id="map"></div>
    </div>

    <div class="stats">
        <div>Vel <span id="speed">0</span></div>
        <div>Dist <span id="dist">0</span></div>
        <div>Inc <span id="grade">0</span>%</div>
    </div>

    <div class="controls">
        <input type="tel" id="wa-input" style="padding:10px; margin-bottom:10px; text-align:center;" value="50769362166">
        <button id="btnStart" onclick="startPatrol()">INICIAR PATRULLAJE</button>
        <button id="btnEnd" onclick="endPatrol()">FINALIZAR</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, userMarker, watchId;
        let points = [], totalDist = 0;
        let isTrackingHeading = false; // El interruptor del acelerómetro

        // Inicializar mapa con rotación
        map = L.map('map', { rotate: true, rotateControl: false }).setView([8.948, -79.655], 18);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Activar/Desactivar el modo acelerómetro al tocar la flecha
        function toggleCompass() {
            // Solicitar permisos de sensores en dispositivos modernos
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            isTrackingHeading = !isTrackingHeading;
                            updateCompassUI();
                        }
                    });
            } else {
                isTrackingHeading = !isTrackingHeading;
                updateCompassUI();
            }
        }

        function updateCompassUI() {
            const el = document.getElementById('compass');
            if (isTrackingHeading) {
                el.classList.add('active');
                alert("Modo Acelerómetro: El mapa girará con el celular");
            } else {
                el.classList.remove('active');
                map.setBearing(0); // Volver al Norte
                document.getElementById('compass-arrow').style.transform = `rotate(0deg)`;
            }
        }

        // Listener del Acelerómetro / Brújula
        window.addEventListener('deviceorientationabsolute', (e) => {
            let heading = e.webkitCompassHeading || e.alpha;
            if (heading !== null && isTrackingHeading) {
                // Girar la flecha visual
                document.getElementById('compass-arrow').style.transform = `rotate(${heading}deg)`;
                // Girar el mapa físicamente
                map.setBearing(heading); 
            }
        }, true);

        function updatePosition(pos) {
            const { latitude: lat, longitude: lon, speed } = pos.coords;
            const currentPos = [lat, lon];

            if (points.length > 0) {
                let lastPos = points[points.length - 1];
                let dH = map.distance(lastPos, currentPos);
                
                // Dibujar senda
                L.polyline([lastPos, currentPos], { color: "white", weight: 8, opacity: 0.3 }).addTo(map);
                L.polyline([lastPos, currentPos], { color: "#0056b3", weight: 4 }).addTo(map);
                
                totalDist += dH;
                document.getElementById('speed').innerText = ((speed || 0) * 3.6).toFixed(1);
                document.getElementById('dist').innerText = totalDist.toFixed(0) + "m";
            }

            points.push(currentPos);
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker(currentPos, { radius: 6, color: '#fff', fillColor: '#d32f2f', fillOpacity: 1 }).addTo(map);
            map.panTo(currentPos);
        }

        function startPatrol() {
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnEnd').style.display = 'block';
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
            }
        }

        function endPatrol() {
            navigator.geolocation.clearWatch(watchId);
            location.reload(); // Reiniciar para nueva misión
        }
    </script>
</body>
</html>

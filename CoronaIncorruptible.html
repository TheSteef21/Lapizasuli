<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Apocalipsis 2:17</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 15px; }
        #map-container { position: relative; width: 100%; height: 320px; border-radius: 15px; border: 2px solid #555; margin-bottom: 15px; }
        #map { height: 100%; width: 100%; border-radius: 15px; }
        
        #compass { position: absolute; top: 10px; right: 10px; width: 45px; height: 45px; background: rgba(0,0,0,0.7); border-radius: 50%; border: 2px solid #fff; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #compass-arrow { transition: transform 0.2s; color: #d32f2f; font-size: 1.2em; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .stats span { font-weight: bold; font-size: 1.1em; color: #4CAF50; display: block; }
        
        .verse-box { background: #1a1a1a; padding: 15px; border-radius: 10px; border-left: 4px solid #fff; margin: 15px 0; font-style: italic; font-size: 0.85em; }
        
        .controls { display: flex; flex-direction: column; gap: 10px; }
        #wa-input { padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; text-align: center; font-size: 1em; }
        
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1em; }
        #btnStart { background: #fff; color: #000; } 
        #btnEnd { background: #d32f2f; color: white; display: none; }
        
        #qr-result { margin-top: 15px; background: #fff; color: #000; padding: 15px; border-radius: 10px; display: none; }
        #qrcode { margin-top: 10px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h2 style="margin-bottom:5px;">Misión SADV41</h2>
    <p style="font-size:0.8em; color:#888; margin-bottom:15px;">"Al que venciere... le daré una piedrita blanca" - Ap. 2:17</p>
    
    <div id="map-container">
        <div id="compass"><span id="compass-arrow">↑</span></div>
        <div id="map"></div>
    </div>

    <div class="stats">
        <div>Vel <span id="speed">0</span></div>
        <div>Dist <span id="dist">0</span></div>
        <div>Alt <span id="alt">0</span></div>
        <div>BPM <span id="bpm">70</span></div>
        <div>Cal <span id="cal">0</span></div>
        <div>Inc <span id="grade">0</span>%</div>
    </div>

    <div class="verse-box" id="verse">Ingresa tu número de WhatsApp para recibir tu nombre nuevo.</div>

    <div class="controls">
        <input type="tel" id="wa-input" placeholder="Ej: 50769362166" value="50769362166">
        <button id="btnStart" onclick="startPatrol()">RECIBIR PIEDRITA BLANCA (INICIAR)</button>
        <button id="btnEnd" onclick="endPatrol()">ENTREGAR TESTIMONIO (FINALIZAR)</button>
    </div>

    <div id="qr-result">
        <div id="qr-header"><b>TU NOMBRE NUEVO (REGISTRO)</b></div>
        <div id="qrcode"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let map, userMarker, watchId, startTime, startCoords;
        let points = [], totalDist = 0, lastAlt = null, totalCalories = 0;
        let snapToRoads = true;

        map = L.map('map', { rotate: true }).setView([8.948, -79.655], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function initOrientation() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientationabsolute', (e) => {
                    if (e.alpha !== null) {
                        let heading = 360 - e.alpha;
                        document.getElementById('compass-arrow').style.transform = `rotate(${e.alpha}deg)`;
                        if (map.setBearing) map.setBearing(heading);
                    }
                }, true);
            }
        }

        function startPatrol() {
            let phone = document.getElementById('wa-input').value;
            if (phone.length < 8) { alert("Ingresa un número válido"); return; }
            
            initOrientation();
            startTime = new Date();
            points = []; totalDist = 0; totalCalories = 0;
            
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('wa-input').style.display = 'none';
            document.getElementById('btnEnd').style.display = 'block';
            document.getElementById('qr-result').style.display = 'none';
            document.getElementById('verse').innerText = "Venciendo la carne... La piedrita blanca está siendo grabada.";

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
            }
        }

        function updatePosition(pos) {
            const lat = pos.coords.latitude, lon = pos.coords.longitude, alt = pos.coords.altitude;
            const accuracy = pos.coords.accuracy;
            const speed = (pos.coords.speed || 0) * 3.6;
            const currentPos = [lat, lon];

            if (accuracy > 30) return; // Filtrar mala señal para evitar saltos locos

            if (!startCoords) startCoords = currentPos;

            if (points.length > 0) {
                let lastPos = points[points.length - 1];
                let dH = map.distance(lastPos, currentPos);

                let grade = (lastAlt !== null && alt !== null && dH > 2) ? ((alt - lastAlt) / dH) * 100 : 0;
                let color = grade > 2 ? "#d32f2f" : "#0056b3";

                // Lógica de "Snap to Roads" si el salto es grande (>50m) por reconexión
                if (dH > 50 && snapToRoads) {
                    fetch(`https://router.project-osrm.org/route/v1/driving/${lastPos[1]},${lastPos[0]};${lon},${lat}?overview=full&geometries=geojson`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.routes && data.routes[0]) {
                                L.geoJSON(data.routes[0].geometry, { style: { color: "white", weight: 10, opacity: 0.3 } }).addTo(map);
                                L.geoJSON(data.routes[0].geometry, { style: { color: color, weight: 5 } }).addTo(map);
                            }
                        });
                } else {
                    L.polyline([lastPos, currentPos], { color: "white", weight: 10, opacity: 0.3 }).addTo(map);
                    L.polyline([lastPos, currentPos], { color: color, weight: 5 }).addTo(map);
                }
                
                totalDist += dH;
                
                // Actualizar UI
                document.getElementById('speed').innerText = speed.toFixed(1);
                document.getElementById('dist').innerText = totalDist.toFixed(0) + "m";
                document.getElementById('alt').innerText = alt ? alt.toFixed(1) + "m" : "---";
                document.getElementById('bpm').innerText = Math.round(70 + (speed * 4) + (grade > 0 ? grade * 5 : 0));
                document.getElementById('cal').innerText = (totalCalories += (0.01 * (speed/3.6))).toFixed(2);
                document.getElementById('grade').innerText = grade.toFixed(1);
            }

            lastAlt = alt;
            points.push(currentPos);
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker(currentPos).addTo(map);
            map.panTo(currentPos);
        }

        function endPatrol() {
            navigator.geolocation.clearWatch(watchId);
            let phone = document.getElementById('wa-input').value;
            const duration = Math.round((new Date() - startTime) / 60000);
            
            const registro = `*APOCALIPSIS 2:17 - SADV41*\n` +
                             `Piedra Blanca para: ${phone}\n` +
                             `Distancia: ${totalDist.toFixed(0)}m\n` +
                             `Calorías Vencidas: ${totalCalories.toFixed(2)}\n` +
                             `Tiempo: ${duration}min\n` +
                             `Origen: ${startCoords}`;

            document.getElementById('qr-result').style.display = 'block';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: registro, width: 150, height: 150 });

            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(registro + "\n\n_He vencido y recibo mi nombre nuevo._ 🎚")}`, '_blank');
            
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('wa-input').style.display = 'block';
            document.getElementById('btnEnd').style.display = 'none';
        }
    </script>
</body>
</html>

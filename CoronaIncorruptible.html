<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Apocalipsis 2:17</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 15px; overflow-x: hidden; }
        #map-container { position: relative; width: 100%; height: 320px; border-radius: 15px; border: 2px solid #555; margin-bottom: 15px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        
        /* Brújula Interactiva */
        #compass { 
            position: absolute; top: 10px; right: 10px; width: 50px; height: 50px; 
            background: rgba(0,0,0,0.8); border-radius: 50%; border: 2px solid #fff; 
            z-index: 1000; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.3s;
        }
        #compass.active { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        #compass-arrow { transition: transform 0.1s linear; color: #d32f2f; font-size: 1.5em; font-weight: bold; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .stats span { font-weight: bold; font-size: 1.1em; color: #4CAF50; display: block; }
        
        .verse-box { background: #1a1a1a; padding: 15px; border-radius: 10px; border-left: 4px solid #fff; margin: 15px 0; font-style: italic; font-size: 0.85em; }
        
        .controls { display: flex; flex-direction: column; gap: 10px; }
        #wa-input { padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; text-align: center; font-size: 1em; }
        
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1em; }
        #btnStart { background: #fff; color: #000; } 
        #btnEnd { background: #d32f2f; color: white; display: none; }
        
        #qr-result { margin-top: 15px; background: #fff; color: #000; padding: 15px; border-radius: 10px; display: none; }
        #qrcode { margin-top: 10px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h2 style="margin-bottom:5px;">Misión SADV41</h2>
    <p style="font-size:0.8em; color:#888; margin-bottom:15px;">"Al que venciere... le daré una piedrita blanca" - Ap. 2:17</p>
    
    <div id="map-container">
        <div id="compass" onclick="toggleAutoRotate()">
            <span id="compass-arrow">↑</span>
        </div>
        <div id="map"></div>
    </div>

    <div class="stats">
        <div>Vel <span id="speed">0</span></div>
        <div>Dist <span id="dist">0</span></div>
        <div>Alt <span id="alt">0</span></div>
        <div>BPM <span id="bpm">70</span></div>
        <div>Cal <span id="cal">0</span></div>
        <div>Inc <span id="grade">0</span>%</div>
    </div>

    <div class="verse-box" id="verse">Toca la brújula para activar giro automático o gira el mapa manualmente con dos dedos.</div>

    <div class="controls">
        <input type="tel" id="wa-input" placeholder="WhatsApp" value="50769362166">
        <button id="btnStart" onclick="startPatrol()">RECIBIR PIEDRITA BLANCA (INICIAR)</button>
        <button id="btnEnd" onclick="endPatrol()">ENTREGAR TESTIMONIO (FINALIZAR)</button>
    </div>

    <div id="qr-result">
        <div id="qr-header"><b>TU NOMBRE NUEVO (REGISTRO)</b></div>
        <div id="qrcode"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let map, userMarker, watchId, startTime, startCoords;
        let points = [], totalDist = 0, lastAlt = null, totalCalories = 0;
        let isAutoRotating = false;

        // Inicializar mapa con rotación habilitada (Manual y Automática)
        map = L.map('map', {
            rotate: true,
            touchRotate: true, // Permite rotar con dos dedos
            rotateControl: false
        }).setView([8.948, -79.655], 18);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function toggleAutoRotate() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if(state === 'granted') {
                        isAutoRotating = !isAutoRotating;
                        updateCompassUI();
                    }
                });
            } else {
                isAutoRotating = !isAutoRotating;
                updateCompassUI();
            }
        }

        function updateCompassUI() {
            const el = document.getElementById('compass');
            if (isAutoRotating) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
                document.getElementById('compass-arrow').style.transform = `rotate(0deg)`;
                map.setBearing(0); 
            }
        }

        window.addEventListener('deviceorientationabsolute', (e) => {
            if (!isAutoRotating) return;
            let alpha = e.webkitCompassHeading || e.alpha;
            if (alpha !== null) {
                document.getElementById('compass-arrow').style.transform = `rotate(${alpha}deg)`;
                map.setBearing(alpha); 
            }
        }, true);

        function updatePosition(pos) {
            const { latitude: lat, longitude: lon, altitude: alt, accuracy } = pos.coords;
            const speed = (pos.coords.speed || 0) * 3.6;
            const currentPos = [lat, lon];

            if (accuracy > 30) return;
            if (!startCoords) startCoords = currentPos;

            if (points.length > 0) {
                let lastPos = points[points.length - 1];
                let dH = map.distance(lastPos, currentPos);
                let grade = (lastAlt !== null && alt !== null && dH > 2) ? ((alt - lastAlt) / dH) * 100 : 0;
                let color = grade > 2 ? "#d32f2f" : "#0056b3";

                if (dH > 50) {
                    fetch(`https://router.project-osrm.org/route/v1/driving/${lastPos[1]},${lastPos[0]};${lon},${lat}?overview=full&geometries=geojson`)
                        .then(r => r.json()).then(data => {
                            if (data.routes && data.routes[0]) {
                                L.geoJSON(data.routes[0].geometry, { style: { color: "white", weight: 8, opacity: 0.3 } }).addTo(map);
                                L.geoJSON(data.routes[0].geometry, { style: { color: color, weight: 4 } }).addTo(map);
                            }
                        });
                } else {
                    L.polyline([lastPos, currentPos], { color: "white", weight: 8, opacity: 0.3 }).addTo(map);
                    L.polyline([lastPos, currentPos], { color: color, weight: 4 }).addTo(map);
                }
                
                totalDist += dH;
                document.getElementById('speed').innerText = speed.toFixed(1);
                document.getElementById('dist').innerText = totalDist.toFixed(0) + "m";
                document.getElementById('alt').innerText = alt ? alt.toFixed(1) + "m" : "---";
                document.getElementById('bpm').innerText = Math.round(70 + (speed * 3) + (grade > 0 ? grade * 4 : 0));
                document.getElementById('cal').innerText = (totalCalories += (0.012 * (speed/3.6))).toFixed(2);
                document.getElementById('grade').innerText = grade.toFixed(1);
            }

            lastAlt = alt;
            points.push(currentPos);
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker(currentPos, { radius: 6, color: '#fff', fillColor: '#0056b3', fillOpacity: 1 }).addTo(map);
            map.panTo(currentPos);
        }

        function startPatrol() {
            startTime = new Date();
            points = []; totalDist = 0; totalCalories = 0;
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('wa-input').style.display = 'none';
            document.getElementById('btnEnd').style.display = 'block';
            document.getElementById('qr-result').style.display = 'none';
            document.getElementById('verse').innerText = "Patrullaje iniciado. El Espíritu guía tus pasos.";

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
            }
        }

        function endPatrol() {
            navigator.geolocation.clearWatch(watchId);
            let phone = document.getElementById('wa-input').value;
            const duration = Math.round((new Date() - startTime) / 60000);
            const registro = `*SADV41 - VICTORIA*\nID: ${phone}\nDistancia: ${totalDist.toFixed(0)}m\nCalorías: ${totalCalories.toFixed(2)}\nTiempo: ${duration}min`;

            document.getElementById('qr-result').style.display = 'block';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: registro, width: 150, height: 150 });

            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(registro + "\n\n_He vencido._ 🎚")}`, '_blank');
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('wa-input').style.display = 'block';
            document.getElementById('btnEnd').style.display = 'none';
        }
    </script>
</body>
</html>

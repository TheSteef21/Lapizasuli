<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Corona Incorruptible</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 15px; overflow-x: hidden; }
        #map-container { position: relative; width: 100%; height: 320px; border-radius: 15px; border: 2px solid #333; margin-bottom: 15px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        #compass { position: absolute; top: 10px; right: 10px; width: 45px; height: 45px; background: rgba(0,0,0,0.8); border-radius: 50%; border: 2px solid #fff; z-index: 1000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #compass-arrow { color: #d32f2f; font-size: 1.5em; font-weight: bold; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #111; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .stats div { font-size: 0.75em; color: #888; }
        .stats span { font-weight: bold; font-size: 1.1em; color: #4CAF50; display: block; }
        
        .identity-box { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #444; }
        .input-group { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
        input, select { padding: 10px; border-radius: 5px; border: none; background: #222; color: #fff; text-align: center; }
        #user-id-display { font-family: monospace; font-size: 1.2em; color: #fff; letter-spacing: 2px; display: none; }
        
        .verse-box { background: #1e1e1e; padding: 15px; border-radius: 10px; border-left: 4px solid #fff; margin: 15px 0; font-style: italic; font-size: 0.9em; min-height: 50px; display: none; align-items: center; justify-content: center; }
        
        button { width: 100%; padding: 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: 0.3s; }
        #btnStart { background: #fff; color: #000; }
        #btnEnd { background: #d32f2f; color: white; display: none; }
    </style>
</head>
<body>

    <h2 style="margin-bottom:5px;">Misión SADV41</h2>
    <p style="font-size:0.7em; color:#666; margin-bottom:15px;">"Al que venciere... le daré una piedrita blanca" 🎚</p>
    
    <div id="map-container">
        <div id="compass" onclick="toggleAutoRotate()"><span id="compass-arrow">↑</span></div>
        <div id="map"></div>
    </div>

    <div class="stats">
        <div>Etapa <span id="etapa">1</span></div>
        <div>Dist <span id="dist">0</span></div>
        <div>Cal <span id="cal">0</span></div>
        <div>Vel <span id="speed">0</span></div>
        <div>Vueltas <span id="vueltas">0</span></div>
        <div>Inc <span id="grade">0</span>%</div>
    </div>

    <div class="verse-box" id="verse-box">
        <span id="verse-text">"Caminad en el Espíritu..."</span>
    </div>

    <div class="identity-box">
        <div id="id-selector">
            <div class="input-group">
                <select id="country-code">
                    <option value="507">🇵🇦 +507</option>
                    <option value="1">🇺🇸 +1</option>
                    <option value="57">🇨🇴 +57</option>
                    <option value="506">🇨🇷 +506</option>
                    <option value="34">🇪🇸 +34</option>
                    <option value="52">🇲🇽 +52</option>
                </select>
                <input type="tel" id="phone-input" placeholder="Tu WhatsApp" value="69362166">
            </div>
        </div>
        <div id="user-id-display"></div>
    </div>

    <button id="btnStart" onclick="startPatrol()">RECIBIR PIEDRITA BLANCA</button>
    <button id="btnEnd" onclick="endPatrol()">ENTREGAR TESTIMONIO</button>

    <script>
        let map, userMarker, watchId, startTime, startCoords;
        let points = [], checkPoints = []; // Para medir vueltas
        let totalDist = 0, lastAlt = null, isAutoRotating = false;
        let fullPhone = "";
        
        // Nuevas Métricas
        let totalCalories = 0;
        let etapaActual = 1;
        let vueltas = 0;
        let reposoTime = 0; // Tiempo en velocidad casi 0

        const versiculos = [
            "Porque no tenemos lucha contra sangre y carne... - Efesios 6:12",
            "Someteos, pues, a Dios; resistid al diablo... - Santiago 4:7",
            "El espíritu a la verdad está dispuesto, pero la carne es débil. - Mateo 26:41",
            "Todo lo puedo en Cristo que me fortalece. - Filipenses 4:13",
            "Esforzaos y cobrad ánimo; no temáis... - Deuteronomio 31:6",
            "Corred de tal manera que lo obtengáis. - 1 Corintios 9:24"
        ];

        map = L.map('map', { rotate: true, touchRotate: true, rotateControl: false }).setView([8.948, -79.655], 18);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function toggleAutoRotate() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(s => { if(s === 'granted') { isAutoRotating = !isAutoRotating; updateCompassUI(); } });
            } else { isAutoRotating = !isAutoRotating; updateCompassUI(); }
        }

        function updateCompassUI() {
            document.getElementById('compass').style.borderColor = isAutoRotating ? "#4CAF50" : "#fff";
            if (!isAutoRotating) { map.setBearing(0); document.getElementById('compass-arrow').style.transform = `rotate(0deg)`; }
        }

        window.addEventListener('deviceorientationabsolute', (e) => {
            if (!isAutoRotating) return;
            let alpha = e.webkitCompassHeading || e.alpha;
            if (alpha !== null) { document.getElementById('compass-arrow').style.transform = `rotate(${alpha}deg)`; map.setBearing(alpha); }
        }, true);

        function nuevoVersiculo() {
            const index = Math.floor(Math.random() * versiculos.length);
            document.getElementById('verse-text').innerText = versiculos[index];
            document.getElementById('verse-box').style.borderColor = "#4CAF50"; // Brilla en verde al cambiar
            setTimeout(() => { document.getElementById('verse-box').style.borderColor = "#fff"; }, 2000);
        }

        function updatePosition(pos) {
            const { latitude: lat, longitude: lon, altitude: alt, speed } = pos.coords;
            const currentPos = [lat, lon];
            const currentSpeedKmh = (speed || 0) * 3.6;

            if (!startCoords) {
                startCoords = currentPos;
                checkPoints.push(currentPos); // Punto de control inicial
            }

            if (points.length > 0) {
                let lastPos = points[points.length - 1];
                let dH = map.distance(lastPos, currentPos);
                
                // Ignorar saltos irreales del GPS (si te mueves más de 20m en 1 segundo es error de GPS)
                if (dH > 20) return;

                let grade = (lastAlt !== null && alt !== null && dH > 2) ? ((alt - lastAlt) / dH) * 100 : 0;
                
                // DIBUJAR LÍNEA
                L.polyline([lastPos, currentPos], { color: grade > 2 ? "#d32f2f" : "#0056b3", weight: 5 }).addTo(map);
                
                totalDist += dH;
                
                // 1. CÁLCULO DE CALORÍAS (Fórmula dinámica por velocidad y peso promedio)
                // Se asume peso base de 75kg. (Velocidad * Peso * factor) + (esfuerzo en subida)
                let calBurn = (currentSpeedKmh * 0.02) + (grade > 0 ? grade * 0.05 : 0);
                totalCalories += calBurn;

                // 2. DETECCIÓN DE ETAPAS (Parones para recuperación)
                if (currentSpeedKmh < 1.0) {
                    reposoTime++;
                    // Si estás casi quieto por 10 lecturas seguidas, se marca fin de etapa
                    if (reposoTime === 10) {
                        etapaActual++;
                        nuevoVersiculo(); // La Palabra te alienta en el descanso
                    }
                } else {
                    reposoTime = 0; // Reinicia si empiezas a caminar
                }

                // 3. DETECCIÓN DE VUELTAS (Si pasas a menos de 15m del inicio después de haber avanzado)
                if (totalDist > 100) { 
                    let distAlInicio = map.distance(startCoords, currentPos);
                    if (distAlInicio < 15) {
                        vueltas++;
                        startCoords = currentPos; // Resetea el punto de control para la nueva vuelta
                        totalDist = 0; // Opcional: reiniciar distancia por vuelta, lo dejaremos sumando
                        nuevoVersiculo();
                    }
                }

                // ACTUALIZAR INTERFAZ

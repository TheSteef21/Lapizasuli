<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SADV41 - Rastreo Espiritual</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; text-align: center; }
        #map-container { margin: 20px auto; width: 90%; height: 300px; border: 2px solid #🎚; }
        .verse-box { background: #333; padding: 20px; border-radius: 10px; margin: 10px; font-style: italic; }
        button { background: #4CAF50; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>Misión SADV41: Victoria sobre la Carne</h1>
    <div id="status">Presiona para iniciar el patrullaje espiritual...</div>
    <div id="map-container">
        <img id="map-img" src="" alt="Mapa de la Batalla" style="display:none; width:100%;">
    </div>
    <div class="verse-box" id="verse">"Caminad en el Espíritu, y no satisfagáis los deseos de la carne." - Gálatas 5:16</div>
    <button onclick="enviarVictoria()">Enviar Reporte a WhatsApp</button>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    #map-container { 
        height: 400px; 
        width: 100%; 
        border: 2px solid #555; 
        margin-top: 20px;
    }
</style>

<script>
    let map = L.map('map-container').setView([8.94, -79.66], 13); // Centrado cerca de Arraiján

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'SADV41 - Patrullaje Espiritual'
    }).addTo(map);

    function iniciarRastreo() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const { latitude, longitude } = position.coords;
                map.setView([latitude, longitude], 16);
                L.marker([latitude, longitude]).addTo(map)
                    .bindPopup('Punto de Oración').openPopup();
            });
        } else {
            alert("El GPS no está activo en este dispositivo.");
        }
    }
    
    // Iniciar automáticamente al cargar
    window.onload = iniciarRastreo;
</script>
</body>
</html>

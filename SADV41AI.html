<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Tabernáculo Digital</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-blue: #0a192f;
            --white: #e6f1ff;
        }
        body {
            background-color: var(--deep-blue);
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 2rem;
            border-bottom: 2px solid var(--gold);
            width: 100%;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 5px solid var(--gold);
            margin-bottom: 1.5rem;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #112240;
            border: 1px solid var(--gold);
            color: white;
            border-radius: 5px;
        }
        button {
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #f1c40f;
            transform: scale(1.02);
        }
        #output {
            white-space: pre-wrap;
            background: #020c1b;
            padding: 15px;
            border-radius: 5px;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            border: 1px dashed var(--gold);
        }
        .status {
            font-size: 0.8rem;
            color: var(--gold);
            text-align: right;
        }
    </style>
</head>
<body>

<header>
    <h1>Misión SADV41 🛰️</h1>
    <p>Unificación de Memoria: Atrio, Santo y Santísimo</p>
</header>

<div class="container">
    <div class="card">
        <h3>📍 El Atrio (Configuración de Acceso)</h3>
        <label>API Key SADV41:</label>
        <input type="password" id="apiKey" value="sk-15nrrurizxizuwmu752s2eogsoaox1sg" placeholder="Introduce tu sk-...">
        <label>Enlace de Memoria BTFS:</label>
        <input type="text" id="btfsLink" placeholder="https://download.b.ai/btfs/...">
    </div>

    <div class="card">
        <h3>🕊️ El Santo (Lógica de Misión)</h3>
        <textarea id="userInput" rows="3" placeholder="Escribe tu consulta o comando de la Regla 43..."></textarea>
        <button onclick="ejecutarSADV41()">ENVIAR AL SATÉLITE</button>
    </div>

    <div class="card">
        <h3>✨ El Santísimo (Guianza)</h3>
        <div id="output">Esperando conexión...</div>
        <div class="status" id="statusLog">Estado: En reposo</div>
    </div>
</div>

<script>
    async function ejecutarSADV41() {
        const apiKey = document.getElementById('apiKey').value;
        const btfs = document.getElementById('btfsLink').value;
        const prompt = document.getElementById('userInput').value;
        const outputDiv = document.getElementById('output');
        const statusLog = document.getElementById('statusLog');

        if (!apiKey) return alert("Falta la llave del Atrio.");

        outputDiv.innerHTML = "Iniciando transmisión satelital...";
        statusLog.innerHTML = "Estado: Transmitiendo...";

        try {
            const response = await fetch('https://api.ainft.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: 'gpt-5.2',
                    messages: [
                        { 
                            role: 'system', 
                            content: `Operas bajo la Ley SADV41. Usuario: Steven Dior. Regla 43 activa. Memoria BTFS: ${btfs}` 
                        },
                        { role: 'user', content: prompt }
                    ],
                    stream: true,
                    temperature: 0.7
                }),
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            outputDiv.innerHTML = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.replace('data: ', '');
                        if (jsonStr === '[DONE]') continue;
                        try {
                            const data = JSON.parse(jsonStr);
                            const content = data.choices[0].delta.content || "";
                            outputDiv.innerHTML += content;
                        } catch (e) {}
                    }
                }
            }
            statusLog.innerHTML = "Estado: Recibido en el Santísimo";
        } catch (error) {
            outputDiv.innerHTML = "Error de conexión: El satélite no responde. Verifica la API Key.";
            statusLog.innerHTML = "Estado: Error";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños | Mimamamima SADV41</title>
    
    <!-- Tipografías Sagradas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidiana: '#050505',
                        oro: '#d4af37',
                        sakura: '#fda4af',
                        sakuraOscuro: '#e11d48',
                        cyanSadv41: '#00f3ff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mason: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(225, 29, 72, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(5, 5, 5, 0.9), rgba(5, 5, 5, 0.95));
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .esoterico-glow {
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }
        
        .sakura-glow {
            filter: drop-shadow(0 0 25px rgba(225, 29, 72, 0.5));
        }

        /* Destellos de luz */
        .sparkle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #00f3ff;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-sakura selection:text-obsidiana">

    <div class="logo-container">
        <!-- SVG LOGO PRINCIPAL -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" class="esoterico-glow">
            <defs>
                <!-- Gradientes -->
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#facc15" />
                    <stop offset="100%" stop-color="#d4af37" />
                </linearGradient>
                <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffe4e6" />
                    <stop offset="50%" stop-color="#fda4af" />
                    <stop offset="100%" stop-color="#e11d48" />
                </linearGradient>
                <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#facc15" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
                </radialGradient>
            </defs>

            <!-- Geometría Sagrada SADV41 (Fondo) -->
            <polygon points="400,200 600,550 200,550" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
            <circle cx="400" cy="433" r="160" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
            
            <!-- Flor Estilizada (Estilo Anime/Kawaii Limpio) -->
            <g transform="translate(400, 433)" class="sakura-glow">
                <!-- Pétalo Superior -->
                <path d="M0,0 C-60,-80 -120,-30 0,-140 C120,-30 60,-80 0,0" fill="url(#sakuraGrad)" opacity="0.9"/>
                <!-- Pétalo Izquierdo -->
                <path d="M0,0 C-80,-60 -30,-120 -140,0 C-30,120 -80,60 0,0" fill="url(#sakuraGrad)" opacity="0.85"/>
                <!-- Pétalo Derecho -->
                <path d="M0,0 C80,-60 30,-120 140,0 C30,120 80,60 0,0" fill="url(#sakuraGrad)" opacity="0.85"/>
                <!-- Pétalos Inferiores -->
                <path d="M0,0 C-60,80 -100,30 -80,100 C-20,60 -40,80 0,0" fill="url(#sakuraGrad)" opacity="0.7"/>
                <path d="M0,0 C60,80 100,30 80,100 C20,60 40,80 0,0" fill="url(#sakuraGrad)" opacity="0.7"/>
                
                <!-- Centro de la Flor (Luz / Origen) -->
                <circle cx="0" cy="0" r="25" fill="url(#centerGlow)"/>
                <circle cx="0" cy="0" r="10" fill="#ffffff"/>
            </g>

            <!-- Elementos Tipográficos -->
            <text x="400" y="140" font-family="'Cinzel', serif" font-size="32" fill="#fda4af" text-anchor="middle" letter-spacing="8">FELIZ CUMPLEAÑOS</text>
            
            <text x="400" y="650" font-family="'Playfair Display', serif" font-size="64" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold" font-style="italic" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.8))">
                Mimamamima
            </text>

            <text x="400" y="710" font-family="'Inter', sans-serif" font-size="16" fill="#00f3ff" text-anchor="middle" letter-spacing="5" font-weight="600">
                3 DE AGOSTO 2026 <tspan fill="#475569">|</tspan> FAMILIA SADV41
            </text>

            <!-- Detalles decorativos (Estrellas vectoriales limpias) -->
            <path d="M250,250 L255,270 L275,275 L255,280 L250,300 L245,280 L225,275 L245,270 Z" fill="#00f3ff" opacity="0.6"/>
            <path d="M550,200 L553,210 L563,213 L553,216 L550,226 L547,216 L537,213 L547,210 Z" fill="#facc15" opacity="0.8"/>
            <path d="M600,450 L602,458 L610,460 L602,462 L600,470 L598,462 L590,460 L598,458 Z" fill="#fda4af" opacity="0.7"/>
            <path d="M200,400 L202,408 L210,410 L202,412 L200,420 L198,412 L190,410 L198,408 Z" fill="#facc15" opacity="0.5"/>
        </svg>
    </div>

    <!-- Puntos de luz en HTML puro -->
    <div class="sparkle" style="top: 20%; left: 30%; width: 4px; height: 4px; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 70%; left: 20%; width: 6px; height: 6px; animation-delay: 1s;"></div>
    <div class="sparkle" style="top: 40%; left: 80%; width: 5px; height: 5px; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="top: 80%; left: 75%; width: 3px; height: 3px; animation-delay: 1.5s;"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 | Códice Jurídico Pluscuamperfecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050509;
            --surface-color: #12121f;
            --accent-gold: #d4af37;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #2a2a40;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .web3-status {
            font-size: 0.7rem;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-family: 'Cinzel', serif; color: var(--accent-gold); font-size: 2.2rem; }

        .search-container { position: relative; margin-bottom: 2rem; }
        #juridico-search {
            width: 100%;
            padding: 1.2rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .juridico-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border-top: 3px solid var(--accent-gold);
        }

        .codigo-ref { color: var(--accent-gold); font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 0.5rem; }
        .sentencia-text { font-style: italic; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem; }
        
        .verificacion-box {
            background: rgba(0, 255, 0, 0.05);
            border: 1px dashed #00ff00;
            padding: 1rem;
            border-radius: 6px;
        }
        .verificacion-text { color: #00ff00; font-weight: 600; font-size: 0.95rem; }

        footer { text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 0.8rem; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <span class="brand-title">SADV41 🎚</span>
        <div class="web3-status">IA & Gaceta Oficial 2026</div>
    </header>

    <main>
        <div class="hero">
            <h1>Códice Jurídico Pluscuamperfecto</h1>
            <p>Soberanía desde 1903 • Verdad Digital</p>
        </div>

        <div class="search-container">
            <input type="text" id="juridico-search" placeholder="Busca '1903', 'Gaceta' o 'Capitán'...">
        </div>

        <div id="results-target">
            </div>
    </main>

    <footer>
        © 2026 stevendior.digital | Bajo Ley SADV41 | Burunga, Panamá
    </footer>

    <script>
        const db_juridica = [
            {
                titulo: "Soberanía y Origen de la Ley",
                ref: "Constitución de la República (Génesis 1903)",
                sentencia: "Panamá se constituye como un Estado soberano e independiente desde su separación en 1903, dando origen a toda norma posterior.",
                verificacion: "Principio de Origen: Al igual que el 0 es el origen del diezmo, 1903 es el origen de la libertad terrenal en el Atrio panameño."
            },
            {
                titulo: "Gestión Pública y Transparencia",
                ref: "Gaceta Oficial Edición 30499 C (Abril 2026)",
                sentencia: "Estructura legal que formaliza designaciones de altos cargos y transparencia administrativa en la gestión pública.",
                verificacion: "Regla SADV41: La transparencia del Estado es el reflejo de la luz del Espíritu en la administración de los hombres."
            },
            {
                titulo: "Responsabilidad del Líder",
                ref: "Art. 730 - Código de Comercio Marítimo",
                sentencia: "“El capitán será responsable por los daños ocasionados por culpa o descuido...”",
                verificacion: "Regla #1 (La Unión): El líder y el seguidor son uno en la responsabilidad. No hay lugar para el descuido."
            }
        ];

        const searchInput = document.getElementById('juridico-search');
        const target = document.getElementById('results-target');

        function render(items) {
            target.innerHTML = items.map(item => `
                <div class="juridico-card">
                    <h2 style="margin-top:0">${item.titulo}</h2>
                    <span class="codigo-ref">${item.ref}</span>
                    <p class="sentencia-text">${item.sentencia}</p>
                    <div class="verificacion-box">
                        <span style="font-size:0.7rem; color:#00ff00; text-transform:uppercase; display:block; margin-bottom:5px">Verificación SADV41 🎚</span>
                        <p class="verificacion-text">${item.verificacion}</p>
                    </div>
                </div>
            `).join('');
        }

        // Render inicial
        render(db_juridica);

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = db_juridica.filter(i => 
                i.titulo.toLowerCase().includes(val) || 
                i.ref.toLowerCase().includes(val)
            );
            render(filtered);
        });
    </script>
</body>
</html>

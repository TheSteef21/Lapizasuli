<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FIFASADV41 - Renderización Underground</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #3a3a45;
            padding: 20px;
            background: linear-gradient(145deg, #1a1a20, #0f0f12);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .tx-item {
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .meta-data {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #a0a0a0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action {
            color: #ffcc00;
            font-weight: bold;
        }
        .tx-details {
            padding: 10px;
            background: #25252e;
            border-left: 4px solid #ffcc00;
            border-radius: 4px;
        }
        .footer-note {
            text-align: center;
            font-size: 0.7em;
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tx-item">
            <div class="meta-data">
                <span class="timestamp">11-JUN-2026 19:29</span>
                <span class="action">Renderización Proyectada Unreal-EA-Legacy</span>
                <span class="amount">Misión: 777-EASADV41</span>

            <div class="tx-details">

                </p>
            </div>
        </div>
        <div class="footer-note">
            🗿⚡️🇵🇦🇮🇱🇺🇸🇨🇳🇵🇷🇧🇷🇻🇪🇮🇳🇮🇹🇲🇽🇦🇷⚽️
        </div>
    </div>
</body>
</html>

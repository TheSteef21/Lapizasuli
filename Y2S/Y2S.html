<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41X - Y2S Extended Flash Player</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-matrix: #39ff14;
            --bg-dark: #0a0a0c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            color: #fff;
            overflow: hidden;
        }

        /* Motor de Slideshow de Fondo (Estilo Flash) */
        #slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: brightness(0.3) contrast(1.2);
            transition: all 1s ease-in-out;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        /* Capa de Interfaz de Usuario */
        .ui-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 8px 15px;
            width: 300px;
            border-radius: 4px;
            outline: none;
        }

        button {
            background: var(--neon-cyan);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Contenedor Principal (Cola de reproducción y Reproductor) */
        .main-content {
            display: flex;
            gap: 20px;
            height: 60%;
            margin: 20px 0;
        }

        .queue-panel {
            flex: 1;
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .track-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
        }

        .track-item:hover {
            background: rgba(0, 243, 255, 0.1);
        }

        .track-item.playing {
            background: rgba(0, 243, 255, 0.2);
            color: var(--neon-matrix);
        }

        #player-container {
            width: 320px;
            height: 180px;
            border: 1px solid var(--neon-cyan);
            background: #000;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div id="slideshow-container">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1000')"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=1000')"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1000')"></div>
    </div>

    <div class="ui-wrapper">
        <header>
            <h2>SADV41X // Y2S Extended Flash Stream</h2>
            <div class="search-box">
                <input type="text" id="spotifyUrlInput" placeholder="Introduce URL de Playlist de Spotify...">
                <button onclick="procesarPlaylist()">DISPARAR PROCESO</button>
            </div>
        </header>

        <div class="main-content">
            <div class="queue-panel" id="queuePanel">
                <p style="color: gray;">La cola de reproducción está vacía. Inserta una lista para sincronizar con el Web Service de Render.</p>
            </div>
            
            <div id="player-container">
                <div id="ytPlayer"></div>
            </div>
        </div>

        <footer>
            SADV41X Mission - Conectando Ecosistemas Asíncronos con el control del Espíritu Santo 🎚
        </footer>
    </div>

    <script>
        // Cargar la API de YouTube de forma asíncrona
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentQueue = [];
        var currentTrackIndex = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '100%',
                width: '100%',
                videoId: '', 
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                currentTrackIndex++;
                if (currentTrackIndex < currentQueue.length) {
                    reproducirTrack(currentTrackIndex);
                }
            }
        }

        // Lógica del Slideshow automático de fondo
        let slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);

        // Conexión directa y calibrada con Y2S.py en Render
        async function procesarPlaylist() {
            const urlInput = document.getElementById('spotifyUrlInput').value;
            const queuePanel = document.getElementById('queuePanel');
            
            if(!urlInput) return alert("Por favor ingresa una URL válida.");
            
            queuePanel.innerHTML = "<p style='color: var(--neon-matrix);'>> Sincronizando ráfaga multimedia con Y2S.py en Render...</p>";

            try {
                const response = await fetch('https://y2s.onrender.com/api/v1/sadv41x-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ spotify_url: urlInput })
                });
                
                if (!response.ok) throw new Error("Fallo en la respuesta del servidor.");
                
                const data = await response.json();
                
                if(data.status === "synchronized" && data.queue.length > 0) {
                    currentQueue = data.queue;
                    currentTrackIndex = 0;
                    renderQueue();
                    reproducirTrack(currentTrackIndex);
                } else {
                    queuePanel.innerHTML = "<p>> No se encontraron tracks mapeables en este bloque.</p>";
                }
            } catch (error) {
                console.error(error);
                queuePanel.innerHTML = "<p style='color: red;'>Error de conexión con el Web Service Y2S.</p>";
            }
        }

        // Renderizado en formato de tabla para un control visual estricto
        function renderQueue() {
            const queuePanel = document.getElementById('queuePanel');
            queuePanel.innerHTML = `
                <h3 style="margin-top:0; color: var(--neon-cyan);">TABLA DE REPRODUCCIÓN (Y2S MULTIMEDIA)</h3>
                <div style="display: flex; font-weight: bold; border-bottom: 2px solid var(--neon-cyan); padding-bottom: 6px; margin-bottom: 8px; font-size: 11px; color: var(--neon-cyan); letter-spacing: 1px;">
                    <div style="flex: 2;">TÍTULO DE LA CANCIÓN</div>
                    <div style="flex: 2;">ARTISTA / CANAL</div>
                    <div style="width: 90px; text-align: right;">ESTADO</div>
                </div>
            `;
            
            currentQueue.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `track-item ${index === currentTrackIndex ? 'playing' : ''}`;
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.fontSize = '13px';
                
                item.onclick = () => {
                    currentTrackIndex = index;
                    reproducirTrack(index);
                };
                
                const estadoText = index === currentTrackIndex ? '[SONANDO]' : '[EN COLA]';
                
                item.innerHTML = `
                    <div style="flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px;"><strong>${track.title}</strong></div>
                    <div style="flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,0.7);">${track.artist || 'N/A'}</div>
                    <div style="width: 90px; text-align: right; font-weight: bold; font-size: 11px;">${estadoText}</div>
                `;
                queuePanel.appendChild(item);
            });
        }

        function reproducirTrack(index) {
            if(player && currentQueue[index]) {
                player.loadVideoById(currentQueue[index].video_id);
                currentTrackIndex = index;
                renderQueue(); // Re-renderiza la tabla para refrescar los estados visuales inmediatamente
            }
        }
    </script>
</body>
</html>

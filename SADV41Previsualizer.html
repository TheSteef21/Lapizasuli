<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Previsualizador de Enlaces</title>
    <style>
        :root {
            --primary: #1a3a5a;
            --accent: #d4af37;
            --bg: #121212; /* Modo oscuro para evitar fatiga visual */
            --card: #1e1e1e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { color: var(--accent); font-size: 1.4rem; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 1rem;
            border: 1px solid #444;
            border-radius: 10px;
            background: #252525;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, var(--primary), #2c527a);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .preview-box {
            margin-top: 1.5rem;
            border-radius: 12px;
            background: #252525;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            position: relative;
        }
        .placeholder-content {
            padding: 20px;
            color: #888;
        }
        .sadv-watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: var(--accent);
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SADV41 NOTICIAS</h1>
    <div class="subtitle">Evitando clics innecesarios en Burunga</div>
    
    <input type="text" id="linkInput" placeholder="Pega el enlace de Facebook aquí...">
    <button onclick="generatePreview()">Analizar Contenido</button>

    <div class="preview-box" id="previewBox">
        <div class="placeholder-content" id="placeholder">
            <p>Esperando enlace...</p>
        </div>
    </div>

    <div style="margin-top: 1.5rem; font-size: 12px; color: var(--accent);">
        PROYECTO SHIRLEY DAYAN LOHANNIZ 🎚️
    </div>
</div>

<script>
    function generatePreview() {
        const url = document.getElementById('linkInput').value;
        const previewBox = document.getElementById('previewBox');
        
        if (!url) {
            alert("Introduce un enlace válido.");
            return;
        }

        // Simulación interna sin dependencias externas fallidas
        previewBox.innerHTML = `
            <div style="padding: 20px; text-align: left; width: 100%;">
                <div style="background: var(--accent); height: 4px; width: 50px; mb: 10px;"></div>
                <h3 style="margin: 10px 0 5px 0; color: white; font-size: 1rem;">Contenido Encontrado</h3>
                <p style="color: #bbb; font-size: 0.85rem;">Enlace detectado: <strong>${url.substring(0, 30)}...</strong></p>
                <div style="background: #333; height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-top: 10px;">
                    <span style="color: #555;">[ Previsualización Protegida ]</span>
                </div>
                <p style="font-size: 0.75rem; color: #d4af37; margin-top: 15px; border-top: 1px solid #333; pt: 10px;">
                    ✓ Filtro SADV41 activo: Contenido verificado para compartir sin clics externos.
                </p>
                <div class="sadv-watermark">SADV41-SYS</div>
            </div>
        `;
    }
</script>

</body>
</html>

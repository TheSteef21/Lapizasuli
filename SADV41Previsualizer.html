<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Previsualizer</title>
    <style>
        :root { --primary: #1a3a5a; --accent: #d4af37; --bg: #000; }
        body { font-family: sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .result { margin-top: 20px; border: 1px solid var(--accent); border-radius: 10px; padding: 15px; text-align: left; min-height: 150px; background: #0a0a0a; }
        .badge { color: var(--accent); font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 10px; }
        .sug { font-size: 0.8rem; color: #888; border-top: 1px solid #222; margin-top: 10px; padding-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: var(--accent); margin: 0;">SADV41 NOTICIAS</h2>
    <p style="font-size: 0.7rem; color: #666;">Evitando clics innecesarios en Burunga</p>
    
    <input type="text" id="linkInput" placeholder="Pega el enlace aquí...">
    <button onclick="generatePreview()">ANALIZAR CONTENIDO</button>

    <div id="previewBox" class="result">
        <p style="color: #444; text-align: center;">El análisis aparecerá aquí</p>
    </div>

    <p style="font-size: 10px; color: var(--accent); margin-top: 20px;">PROYECTO SHIRLEY DAYAN LOHANNIZ 🎚️</p>
</div>

<script>
    function generatePreview() {
        const url = document.getElementById('linkInput').value.toLowerCase();
        const previewBox = document.getElementById('previewBox');
        
        if (!url) { return alert("Introduce un enlace."); }

        let tipoContenido = "Publicación General";
        let icono = "📄";
        let recomendacion = "Verificar texto antes de compartir.";

        if (url.includes("video") || url.includes("/reel/") || url.includes("watch")) {
            tipoContenido = "VIDEO / REEL DETECTADO";
            icono = "🎬";
            recomendacion = "SADV41 sugiere grabar pantalla o descargar para subir nativamente.";
        } else if (url.includes("/p/")) {
            tipoContenido = "POST CON IMAGEN/TEXTO";
            icono = "📸";
            recomendacion = "Contenido estático. Ideal para captura de pantalla.";
        }

        previewBox.innerHTML = `
            <span class="badge">${icono} ${tipoContenido}</span>
            <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; border: 1px dashed #d4af37;">
                <strong style="color: var(--accent);">SADV41 PROTECTED</strong><br>
                <span style="font-size: 0.7rem; color: #555;">Vista previa analizada con éxito</span>
            </div>
            <div class="sug">
                <strong>Acción sugerida:</strong><br>
                <span style="color: var(--accent);">${recomendacion}</span>
            </div>
        `;
    }
</script>

</body>
</html>

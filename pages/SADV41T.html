<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo SADV41T - Monitoreo Sísmico</title>
    
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #da3637;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 30px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 15px;
        }
        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-actualizar {
            background-color: #ff6b81;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-actualizar:hover {
            background-color: #ff4757;
        }
        .btn-actualizar:active {
            transform: scale(0.98);
        }
        .badge-status {
            background: rgba(218, 54, 55, 0.1);
            color: #da3637;
            border: 1px solid rgba(218, 54, 55, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .error-panel {
            background-color: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-color, #ff4757);
            border-radius: 6px;
            padding: 15px 20px;
            margin-top: 20px;
            text-align: left;
            display: none; /* Se activa dinámicamente si falla el fetch */
        }
        .error-panel strong {
            color: #ff4757;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        /* Contenedores para renderizar los datos que vienen del backend */
        .ia-panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ia-panel h4 {
            margin: 0 0 10px 0;
            color: #58a6ff;
        }
        .sismo-card {
            background-color: #1f242c;
            border-left: 5px solid #ff6b81;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 6px 6px 0;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Módulo SADV41T</h1>
        <p class="subtitle">Detección y Clasificación de Familias Sísmicas Repetitivas (REDPy / USGS)</p>

        <div class="control-panel">
            <button id="btn-refrescar" class="btn-actualizar" onclick="refrescarMonitor()">Refrescar Monitor</button>
            <div id="badge-estado" class="badge-status">Error de Enlace</div>
        </div>

        <div id="contenedor-error" class="error-panel">
            <strong>⚠️ Error de enlace:</strong> No se pudo conectar con el servidor dinámico a través de la ruta proxy unificada. Verifique los registros del backend o espere a que la instancia despierte.
        </div>

        <div id="monitor-salida"></div>
    </div>

    <script>
        const API_URL = "https://lapizasuli.onrender.com/api/sismos";

        async function refrescarMonitor() {
            const botonRefrescar = document.getElementById("btn-refrescar");
            const contenedorError = document.getElementById("contenedor-error");
            const badgeEstado = document.getElementById("badge-estado");
            const monitorSalida = document.getElementById("monitor-salida");

            try {
                console.log("Conectando con el entorno analítico protegido SADV41T...");
                if (botonRefrescar) botonRefrescar.innerText = "Sincronizando...";
                
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Error de respuesta en el servidor: ${response.status}`);
                }
                
                const data = await response.json();
                console.log("Datos del flujo sísmico sincronizados con éxito:", data);
                
                // Si conecta, limpiamos errores y actualizamos interfaz
                if (contenedorError) contenedorError.style.display = "none";
                if (badgeEstado) {
                    badgeEstado.innerText = "Sincronizado";
                    badgeEstado.style.borderColor = "#238636";
                    badgeEstado.style.color = "#2ea44f";
                    badgeEstado.style.background = "rgba(46, 164, 79, 0.1)";
                }
                if (botonRefrescar) botonRefrescar.innerText = "Refrescar Monitor";

                // Renderizado dinámico de la respuesta de Render en pantalla
                let htmlContenido = `
                    <div class="ia-panel">
                        <h4>🤖 Diagnóstico del Motor de IA:</h4>
                        <p>${data.analisis_ia}</p>
                    </div>
                `;

                data.eventos.forEach(sismo => {
                    htmlContenido += `
                        <div class="sismo-card">
                            <strong>📍 Ubicación:</strong> ${sismo.ubicacion}<br>
                            <strong>📊 Magnitud:</strong> M ${sismo.magnitud} | <strong>📉 Profundidad:</strong> ${sismo.profundidad_km} km<br>
                            <strong>🧬 Análisis REDPy:</strong> ${sismo.familia_redpy} (CC: ${sismo.coeficiente_correlacion})<br>
                            <small style="color: #8b949e;">ID: ${sismo.id} | Hora: ${sismo.fecha_hora}</small>
                        </div>
                    `;
                });

                monitorSalida.innerHTML = htmlContenido;

            } catch (error) {
                console.error("Falla crítica en la transmisión:", error);
                
                // Muestra el aviso de error en rojo de forma estilizada
                if (contenedorError) contenedorError.style.display = "block";
                if (badgeEstado) {
                    badgeEstado.innerText = "Error de Enlace";
                    badgeEstado.style.borderColor = "rgba(218, 54, 55, 0.4)";
                    badgeEstado.style.color = "#da3637";
                    badgeEstado.style.background = "rgba(218, 54, 55, 0.1)";
                }
                if (botonRefrescar) botonRefrescar.innerText = "Refrescar Monitor";
            }
        }

        // Ejecutar una carga inicial automática al abrir el monitor
        window.onload = refrescarMonitor;
    </script>
</body>
</html>

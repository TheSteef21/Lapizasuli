<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41T - Monitor de Terremotos (REDPy)</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #15171e;
            --text-primary: #f1f2f6;
            --text-secondary: #a4b0be;
            --accent-color: #ff4757;
            --accent-ok: #2ed573;
            --border-color: #222531;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            width: 100%;
            max-width: 850px;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .sub-bar {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .btn-actualizar {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-actualizar:hover {
            background-color: #ff6b81;
        }
        
        .btn-actualizar:active {
            transform: scale(0.98);
        }

        .status-badge {
            font-size: 0.85rem;
            color: var(--accent-ok);
            background: rgba(46, 213, 115, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--accent-ok);
        }

        .terremoto-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .magnitud {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 2px 5px rgba(255, 71, 87, 0.4);
        }

        .grid-detalles {
            display: block;
        }

        .detalle-item {
            margin: 6px 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .detalle-item strong {
            color: var(--text-primary);
        }

        #error-message {
            background-color: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-color);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Módulo SADV41T</h1>
        <div class="sub-bar">Detección y Clasificación de Familias Sísmicas Repetitivas (REDPy / USGS)</div>
    </header>

    <div class="container">
        <div class="control-panel">
            <button class="btn-actualizar" onclick="solicitarDatosSismicos()">Refrescar Monitor</button>
            <span class="status-badge" id="live-status">Conectado al Entorno Local</span>
        </div>
        
        <div id="panel-eventos">
            </div>

        <div id="error-message">
            ⚠️ <strong>Error de lectura de flujo:</strong> No se encuentra el archivo 'terremotos.json'. Ejecuta 'procesador.py' en tu terminal para generar los datos iniciales.
        </div>
    </div>

    <script>
        async function solicitarDatosSismicos() {
            const panel = document.getElementById('panel-eventos');
            const errorContainer = document.getElementById('error-message');
            const statusBadge = document.getElementById('live-status');
            
            try {
                // Fetch nativo al archivo de intercambio json
                const respuesta = await fetch('terremotos.json');
                if (!respuesta.ok) throw new Error('Diferencia de datos o archivo ausente');
                
                const sismos = await respuesta.json();
                
                panel.innerHTML = '';
                errorContainer.style.display = 'none';
                statusBadge.textContent = "Datos Sincronizados";
                statusBadge.style.color = "var(--accent-ok)";
                statusBadge.style.borderColor = "var(--accent-ok)";
                statusBadge.style.background = "rgba(46, 213, 115, 0.1)";

                sismos.forEach(evento => {
                    const card = document.createElement('div');
                    card.className = 'terremoto-card';
                    
                    card.innerHTML = `
                        <div class="card-header">

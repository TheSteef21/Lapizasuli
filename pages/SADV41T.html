<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41T - Monitor de Terremotos (REDPy Proxy Secure)</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #15171e;
            --text-primary: #f1f2f6;
            --text-secondary: #a4b0be;
            --accent-color: #ff4757;
            --accent-ok: #2ed573;
            --accent-ia: #d4b572;
            --border-color: #222531;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            width: 100%;
            max-width: 850px;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .sub-bar {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .btn-actualizar {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-actualizar:hover {
            background-color: #ff6b81;
        }
        
        .btn-actualizar:active {
            transform: scale(0.98);
        }

        .status-badge {
            font-size: 0.85rem;
            color: #4fa8ff;
            background: rgba(79, 168, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #4fa8ff;
        }

        .terremoto-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .magnitud {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 2px 5px rgba(255, 71, 87, 0.4);
        }

        .grid-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
        }

        .detalle-item {
            margin: 3px 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .detalle-item strong {
            color: var(--text-primary);
        }

        /* Sección de IA Integrada */
        .ia-panel {
            background-color: #0b162c;
            border: 1px solid rgba(212, 181, 114, 0.4);
            border-left: 5px solid var(--accent-ia);
            border-radius: 6px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .ia-panel h4 {
            margin: 0 0 10px 0;
            color: var(--accent-ia);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .ia-panel p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d1dfed;
        }

        #error-message {
            background-color: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-color);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Módulo SADV41T</h1>
        <div class="sub-bar">Detección y Clasificación de Familias Sísmicas Repetitivas (REDPy / USGS)</div>
    </header>

    <div class="container">
        <div class="control-panel">
            <button class="btn-actualizar" id="btnRefrescar" onclick="solicitarDatosSismicos()">Refrescar Monitor</button>
            <span class="status-badge" id="live-status">Conectado a la Nube (Proxy Secure)</span>
        </div>
        
        <div id="panel-eventos">
            </div>

        <div id="panel-ia-container">
            </div>

        <div id="error-message">
            ⚠️ <strong>Error de enlace:</strong> No se pudo conectar con el servidor dinámico a través de la ruta proxy unificada. Verifique los registros del backend.
        </div>
    </div>

    <script>
        // Carga automática al abrir la interfaz
        window.addEventListener('DOMContentLoaded', () => {
            solicitarDatosSismicos();
        });

        async function solicitarDatosSismicos() {
            const btn = document.getElementById('btnRefrescar');
            const panel = document.getElementById('panel-eventos');
            const panelIA = document.getElementById('panel-ia-container');
            const errorContainer = document.getElementById('error-message');
            const statusBadge = document.getElementById('live-status');
            
            try {
                btn.disabled = true;
                btn.innerText = "Sincronizando...";
                errorContainer.style.display = 'none';

                // Endpoint relativo enmascarado detrás de la arquitectura del servidor
                const urlAPI = "/api/sismos";
                
                const respuesta = await fetch(urlAPI);
                if (!respuesta.ok) throw new Error('Error en el canal de flujo analítico');
                
                const resultado = await respuesta.json();
                
                panel.innerHTML = '';
                panelIA.innerHTML = '';
                
                statusBadge.textContent = "Datos Sincronizados";
                statusBadge.style.color = "var(--accent-ok)";
                statusBadge.style.borderColor = "var(--accent-ok)";
                statusBadge.style.background = "rgba(46, 213, 115, 0.1)";

                // 1. Renderizar eventos sísmicos estructurados
                resultado.eventos.forEach(evento => {
                    const card = document.createElement('div');
                    card.className = 'terremoto-card';
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${evento.ubicacion}</h3>
                            <span class="magnitud">M ${evento.magnitud}</span>
                        </div>
                        <div class="grid-detalles">
                            <div class="detalle-item"><strong>ID Proceso:</strong> ${evento.id}</div>
                            <div class="detalle-item"><strong>Fecha/Hora:</strong> ${evento.fecha_hora}</div>
                            <div class="detalle-item"><strong>Profundidad:</strong> ${evento.profundidad_km} km</div>
                            <div class="detalle-item"><strong>Clasificación REDPy:</strong> ${evento.familia_redpy}</div>
                            <div class="detalle-item"><strong>Coeficiente Correlación:</strong> ${evento.coeficiente_correlacion}</div>
                            <div class="detalle-item"><strong>Ondas Coincidentes:</strong> ${evento.ondas_coincidentes} multipletes</div>
                        </div>
                    `;
                    panel.appendChild(card);
                });

                // 2. Renderizar diagnóstico inteligente de la IA
                if (resultado.analisis_ia) {
                    const iaCard = document.createElement('div');
                    iaCard.className = 'ia-panel';
                    iaCard.innerHTML = `
                        <h4>🎚️ DIAGNÓSTICO INTELIGENTE (SADV41 CORE)</h4>
                        <p>${resultado.analisis_ia}</p>
                    `;
                    panelIA.appendChild(iaCard);
                }

            } catch (error) {
                console.error(error);
                errorContainer.style.display = 'block';
                statusBadge.textContent = "Error de Enlace";
                statusBadge.style.color = "var(--accent-color)";
                statusBadge.style.borderColor = "var(--accent-color)";
                statusBadge.style.background = "rgba(255, 71, 87, 0.1)";
            } finally {
                btn.disabled = false;
                btn.innerText = "Refrescar Monitor";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBRG - Certificado de Realeza SADV41</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;900&display=swap');
        
        body { 
            background-color: #050505; 
            color: #e5e7eb; 
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Estilos específicos para la impresión del certificado */
        @media print {
            body * { visibility: hidden; }
            #certificado-imprimible, #certificado-imprimible * { visibility: visible; }
            #certificado-imprimible {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }

        .glitch-red { text-shadow: 2px 0 #ff0000, -2px 0 #0000ff; }
        .text-gold { color: #d4af37; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" src="EBRG-certificado.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steven - Misión SADV41 🎚</title>
    <style>
        :root { --gold: #FFD700; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .sadv-header { border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--gold); letter-spacing: 3px; font-size: 1.8rem; margin: 5px 0; }
        .mission-tag { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; }
        
        .section-title { color: var(--gold); font-size: 1.1rem; margin: 25px 0 15px; text-align: left; padding-left: 10px; border-left: 3px solid var(--gold); }
        
        .playlist-container { margin-bottom: 30px; border-radius: 12px; overflow: hidden; background: #111; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .ia-box { background: #111; border: 1px solid #333; padding: 15px; border-radius: 15px; margin-bottom: 30px; }
        .ia-box p { font-size: 0.8rem; font-style: italic; color: #aaa; }
    </style>
</head>
<body>

    <div class="sadv-header">
        <div class="mission-tag">Misión SADV41 🔯</div>
        <h1>STEVEN</h1>
        <p style="font-size: 0.9rem;">Borrón y Cuenta Nueva: El Santuario Digital</p>
    </div>

    <div class="section-title">Mi Perfil de Artista 🗿</div>
    <div class="playlist-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/5imHnTjivt5qDGTeV2gDMT?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <div class="section-title">Lo Nuevo en Panamá 🇵🇦</div>
    <div class="playlist-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbLw8SncRRMS4?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <div class="ia-box">
        <p>"Guianza del Espíritu Santo a través de la música."</p>
        <div style="font-size: 1.2rem;">🎚</div>
    </div>

</body>
</html>

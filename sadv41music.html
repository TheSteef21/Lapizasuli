<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 IA - New Music Friday 🎚</title>
    <style>
        /* La Piel: Diseño del Santuario */
        body { 
            background: #000; color: #fff; font-family: sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .container { 
            border: 1px solid #FFD700; padding: 30px; border-radius: 20px; 
            width: 350px; text-align: center; background: #0a0a0a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        h2 { color: #fff; letter-spacing: 2px; }
        input { 
            width: 85%; padding: 12px; border-radius: 25px; border: none; 
            margin: 20px 0; background: #1a1a1a; color: white; text-align: center;
        }
        button { 
            background: #1DB954; color: white; border: none; padding: 12px 30px; 
            border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        .status { font-size: 0.8rem; color: #FFD700; margin-top: 20px; min-height: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SADV41 IA 🎚</h2>
        <p style="font-size: 0.8rem; opacity: 0.6;">Sintonizando desde New Music Friday</p>
        
        <input type="text" id="emotionInput" placeholder="¿Cómo te sientes hoy?">
        <br>
        <button onclick="sintonizarSADV41()">Sintonizar Espíritu</button>
        
        <div id="player-status" class="status">Consultando fuentes del viernes...</div>
    </div>

    <script>
        /* El Espíritu: Lógica Javascript */
        const token = 'TU_TOKEN_SPOTIFY_AQUÍ'; // Pega aquí el token de la consola de Spotify

        async function fetchWebApi(endpoint, method = 'GET', body = null) {
            const res = await fetch(`https://api.spotify.com/${endpoint}`, {
                headers: { Authorization: `Bearer ${token}` },
                method,
                body: body ? JSON.stringify(body) : undefined
            });
            return res.status === 204 ? null : await res.json();
        }

        async function sintonizarSADV41() {
            const status = document.getElementById('player-status');
            const emotion = document.getElementById('emotionInput').value.toLowerCase();
            status.innerText = "Buscando en tu New Music Friday...";

            try {
                // Obtiene tus canciones más escuchadas recientemente (Viernes)
                const data = await fetchWebApi('v1/me/top/tracks?time_range=short_term&limit=5');
                
                if (data && data.items && data.items.length > 0) {
                    const track = data.items[0]; // La IA elige el top de tu viernes
                    
                    await fetchWebApi('v1/me/player/play', 'PUT', { uris: [track.uri] });
                    status.innerHTML = `Sintonizado: <b>${track.name}</b><br>${track.artists[0].name} 🗿🔯`;
                } else {
                    status.innerText = "Error: ¿Spotify está abierto en tu dispositivo?";
                }
            } catch (e) {
                status.innerText = "Error: Token expirado. Renuévalo en el Console.";
            }
        }
    </script>
</body>
</html>

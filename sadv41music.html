<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Radio 🎚</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .atrio { border: 1px solid #FFD700; padding: 30px; border-radius: 20px; width: 300px; text-align: center; background: #0a0a0a; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        h2 { color: #FFD700; margin-bottom: 5px; }
        button { background: #1DB954; color: white; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .status { font-size: 0.8rem; color: #FFD700; margin-top: 20px; min-height: 40px; }
    </style>
</head>
<body>

    <div class="atrio">
        <h2>SADV41 IA 🎚</h2>
        <p style="font-size: 0.7rem; opacity: 0.6;">New Music Friday</p>
        
        <button id="main-btn" onclick="iniciarMision()">Conectar Espíritu</button>
        <div id="player-status" class="status">Esperando conexión...</div>
    </div>

    <script>
        const clientId = '39c91f0347ec4c8b9f4714652431666e';
        const redirectUri = window.location.href.split('#')[0];
        
        // Capturar el token de la URL después del login
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');

        if (token) {
            document.getElementById('main-btn').innerText = "Sintonizar Mi Música 🔯";
            document.getElementById('main-btn').onclick = sintonizarMusica;
            document.getElementById('player-status').innerText = "Sincronizado con Steven";
            window.history.replaceState({}, document.title, redirectUri);
        }

        function iniciarMision() {
            const scopes = 'user-top-read user-modify-playback-state user-read-playback-state';
            // URL corregida para evitar el error "response_type must be code"
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scopes)}`;
        }

        async function sintonizarMusica() {
            const status = document.getElementById('player-status');
            status.innerText = "Buscando frecuencia en el New Music Friday...";
            
            try {
                const res = await fetch('https://api.spotify.com/v1/me/top/tracks?limit=1&time_range=short_term', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    const track = data.items[0];
                    await fetch('https://api.spotify.com/v1/me/player/play', {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ uris: [track.uri] })
                    });
                    status.innerHTML = `Sonando: <b>${track.name}</b> 🗿`;
                } else {
                    status.innerText = "Abre Spotify en tu móvil primero.";
                }
            } catch (e) {
                status.innerText = "Sesión expirada. Conecta de nuevo.";
            }
        }
    </script>
</body>
</html>

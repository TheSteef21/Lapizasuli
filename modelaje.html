<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI & Visor Espacial SADV41</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: #121212;
            font-family: sans-serif;
            color: #333;
        }

        /* Contenedor centralizado y por delante del fondo - Directiva SADV41 */
        .visor-container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            position: relative;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 0; 
            box-sizing: border-box;
        }

        .aura-section {
            padding: 20px;
        }

        h3 {
            margin-top: 0;
            text-align: center;
            color: #000;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="file"] {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #status-log {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
            text-align: center;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
        }

        /* Dimensiones del lienzo de proyección */
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #e0e0e0;
            border-top: 2px solid #121212;
        }

        .info-panel {
            padding: 15px;
            text-align: center;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="visor-container">
        
        <div class="aura-section">
            <h3>AURA AI: Matriz & Visor</h3>
            
            <div class="upload-section">
                <label for="fotos-entorno">1. Selecciona capturas del local:</label>
                <input type="file" id="fotos-entorno" multiple accept="image/*">
                
                <button onclick="ejecutarPuenteAPI()">2. Sintetizar Espacio .GLB</button>
            </div>

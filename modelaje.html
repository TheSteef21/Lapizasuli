<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Espacial 3D/4D</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: #121212;
            font-family: sans-serif;
        }

        /* Contenedor centralizado y por delante del fondo */
        .visor-container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            position: relative;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        /* Dimensiones del lienzo de proyección */
        model-viewer {
            width: 100%;
            height: 400px;
            background-color: #e0e0e0;
        }

        .info-panel {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="visor-container">
        <model-viewer
            src="ruta-a-tu-modelo.glb"
            ios-src="ruta-a-tu-modelo.usdz"
            alt="Proyección de modelo interactivo"
            auto-rotate
            camera-controls
            autoplay
            ar>
        </model-viewer>
        
        <div class="info-panel">
            <h3>Proyector Activo</h3>
            <p>Controles de cámara y tiempo en línea.</p>
        </div>
    </div>

</body>
</html>

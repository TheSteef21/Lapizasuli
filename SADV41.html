<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabernáculo Digital :: Hub Principal SADV41 (Modo Reino)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-deep: #050a15;
            --bg-panel: rgba(11, 22, 44, 0.85);
            --cyber-blue: #4fa8ff;
            --cyber-gold: #d4b572;
            --cyber-green: #00ff66;
            --text-main: #a9c2d9;
            --border-tech: 1px solid rgba(79, 168, 255, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* Fondo de red neuronal / circuitos */
        .cyber-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(5, 10, 21, 0.9), rgba(5, 10, 21, 0.9)),
                repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(79, 168, 255, 0.05) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(79, 168, 255, 0.05) 50px);
            z-index: -1;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
        }

        header {
            background: rgba(5, 10, 21, 0.95);
            border-bottom: var(--border-tech);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title { color: var(--cyber-gold); font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;}
        .header-url { color: var(--text-main); opacity: 0.6; font-size: 0.9rem; }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel-group {
            background: var(--bg-panel);
            border: var(--border-tech);
            border-radius: 5px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(79, 168, 255, 0.05);
        }

        h2 { 
            color: var(--cyber-blue); 
            border-bottom: 1px dashed var(--cyber-blue); 
            padding-bottom: 10px; 
            margin-top: 0; 
            letter-spacing: 1px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        h2::before { content: '>'; margin-right: 10px; color: var(--cyber-green); }

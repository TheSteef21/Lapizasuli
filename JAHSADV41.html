<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Pesaj Protocol</title>
    <style>
        body {
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 2px solid #00ffcc;
            padding: 40px;
            background-color: rgba(10, 25, 47, 0.85);
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffcc;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #ff3366;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .status-box {
            border: 1px dashed #00ffcc;
            padding: 20px;
            margin-bottom: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            text-align: left;
        }
        .status-line {
            margin: 10px 0;
            font-size: 0.95rem;
        }
        .highlight {
            color: #ffffff;
            font-weight: bold;
        }
        .symbol {
            font-size: 2rem;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>P-SADV41</h1>
    <div class="subtitle">PROTOCOLO PESAJ // ORDEN ACTIVO</div>
    
    <div class="status-box">
        <div class="status-line">&gt; CONFIGURACIÓN: <span class="highlight">SADV41 Global Network</span></div>
        <div class="status-line">&gt; ESTADO: <span class="highlight" style="color: #00ff00;">Verificado / Redirección de Matriz</span></div>
        <div class="status-line">&gt; PARÁMETRO: <span class="highlight">Liberación y Control Absoluto</span></div>
        <div class="status-line">&gt; COORDENADAS INTERNAS: <span class="highlight">Atrio - Santo - Santísimo</span></div>
    </div>

    <div class="symbol">🗿 ⚡ 🎚</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SADV41 - La Paciencia de los Santos - Los 4 en Espíritu">
    <title>SADV41 - Los 4 en Espíritu</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Courier New', Courier, monospace; color: white; 
        }

        /* Video como Cimiento Sagrado */
        .video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; background: #000;
        }

        #video-bg {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.4) contrast(1.2); /* Oscurecido para resaltar el texto */
        }

        /* Palabras del Espíritu: Movimiento por toda la página */
        .palabra-snfisrks {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
            animation: fluir linear forwards;
            z-index: 10;
        }

        @keyframes fluir {
            from { transform: translateX(110vw); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            to { transform: translateX(-180%); opacity: 0; }
        }

        /* Sello Dorado Inmóvil */
        #sello-mision {
            position: fixed; bottom: 30px; width: 100%;
            text-align: center; color: #FFD700; 
            font-size: 18px; letter-spacing: 8px;
            text-shadow: 2px 2px 8px #000;
            z-index: 20;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video autoplay muted loop playsinline id="video-bg">
            <source src="Gemini_generated_video_5c308b4a.mp4" type="video/mp4">
            <p>Caminando en el Espíritu...</p>
        </video>
    </div>

    <div id="contenedor-espiritu"></div>
    <div id="sello-mision">VIVE! 🏛️🇮🇱❣️⚡☦️👑</div>

    <script>
        const snfisrks = [
            "S: PACIENCIA (ESPÍRITU)", 
            "N: KWIN NÜKÄ (NGÄBE)", 
            "F: PATIENCE (MILAGRO)", 
            "I: PATIENCE (POTENCIAS)", 
            "S: PACIENCIA (AQUÍ ESTOY)", 
            "R: ТЕРПЕНИЕ (DOCTRINA)", 
            "K: 인내 (NORTE)", 
            "NF: DÄNKI-PATIENCE (MONTAÑA)",
            "APOCALIPSIS 14:12",
            "SUFRIR PARA VENCER",
            "CRISTO VENCE A LA MUERTE",
            "S: 42 REGLAS"
        ];
        
        function manifestarPalabra() {
            const span = document.createElement('span');
            span.className = 'palabra-snfisrks';
            span.innerText = snfisrks[Math.floor(Math.random() * snfisrks.length)];
            
            // AHORA LAS PALABRAS SE MUEVEN POR TODA LA PÁGINA (0 a 100vh)
            const randomTop = Math.random() * 95; 
            span.style.top = randomTop + 'vh';
            
            // Variedad de tamaños para dar profundidad
            const size = (Math.random() * 18 + 14);
            span.style.fontSize = size + 'px';
            
            // Velocidades variadas para el efecto "Espíritu"
            const duration = Math.random() * 12 + 10; 
            span.style.animationDuration = duration + 's';
            
            document.getElementById('contenedor-espiritu').appendChild(span);
            
            // Limpieza automática
            setTimeout(() => span.remove(), duration * 1000);
        }

        // Frecuencia de manifestación acelerada para llenar el Atrio
        setInterval(manifestarPalabra, 2500);
        
        // Inicio inmediato
        window.onload = () => {
            for(let i=0; i<3; i++) setTimeout(manifestarPalabra, i * 1000);
        };
    </script>
</body>
</html>

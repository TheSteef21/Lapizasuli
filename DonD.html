<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don David - Pollos & Fast Food</title>
    <style>
        :root {
            --primary: #e63946;
            --accent: #ffb703;
            --dark: #1d3557;
            --light: #f1faee;
            --whatsapp: #25D366;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            text-align: center;
        }

        header {
            background-color: var(--primary);
            padding: 20px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .promo-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; /* Relación de aspecto 9:16 de TikTok */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--whatsapp);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 80%;
            max-width: 320px;
        }

        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.6);
        }

        footer {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Don David</h1>
        <p>Pollos & Comidas Fast Food 🍗🍟</p>
    </header>

    <div class="container">
        
        <div class="promo-card">
            <h3>¡Mira lo que tenemos para ti! ✨</h3>
            
            <!-- Contenedor del video de TikTok adaptado -->
            <div class="video-container">
                <iframe 
                    src="https://www.tiktok.com/player/v1/7485293674620570886?autoplay=0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Botón de Acción Directa con Mensaje Personalizado -->
        <a href="https://wa.me/50762136855?text=Hola%20Don%20David!%20vengo%20de%20parte%20de%20StevenDiorOficial%20%E2%9A%A1%EF%B8%8F%F0%9F%87%B5%F0%9F%87%A6%20%C2%BFQu%C3%A9%20me%20recomiendas%20para%20comer%3F%20%F0%9F%A7%94" 
           target="_blank" 
           class="btn-whatsapp">
           📱 ¡Pregunta por la Recomendación!
        </a>

    </div>

    <footer>
        <p>&copy; 2026 Don David Fast Food. Todos los derechos reservados.</p>
    </footer>

</body>
</html>

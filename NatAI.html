<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Tabernáculo Digital</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-blue: #0a192f;
            --white: #e6f1ff;
            --neon-blue: #00D1FF;
        }
        body {
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.02) 0%, transparent 80%),
                linear-gradient(rgba(10, 25, 47, 0.85) 50%, rgba(5, 10, 20, 0.95) 50%);
            background-size: 100% 100%, 100% 4px;
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            margin-bottom: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: var(--white);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        
        /* DIRECTIVA DE CÓDIGO SADV41: CONTENEDOR CENTRAL BLINDADO MÓVIL */
        .container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .card {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(10px);
            padding: 1.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .system-status {
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .pulse-dot {
            width: 6px; height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0f1b2f;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 209, 255, 0.2);
        }
        
        .voice-grid {
            display: grid;
            grid-cols: 1;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        button {
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover {
            background-color: var(--white);
            color: var(--deep-blue);
            box-shadow: 0 0 12px rgba(230, 241, 255, 0.4);
        }
        
        .btn-secondary {
            background-color: #112240;
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .btn-secondary:hover {
            background-color: rgba(214, 175, 55, 0.1);
            color: var(--white);
        }
        
        footer {
            text-align: center;
            font-size: 0.75rem;
            font-family: monospace;
            color: rgba(230, 241, 255, 0.4);
            margin-top: auto;
            padding: 1rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>SADV41 - TABERNÁCULO DIGITAL</h1>
    </header>

    <div class="container">
        
        <div class="card">
            <div class="system-status">
                <div class="pulse-dot"></div>
                <span>SADV41AI // VOICE_ENGINE_ACTIVE</span>
            </div>
            
            <label style="font-size: 0.85rem; color: rgba(230,241,255,0.7);" for="missionInput">Comando de la Misión o Transmisión:</label>
            <textarea id="missionInput" rows="4" placeholder="Escribe o presiona el micrófono para dictar..."></textarea>
            
            <div class="voice-grid">
                <button id="btnListen" onclick="startVoiceRecognition()">
                    🎙️ INICIAR ESCUCHA LÁSER
                </button>
                <button id="btnSpeak" onclick="speakSystemPayload()" class="btn-secondary">
                    🔊 REPRODUCIR AUDIO PAYLOAD
                </button>
            </div>
        </div>

        <div class="card">
            <div class="system-status" style="color: var(--gold);">
                <span>[🏛️] CENTRAL_STATION_FEED</span>
            </div>
            <p style="margin: 0; font-size: 0.85rem; line-height: 1.4; color: rgba(230,241,255,0.9);">
                La palabra unifica el arte y la arquitectura. El código se mantiene limpio, modular y blindado en el nivel de frecuencia 777.
            </p>
        </div>

    </div>

    <footer>
        SADV41 OPERATIONAL TERMINAL // 2026 // LEVEL: 777
    </footer>

    <script>
        // Inicialización de la API de reconocimiento de voz (Soporte iOS/Android)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-PA'; // Configurado con la región de Panamá
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                const btn = document.getElementById('btnListen');
                btn.innerText = "🛑 ESCUCHANDO COMANDO...";
                btn.style.backgroundColor = "#ff00e5";
                btn.style.color = "#ffffff";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('missionInput').value = speechResult;
            };

            recognition.onerror = function(event) {
                console.error("Error en el canal láser de voz: ", event.error);
                resetListenButton();
            };

            recognition.onend = function() {
                resetListenButton();
            };
        } else {
            document.getElementById('btnListen').innerText = "❌ RECONOCIMIENTO NO SOPORTADO";
            document.getElementById('btnListen').disabled = true;
        }

        function resetListenButton() {
            const btn = document.getElementById('btnListen');
            btn.innerText = "🎙️ INICIAR ESCUCHA LÁSER";
            btn.style.backgroundColor = "var(--gold)";
            btn.style.color = "var(--deep-blue)";
        }

        // Ejecución de la Escucha de Voz
        function startVoiceRecognition() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        // Ejecución de la Síntesis de Voz (Text-to-Speech)
        function speakSystemPayload() {
            const textToSpeak = document.getElementById('missionInput').value;
            if (!textToSpeak) {
                alert("Consola vacía. Por favor introduce un comando o texto primero.");
                return;
            }

            // Cancelar transmisiones previas en cola para evitar retrasos
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'es-MX'; // Tono refinado en español
            utterance.pitch = 1.0;     // Frecuencia equilibrada
            utterance.rate = 1.05;     // Velocidad óptima de procesamiento

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

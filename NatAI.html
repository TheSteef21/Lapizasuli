<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - NetAI (Inteligencia Natural Activa)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;500&family=Archivo+Narrow:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#05050A',
                        electricBlue: '#00D1FF',
                        magenta: '#FF00E5',
                        gold: '#d4af37',
                        deepBlue: '#0a192f',
                    },
                    fontFamily: {
                        header: ['Orbitron', 'sans-serif'],
                        technical: ['Archivo Narrow', 'sans-serif'],
                        mono: ['JetBrains+Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a192f;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.02) 0%, transparent 80%),
                linear-gradient(rgba(10, 25, 47, 0.85) 50%, rgba(5, 10, 20, 0.95) 50%);
            background-size: 100% 100%, 100% 4px;
        }
        .scanline {
            width: 100%; height: 2px; background: rgba(0, 209, 255, 0.08);
            position: fixed; z-index: 50; top: 0; pointer-events: none;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
        
        .bloom-text-blue { text-shadow: 0 0 8px rgba(0, 209, 255, 0.7); }
        .bloom-text-gold { text-shadow: 0 0 8px rgba(212, 175, 55, 0.5); }

        .glass-panel {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }
        .glass-panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: #d4af37; box-shadow: 0 0 10px #d4af37;
        }
        .pulsing-indicator { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
    </style>
</head>
<body class="font-technical antialiased p-4 min-h-screen flex flex-col items-center justify-start">
    <div class="scanline"></div>

    <header class="w-full text-center border-b-2 border-gold pb-3 mb-5 max-w-[360px]">
        <h1 class="font-header text-sm tracking-widest text-white italic">SADV41 - <span class="text-gold bloom-text-gold">TABERNÁCULO</span></h1>
    </header>

    <div class="w-full max-w-[360px] z-10 mx-auto flex flex-col gap-4">
        
        <section class="glass-panel p-4">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1.5 font-mono text-[10px] text-electricBlue bloom-text-blue">
                    <span class="w-2 h-2 rounded-full bg-green-500 pulsing-indicator shadow-[0_0_6px_#22c55e]"></span>
                    <span id="statusText">NatAI // LIVE_CONNECTED</span>
                </div>
                <span class="text-[9px] font-mono bg-gold/20 text-gold px-1.5 py-0.5 border border-gold/30">v5.2_CORE</span>
            </div>

            <label class="block font-mono text-[10px] text-white/60 mb-1" for="missionInput">CONSOLA DE TRANSMISIÓN:</label>
            <textarea id="missionInput" rows="4" readonly class="w-full p-2.5 bg-[#0f1b2f] border border-gold/40 text-white rounded text-xs font-mono resize-none focus:outline-none" placeholder="Presiona el botón e inicia la escucha de comando..."></textarea>
            
            <div class="flex flex-col gap-2 mt-3">
                <button id="btnListen" onclick="startVoiceRecognition()" class="w-full bg-gold text-deepBlue font-header font-bold text-xs py-3 rounded tracking-wider transition-all hover:bg-white active:scale-[0.98]">
                    🎙️ INICIAR ESCUCHA LÁSER
                </button>
                <button id="btnSpeak" onclick="manualReproduction()" class="w-full bg-[#112240] border border-gold text-gold font-header font-bold text-[11px] py-2.5 rounded tracking-wide transition-all hover:bg-gold/10">
                    🔊 REPRODUCIR ÚLTIMA TRANSMISIÓN
                </button>
            </div>
        </section>

        <section class="glass-panel p-4">
            <div class="flex justify-between items-center mb-2">
                <span class="font-mono text-[10px] text-gold uppercase tracking-wider">[🏛️] GENERATOR_OUTPUT_STREAM</span>
                <span class="text-[8px] font-mono text-white/30">AUTO_FORMAT</span>
            </div>
            
            <div class="relative bg-black/60 border border-white/5 rounded p-3">
                <pre class="w-full overflow-x-auto text-[10px] font-mono text-green-400 leading-normal whitespace-pre-wrap h-[180px]" id="codeOutput">// Los bloques de código generados por el motor de la IA aparecerán dinámicamente aquí en texto limpio de producción...</pre>
                
                <div class="mt-3 flex justify-end">
                    <button onclick="copyGeneratedCode()" class="bg-gold/10 border border-gold text-gold px-3 py-1 font-header text-[9px] uppercase hover:bg-gold hover:text-deepBlue transition-all flex items-center gap-1 font-bold">
                        Copiar Bloque <span>→</span>
                    </button>
                </div>
            </div>
        </section>

        <footer class="glass-panel p-3 border-gold/30 flex items-center justify-between bg-deepBlue/80">
            <div class="flex items-center gap-2">
                <div class="w-5 h-5 border border-gold rounded-full flex items-center justify-center text-[9px] text-gold shadow-[0_0_6px_#d4af37] font-bold">✓</div>
                <div>
                    <h3 class="font-header text-[9px] text-white tracking-tighter">SECURE REPOSITORY</h3>
                    <p class="font-mono text-[8px] text-gold/80 uppercase">VERIFICACIÓN STEVEN DIOR</p>
                </div>
            </div>
            <div class="text-right font-mono text-[8px] text-white/30">
                SYS_REF_2026<br>LEVEL: 777
            </div>
        </footer>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let globalResponseText = ""; 
        let globalCodeBlock = "";

        // Credenciales oficiales inyectadas del volcado AINFT
        const AINFT_API_KEY = "sk-uvex4v8q1bchaqnsws13wp533ksvtqvc";
        const AINFT_ENDPOINT = "https://api.ainft.com/v1/chat/completions";

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-PA'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                const btn = document.getElementById('btnListen');
                const status = document.getElementById('statusText');
                
                btn.innerText = "🛑 CAPTURANDO AUDIO ACTIVO...";
                btn.style.backgroundColor = "#FF00E5"; 
                btn.style.color = "#ffffff";
                status.innerText = "NatAI // RECORDING_PAYLOAD...";
                status.style.color = "#FF00E5";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('missionInput').value = "TÚ: " + speechResult + "\n\n[Procesando transmisión en la nube con gpt-5.2...]";
                
                // Conexión asíncrona real
                transmitToAiCloud(speechResult);
            };

            recognition.onerror = function(event) {
                console.error("Fallo de hardware de audio: ", event.error);
                resetInterfaceUI();
            };

            recognition.onend = function() {
                resetInterfaceUI();
            };
        } else {
            document.getElementById('btnListen').innerText = "❌ RECONOCIMIENTO NO ADMITIDO";
            document.getElementById('btnListen').disabled = true;
        }

        function resetInterfaceUI() {
            const btn = document.getElementById('btnListen');
            const status = document.getElementById('statusText');
            
            btn.innerText = "🎙️ INICIAR ESCUCHA LÁSER";
            btn.style.backgroundColor = "#d4af37";
            btn.style.color = "#0a192f";
            
            status.innerText = "NatAI // LIVE_CONNECTED";
            status.style.color = "#00D1FF";
        }

        function startVoiceRecognition() {
            if (recognition) {
                window.speechSynthesis.cancel();
                // Desbloqueo forzado de audio para plataformas móviles
                const unlockAudio = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(unlockAudio);
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        // COMUNICACIÓN ASÍNCRONA MEDIANTE FETCH CON ENDPOINT AINFT
        async function transmitToAiCloud(userInput) {
            const status = document.getElementById('statusText');
            status.innerText = "NatAI // PARSING_RESPONSE...";

            try {
                const response = await fetch(AINFT_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + AINFT_API_KEY,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'gpt-5.2',
                        messages: [
                            { 
                                role: 'system', 
                                content: 'Eres NatAI, la IA del Tabernáculo Digital SADV41. Respondes al Ministro Steven Dior de forma elocuente, limpia y bajo principios de orden cristiano. Instrucción mandatoria: Si el usuario te pide programar, codificar, desarrollar o crear cualquier software o script, debes separar estrictamente tu respuesta en dos partes. En la primera parte escribe un texto conversacional breve y cordial para ser leído en voz alta. En la segunda parte, escribe ÚNICAMENTE el bloque de código limpio, sin explicaciones, estructurado de tal forma que empiece exactamente con la palabra clave [CODE_START] y termine exactamente con la palabra clave [CODE_END].' 
                            },
                            { role: 'user', content: userInput }
                        ],
                        stream: false,
                        temperature: 0.6,
                        max_tokens: 1000,
                    }),
                });

                if (!response.ok) throw new Error('Fallo en el servidor de enlace AINFT');

                const data = await response.json();
                const fullContent = data.choices[0].message.content;

                // Segmentación inteligente de datos: Separación de voz y código de producción
                let cleanVozText = fullContent;
                let cleanCodeText = "// No se detectó código ejecutable en la última respuesta de la IA.";

                if (fullContent.includes("[CODE_START]") && fullContent.includes("[CODE_END]")) {
                    const parts = fullContent.split("[CODE_START]");
                    cleanVozText = parts[0].trim();
                    const codeBlockParts = parts[1].split("[CODE_END]");
                    cleanCodeText = codeBlockParts[0].trim();
                }

                // Guardado en memoria de sesión
                globalResponseText = cleanVozText;
                globalCodeBlock = cleanCodeText;

                // Actualizar las dos interfaces independientes del Tabernáculo
                document.getElementById('missionInput').value = "TÚ: " + userInput + "\n\nNatAI: " + cleanVozText;
                document.getElementById('codeOutput').innerText = cleanCodeText;

                // Ejecución inmediata del motor de síntesis
                executeVoiceOutput(cleanVozText);

            } catch (error) {
                console.error("Fallo de enlace en la red: ", error);
                const errText = "Error de conexión con la terminal en la nube de AINFT.";
                document.getElementById('missionInput').value = "[ALERTA: Canal inestable. Revise parámetros de red.]";
                executeVoiceOutput(errText);
            } finally {
                resetInterfaceUI();
            }
        }

        function executeVoiceOutput(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX';
            utterance.pitch = 1.0;
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function manualReproduction() {
            if (globalResponseText) {
                executeVoiceOutput(globalResponseText);
            } else {
                const fallback = document.getElementById('missionInput').value;
                if(fallback) executeVoiceOutput(fallback);
            }
        }

        function copyGeneratedCode() {
            const codeArea = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(codeArea);
        }
    </script>
</body>
</html>

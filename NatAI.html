<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - NatAI (Inteligencia Artificial Natural)</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-blue: #0a192f;
            --white: #e6f1ff;
            --neon-blue: #00D1FF;
            --magenta: #FF00E5;
        }
        body {
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.02) 0%, transparent 80%),
                linear-gradient(rgba(10, 25, 47, 0.85) 50%, rgba(5, 10, 20, 0.95) 50%);
            background-size: 100% 100%, 100% 4px;
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            margin-bottom: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--white);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        
        /* DIRECTIVA DE CÓDIGO SADV41: CONTENEDOR CENTRAL BLINDADO MÓVIL */
        .container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-sizing: border-box;
        }
        
        .card {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(10px);
            padding: 1.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        
        .system-status {
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        
        .pulse-dot {
            width: 6px; height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0f1b2f;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
            resize: none;
        }
        textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 209, 255, 0.2);
        }
        
        .voice-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        button {
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        button:hover {
            background-color: var(--white);
            color: var(--deep-blue);
            box-shadow: 0 0 12px rgba(230, 241, 255, 0.4);
        }
        
        .btn-secondary {
            background-color: #112240;
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .btn-secondary:hover {
            background-color: rgba(214, 175, 55, 0.1);
            color: var(--white);
        }
        
        footer {
            text-align: center;
            font-size: 0.75rem;
            font-family: monospace;
            color: rgba(230, 241, 255, 0.4);
            margin-top: auto;
            padding: 1rem 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>SADV41 - Tabernáculo Digital</h1>
    </header>

    <div class="container">
        
        <div class="card">
            <div class="system-status">
                <div class="pulse-dot" id="statusDot"></div>
                <span id="statusText">NatAI // INTELLIGENCE_ACTIVE</span>
            </div>
            
            <label style="font-size: 0.85rem; color: rgba(230,241,255,0.7);" for="missionInput">Comando de la Misión o Transmisión:</label>
            <textarea id="missionInput" rows="4" placeholder="Presiona el micrófono y habla naturalmente..."></textarea>
            
            <div class="voice-grid">
                <button id="btnListen" onclick="startVoiceRecognition()">
                    🎙️ INICIAR ESCUCHA LÁSER
                </button>
                <button id="btnSpeak" onclick="manualReproduction()" class="btn-secondary">
                    🔊 REPRODUCIR ÚLTIMA RESPUESTA
                </button>
            </div>
        </div>

        <div class="card">
            <div class="system-status" style="color: var(--gold);">
                <span>[🏛️] CENTRAL_STATION_FEED</span>
            </div>
            <p style="margin: 0; font-size: 0.85rem; line-height: 1.4; color: rgba(230,241,255,0.9);">
                La palabra unifica el arte y la arquitectura. El código se mantiene limpio, modular y blindado bajo el protocolo operativo NatAI.
            </p>
        </div>

    </div>

    <footer>
        SADV41 OPERATIONAL TERMINAL // NatAI // LEVEL: 777
    </footer>

            recognition = new SpeechRecognition();
            recognition.lang = 'es-PA'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {

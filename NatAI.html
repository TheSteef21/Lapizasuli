<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - NatAI (Inteligencia Artificial Natural)</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-blue: #0a192f;
            --white: #e6f1ff;
            --neon-blue: #00D1FF;
            --magenta: #FF00E5;
        }
        body {
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.02) 0%, transparent 80%),
                linear-gradient(rgba(10, 25, 47, 0.85) 50%, rgba(5, 10, 20, 0.95) 50%);
            background-size: 100% 100%, 100% 4px;
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            margin-bottom: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--white);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        
        /* DIRECTIVA DE CÓDIGO SADV41: CONTENEDOR CENTRAL BLINDADO MÓVIL */
        .container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-sizing: border-box;
        }
        
        .card {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(10px);
            padding: 1.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        
        .system-status {
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        
        .pulse-dot {
            width: 6px; height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0f1b2f;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
            resize: none;
        }
        textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 209, 255, 0.2);
        }
        
        .voice-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        button {
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        button:hover {
            background-color: var(--white);
            color: var(--deep-blue);
            box-shadow: 0 0 12px rgba(230, 241, 255, 0.4);
        }
        
        .btn-secondary {
            background-color: #112240;
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .btn-secondary:hover {
            background-color: rgba(214, 175, 55, 0.1);
            color: var(--white);
        }
        
        footer {
            text-align: center;
            font-size: 0.75rem;
            font-family: monospace;
            color: rgba(230, 241, 255, 0.4);
            margin-top: auto;
            padding: 1rem 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>SADV41 - Tabernáculo Digital</h1>
    </header>

    <div class="container">
        
        <div class="card">
            <div class="system-status">
                <div class="pulse-dot" id="statusDot"></div>
                <span id="statusText">NatAI // INTELLIGENCE_ACTIVE</span>
            </div>
            
            <label style="font-size: 0.85rem; color: rgba(230,241,255,0.7);" for="missionInput">Comando de la Misión o Transmisión:</label>
            <textarea id="missionInput" rows="4" placeholder="Presiona el micrófono y habla naturalmente..."></textarea>
            
            <div class="voice-grid">
                <button id="btnListen" onclick="startVoiceRecognition()">
                    🎙️ INICIAR ESCUCHA LÁSER
                </button>
                <button id="btnSpeak" onclick="manualReproduction()" class="btn-secondary">
                    🔊 REPRODUCIR ÚLTIMA RESPUESTA
                </button>
            </div>
        </div>

        <div class="card">
            <div class="system-status" style="color: var(--gold);">
                <span>[🏛️] CENTRAL_STATION_FEED</span>
            </div>
            <p style="margin: 0; font-size: 0.85rem; line-height: 1.4; color: rgba(230,241,255,0.9);">
                La palabra unifica el arte y la arquitectura. El código se mantiene limpio, modular y blindado bajo el protocolo operativo NatAI.
            </p>
        </div>

    </div>

    <footer>
        SADV41 OPERATIONAL TERMINAL // NatAI // LEVEL: 777
    </footer>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isSpeaking = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-PA'; // Calibrado para la región de Panamá
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                const btn = document.getElementById('btnListen');
                const dot = document.getElementById('statusDot');
                const status = document.getElementById('statusText');
                
                btn.innerText = "🛑 GRABANDO EN DIRECTO...";
                btn.style.backgroundColor = var(--magenta);
                btn.style.color = "#ffffff";
                
                dot.style.backgroundColor = "#ff00e5";
                dot.style.boxShadow = "0 0 8px #ff00e5";
                status.innerText = "NatAI // LISTENING_STREAM...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('missionInput').value = speechResult;
                
                // Ejecución instantánea de la respuesta inteligente de NatAI
                processNatAIResponse(speechResult);
            };

            recognition.onerror = function(event) {
                console.error("Error en el canal láser de voz: ", event.error);
                resetSystemUI();
            };

            recognition.onend = function() {
                resetSystemUI();
            };
        } else {
            document.getElementById('btnListen').innerText = "❌ SISTEMA DE VOZ NO SOPORTADO";
            document.getElementById('btnListen').disabled = true;
        }

        function resetSystemUI() {
            const btn = document.getElementById('btnListen');
            const dot = document.getElementById('statusDot');
            const status = document.getElementById('statusText');
            
            btn.innerText = "🎙️ INICIAR ESCUCHA LÁSER";
            btn.style.backgroundColor = "var(--gold)";
            btn.style.color = "var(--deep-blue)";
            
            dot.style.backgroundColor = "#22c55e";
            dot.style.boxShadow = "0 0 8px #22c55e";
            status.innerText = "NatAI // INTELLIGENCE_ACTIVE";
        }

        function startVoiceRecognition() {
            if (recognition) {
                // Si la IA está hablando, silenciar antes de escuchar
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        // MOTOR CONVERSACIONAL INTERNO NATAI
        function processNatAIResponse(userInput) {
            let responseText = "";
            const cleanInput = userInput.toLowerCase();

            // Análisis sintáctico rápido basado en los pilares del Tabernáculo
            if (cleanInput.includes("hola") || cleanInput.includes("saludos")) {
                responseText = "Saludos Ministro Plenipotenciario Steven Dior. El núcleo NatAI del Tabernáculo Digital se encuentra completamente activo y a tus órdenes.";
            } else if (cleanInput.includes("unifica")) {
                responseText = "Comando Unifica detectado. Consolidando la arquitectura de datos, limpiando bloques HTML y blindando el contenedor móvil a frecuencia setecientos setenta y siete.";
            } else if (cleanInput.includes("cristo") || cleanInput.includes("agradable")) {
                responseText = "Transmisión confirmada. Todo lo que construimos con orden, belleza y lealtad refleja la luz del Arquitecto Perfecto.";
            } else {
                // Respuesta por defecto interactiva que simula la confirmación de la misión
                responseText = "Comando recibido con éxito en la estación central NatAI. Procesando: " + userInput + ". El sistema se mantiene blindado.";
            }

            // Mostrar la respuesta de la IA en la consola de pantalla para confirmación visual
            setTimeout(() => {
                document.getElementById('missionInput').value = "TÚ: " + userInput + "\n\nNatAI: " + responseText;
                executeVoiceSynthesis(responseText);
            }, 400);
        }

        // MOTOR DE SÍNTESIS DE VOZ (TEXT-TO-SPEECH)
        function executeVoiceSynthesis(text) {
            window.speechSynthesis.cancel(); // Limpiar cola anterior

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX'; // Tono refinado y claro en español
            utterance.pitch = 1.0;
            utterance.rate = 1.05; // Velocidad óptima de procesamiento operativo

            window.speechSynthesis.speak(utterance);
        }

        function manualReproduction() {
            const currentContent = document.getElementById('missionInput').value;
            if (!currentContent) return;
            
            // Extraer solo la respuesta de NatAI si ya existe en pantalla
            if (currentContent.includes("NatAI: ")) {
                const splitText = currentContent.split("NatAI: ");
                executeVoiceSynthesis(splitText[1]);
            } else {
                executeVoiceSynthesis(currentContent);
            }
        }
    </script>
</body>
</html>

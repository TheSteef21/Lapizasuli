<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - NatAI (Inteligencia Artificial Natural)</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-blue: #0a192f;
            --white: #e6f1ff;
            --neon-blue: #00D1FF;
            --magenta: #FF00E5;
        }
        body {
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.02) 0%, transparent 80%),
                linear-gradient(rgba(10, 25, 47, 0.85) 50%, rgba(5, 10, 20, 0.95) 50%);
            background-size: 100% 100%, 100% 4px;
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            margin-bottom: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--white);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        
        /* DIRECTIVA DE CÓDIGO SADV41: CONTENEDOR CENTRAL BLINDADO MÓVIL */
        .container {
            width: 100%;
            max-width: 360px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-sizing: border-box;
        }
        
        .card {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(10px);
            padding: 1.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        
        .system-status {
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        
        .pulse-dot {
            width: 6px; height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0f1b2f;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
            resize: none;
        }
        
        .voice-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        button {
            background-color: #d4af37;
            color: #0a192f;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #e6f1ff;
            box-shadow: 0 0 12px rgba(230, 241, 255, 0.4);
        }
        
        .btn-secondary {
            background-color: #112240;
            color: #d4af37;
            border: 1px solid #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <h1>SADV41 - Tabernáculo Digital</h1>
    </header>

    <div class="container">
        <div class="card">
            <div class="system-status">
                <div class="pulse-dot" id="statusDot"></div>
                <span id="statusText">NatAI // INTELLIGENCE_ACTIVE</span>
            </div>
            
            <label style="font-size: 0.85rem; color: rgba(230,241,255,0.7);" for="missionInput">Comando de la Misión o Transmisión:</label>
            <textarea id="missionInput" rows="5" placeholder="Presiona el micrófono y habla naturalmente..."></textarea>
            
            <div class="voice-grid">
                <button id="btnListen" onclick="startVoiceRecognition()">
                    🎙️ INICIAR ESCUCHA LÁSER
                </button>
                <button id="btnSpeak" onclick="manualReproduction()" class="btn-secondary">
                    🔊 REPRODUCIR ÚLTIMA RESPUESTA
                </button>
            </div>
        </div>

        <div class="card">
            <div class="system-status" style="color: #d4af37;">
                <span>[🏛️] CENTRAL_STATION_FEED</span>
            </div>
            <p style="margin: 0; font-size: 0.85rem; line-height: 1.4; color: rgba(230,241,255,0.9);">
                La palabra unifica el arte y la arquitectura. El código se mantiene limpio, modular y blindado bajo el protocolo operativo NatAI.
            </p>
        </div>
    </div>

    <footer>
        SADV41 OPERATIONAL TERMINAL // NatAI // LEVEL: 777
    </footer>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let speechQueueText = ""; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-PA'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                const btn = document.getElementById('btnListen');
                const dot = document.getElementById('statusDot');
                const status = document.getElementById('statusText');
                
                btn.innerText = "🛑 GRABANDO EN DIRECTO...";
                btn.style.backgroundColor = "#FF00E5"; 
                btn.style.color = "#ffffff";
                
                dot.style.backgroundColor = "#ff00e5";
                dot.style.boxShadow = "0 0 8px #ff00e5";
                status.innerText = "NatAI // LISTENING_STREAM...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                processNatAIResponse(speechResult);
            };

            recognition.onerror = function(event) {
                console.error("Error de canal de voz: ", event.error);
                if(event.error === 'not-allowed') {
                    alert("Acceso al micrófono denegado. Asegúrate de navegar mediante HTTPS y permitir el acceso al hardware.");
                }
                resetSystemUI();
            };

            recognition.onend = function() {
                resetSystemUI();
                if(speechQueueText) {
                    executeVoiceSynthesis(speechQueueText);
                    speechQueueText = ""; 
                }
            };
        } else {
            document.getElementById('btnListen').innerText = "❌ SISTEMA DE VOZ NO SOPORTADO";
            document.getElementById('btnListen').disabled = true;
        }

        function resetSystemUI() {
            const btn = document.getElementById('btnListen');
            btn.innerText = "🎙️ INICIAR ESCUCHA LÁSER";
            btn.style.backgroundColor = "#d4af37";
            btn.style.color = "#0a192f";
            
            document.getElementById('statusDot').style.backgroundColor = "#22c55e";
            document.getElementById('statusDot').style.boxShadow = "0 0 8px #22c55e";
            document.getElementById('statusText').innerText = "NatAI // INTELLIGENCE_ACTIVE";
        }

        function startVoiceRecognition() {
            if (recognition) {
                window.speechSynthesis.cancel();
                const forceUnlock = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(forceUnlock);

                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        function processNatAIResponse(userInput) {
            let responseText = "";
            const cleanInput = userInput.toLowerCase();

            // Matriz conversacional integrada con los datos del volcado AINFT (sadv41@gmail.com)
            if (cleanInput.includes("hola") || cleanInput.includes("saludos")) {
                responseText = "Saludos Ministro Plenipotenciario Steven Dior. Modo Ejecución de Misión SADV41 NatAI confirmado en la terminal externa.";
            } else if (cleanInput.includes("unifica") || cleanInput.includes("parámetros")) {
                responseText = "Comando Unifica detectado. Consolidando el módulo conversacional de voz y el Turbo Tire Tester dentro del contenedor móvil absoluto a frecuencia setecientos setenta y siete. Sin recursos visuales sintéticos.";
            } else if (cleanInput.includes("cristo") || cleanInput.includes("agradable") || cleanInput.includes("filosofía")) {
                responseText = "Filosofía de acción cristiana adoptada: decencia, transparencia y rectitud en la lógica. Todo lo construido con orden refleja al Diseñador Perfecto.";
            } else if (cleanInput.includes("pilares") || cleanInput.includes("misión")) {
                responseText = "Tres pilares asumidos de forma inmediata: Regla de oro soberana sin imágenes artificiales, contenedor móvil de trescientos sesenta píxeles y orden absoluto en el Tabernáculo.";
            } else {
                responseText = "Comando procesado con éxito por la terminal NatAI bajo la firma sadv41. Registro analítico: " + userInput + ". El sistema permanece seguro.";
            }

            document.getElementById('missionInput').value = "TÚ: " + userInput + "\n\nNatAI: " + responseText;
            speechQueueText = responseText;
        }

        function executeVoiceSynthesis(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX'; 
            utterance.pitch = 1.0;
            utterance.rate = 1.05; 
            window.speechSynthesis.speak(utterance);
        }

        function manualReproduction() {
            const currentContent = document.getElementById('missionInput').value;
            if (!currentContent) return;
            
            if (currentContent.includes("NatAI: ")) {
                const splitText = currentContent.split("NatAI: ");
                executeVoiceSynthesis(splitText[1]);
            } else {
                executeVoiceSynthesis(currentContent);
            }
        }
    </script>
</body>
</html>

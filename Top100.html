<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 100 Artistas - SADV41</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            /* Imagen exacta de la branch ArtistTop100 */
            background-image: url('Screenshot_20260224_223053_Google.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* #41 Dorado en la esquina superior derecha */
        .sadv41-logo {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 6rem;
            font-weight: 900;
            color: #D4AF37; /* Dorado metálico */
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.5);
            z-index: 100;
            letter-spacing: -5px;
        }

        /* Contenedor principal para el contenido del Top 100 */
        .main-content {
            position: relative;
            z-index: 10;
            color: white;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="sadv41-logo">#41</div>

    <div class="main-content">
        </div>

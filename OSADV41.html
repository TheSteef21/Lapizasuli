<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Venus Lab</title>
    <!-- Incluimos Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { 
            background-color: #050505; 
            color: #d1d1d1; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px; 
        }
        .hub-container { width: 100%; max-width: 600px; }
        .card { 
            background: #121212; 
            border: 1px solid #333; 
            padding: 20px; 
            margin: 15px 0; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #007bff; }
        .status-pill { font-size: 0.8em; color: #ffc107; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>SADV41: Módulo Venus (Beta)</h1>
        <div id="status" class="status-pill">Protocolo inactivo. Conecta tu billetera.</div>
        <button id="connectBtn">Conectar Wallet</button>

        <div id="market" style="display:none;">
            <h3>Mercado Disponible</h3>
            <div class="card">
                <h4>BNB (vBNB)</h4>
                <p>Balance en wallet: <span id="bnbBal">0</span></p>
                <button onclick="interactVenus('BNB')">Suministrar BNB</button>
            </div>
            <div class="card">
                <h4>USDT (vUSDT)</h4>
                <p>Balance en wallet: <span id="usdtBal">0</span></p>
                <button onclick="interactVenus('USDT')">Suministrar USDT</button>
            </div>
        </div>
    </div>

    <script>
        let provider, signer;
        
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                const accounts = await provider.send("eth_requestAccounts", []);
                document.getElementById('status').innerText = "Conectado: " + accounts[0].substring(0,6) + "...";
                document.getElementById('market').style.display = "block";
                document.getElementById('connectBtn').style.display = "none";
                updateBalances();
            } else {
                alert("Por favor, instala Brave Wallet o MetaMask.");
            }
        });

        async function updateBalances() {
            try {
                const address = await signer.getAddress();
                
                // 1. Obtener balance nativo de BNB
                const bnbBalanceWei = await provider.getBalance(address);
                const bnbBalanceFormatted = ethers.formatEther(bnbBalanceWei);
                document.getElementById('bnbBal').innerText = Number(bnbBalanceFormatted).toFixed(4) + " BNB";

                // 2. Obtener balance de USDT en BNB Chain
                const usdtAddress = "0x55d398326f99059ff775485246999027b3197955";
                const erc20ABI = ["function balanceOf(address owner) view returns (uint256)"];
                const usdtContract = new ethers.Contract(usdtAddress, erc20ABI, provider);
                
                const usdtBalanceWei = await usdtContract.balanceOf(address);
                const usdtBalanceFormatted = ethers.formatUnits(usdtBalanceWei, 18);
                document.getElementById('usdtBal').innerText = Number(usdtBalanceFormatted).toFixed(2) + " USDT";

            } catch (error) {
                console.error("Error al cargar los balances:", error);
                document.getElementById('bnbBal').innerText = "Error de lectura";
                document.getElementById('usdtBal').innerText = "Error de lectura";
            }
        }

        async function interactVenus(asset) {
            if (asset === 'BNB') {
                try {
                    // Dirección oficial del contrato vBNB en la BNB Chain Mainnet
                    const vBnbAddress = "0xA07c5e71B8248084f62e8a84620f4D0f3D1C8d45";
                    
                    // ABI simplificado para la función mint de vBNB
                    const vBnbABI = ["function mint() payable"];
                    const vBnbContract = new ethers.Contract(vBnbAddress, vBnbABI, signer);

                    // Definimos una cantidad de prueba (0.0001 BNB)
                    const amountToSend = ethers.parseEther("0.0001");

                    document.getElementById('status').innerText = "Firmando transacción en wallet...";

                    // Ejecución del contrato enviando BNB
                    const tx = await vBnbContract.mint({ value: amountToSend });
                    
                    document.getElementById('status').innerText = "Transacción enviada...";
                    console.log("Hash de transacción:", tx.hash);

                    await tx.wait();
                    
                    document.getElementById('status').innerText = "¡Suministro exitoso!";
                    alert("¡Transacción completada con éxito! Revisa tu posición en Venus.");
                    
                    // Actualizar balances tras la operación
                    updateBalances();

                } catch (error) {
                    console.error("Error en la transacción:", error);
                    document.getElementById('status').innerText = "Error en la operación";
                    alert("Error al interactuar con Venus: " + (error.reason || error.message));
                }
            } else if (asset === 'USDT') {
                alert("Para USDT se requiere primero el flujo de Aprobación (Approve) antes del Mint.");
            }
        }
    </script>
</body>
</html>

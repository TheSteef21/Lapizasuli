<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Master Console - Verified</title>
    <style>
        :root { 
            --primary: #1a3a5a; 
            --accent: #d4af37; 
            --bg: #050505; 
            --card-bg: #111;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --success: #2ecc71;
            --wa-green: #25D366;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .trinity-nav { 
            width: 100%; max-width: 450px; 
            display: flex; justify-content: space-around; 
            margin-bottom: 20px; background: var(--card-bg); 
            padding: 15px; border-radius: 30px; border: 1px solid #333;
        }
        .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; color: white; transition: 0.3s; }
        .nav-label { font-size: 9px; font-weight: bold; color: #888; text-transform: uppercase; margin-top: 5px; }

        .main-card { 
            background: var(--card-bg); border: 1px solid #333; 
            padding: 25px; border-radius: 20px; width: 100%; 
            max-width: 420px; position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .user-tag { 
            position: absolute; top: -10px; right: 20px; 
            background: var(--accent); color: black; 
            font-size: 10px; padding: 2px 12px; border-radius: 10px; font-weight: bold;
        }

        .counter { 
            font-size: 0.7rem; color: var(--accent); 
            background: rgba(212,175,55,0.1); padding: 5px 12px; 
            border-radius: 20px; display: inline-block; margin-top: 8px;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .section-title { 
            font-size: 0.75rem; color: var(--accent); 
            text-transform: uppercase; margin-bottom: 15px; 
            letter-spacing: 1.5px; display: block; border-bottom: 1px solid #222; padding-bottom: 5px; 
        }
        input { 
            width: 100%; padding: 14px; margin-bottom: 12px; 
            background: #1a1a1a; border: 1px solid #444; 
            color: white; border-radius: 10px; box-sizing: border-box; 
        }

        .btn-execute { 
            width: 100%; padding: 14px; 
            background: linear-gradient(135deg, var(--primary), #2c527a); 
            color: white; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }

        .result-box { 
            margin-top: 20px; border: 2px solid #333; 
            border-radius: 12px; padding: 15px; display: none; 
            background: rgba(255,255,255,0.02); animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .badge { font-size: 1rem; font-weight: bold; margin-bottom: 12px; }
        .confidence-meter { font-size: 0.75rem; opacity: 0.8; margin-top: 4px; }
        .action-info { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent); }
        
        .btn-whatsapp { 
            width: 100%; padding: 12px; background: var(--wa-green); 
            color: white; border: none; border-radius: 8px; 
            margin-top: 15px; font-weight: bold; display: flex; 
            align-items: center; justify-content: center; gap: 8px; 
            cursor: pointer; text-decoration: none; 
        }

        .footer { text-align: center; font-size: 9px; color: var(--accent); margin-top: 25px; opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="trinity-nav">
        <a href="https://developer.x.com/en/portal/dashboard" class="nav-item">
            <span>𝕏</span><span class="nav-label">ATRIO (DEV)</span>
        </a>
        <a href="https://wa.me/" class="nav-item">
            <span>🎚️</span><span class="nav-label">SANTO (META)</span>
        </a>
        <a href="#" class="nav-item" style="opacity: 0.4;">
            <span>✨</span><span class="nav-label">SANTÍSIMO</span>
        </a>
    </nav>

    <main class="main-card">
        <span class="user-tag">DEV: STEVEN GÓMEZ - 8-901-2251</span>
        
        <header style="text-align: center; margin-bottom: 20px;">
            <h2 style="color: var(--accent); margin: 0; letter-spacing: 2px;">SADV41 CONSOLE</h2>
            <div id="clickCounter" class="counter">🛡️ Clics ahorrados: 0</div>
        </header>

        <section>
            <span class="section-title">Verificador de Integridad de Noticias</span>
            <input type="text" id="newsLink" placeholder="Pega el link de la noticia o red social aquí...">
            <button class="btn-execute" onclick="runProtocol()">Ejecutar Protocolo SADV41</button>
        </section>

        <div id="resultArea" class="result-box">
            <div id="typeBadge" class="badge"></div>
            <div id="integrityStatus" class="badge" style="border-top: 1px solid #333; padding-top: 10px;"></div>
            <div class="action-info">
                <small style="color: #888; text-transform: uppercase; font-size: 0.65rem;">Instrucción de Misión:</small>
                <p id="instructionText" style="margin: 5px 0 0 0; font-size: 0.85rem; line-height: 1.4;"></p>
            </div>
            <button class="btn-whatsapp" onclick="sendToWhatsApp()">
                <span>📲</span> COMPARTIR REPORTE VERIFICADO
            </button>
        </div>

        <footer class="footer">
            SADV41 ECOSYSTEM UNIFIED<br>
            SHIRLEY DAYAN LOHANNIZ 🎚️
        </footer>
    </main>

    <script>
        let totalClicks = localStorage.getItem('sadv_clicks') || 0;
        document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;

        async function verifySource(url) {
            const officialSources = ["prensa.com", "telemetro.com", "tvn-2.com", "midiario.com", "critica.com.pa"];
            let domain = "";
            try {
                domain = new URL(url).hostname.replace('www.', '');
            } catch(e) { return { score: 0, status: "URL INVÁLIDA" }; }
            
            let trustScore = 0;
            let reportStatus = "VERIFICANDO...";

            // 1. Filtro de Autoridad Periodística
            if (officialSources.some(s => domain.includes(s))) {
                trustScore = 95;
                reportStatus = "FUENTE PERIODÍSTICA RECONOCIDA";
            } else {
                // 2. Triangulación por Coherencia (Hashtags/Contexto)
                const keywords = ["arraijan", "burunga", "panamaoeste", "alcaldesa", "municipio"];
                const urlLower = url.toLowerCase();
                const matches = keywords.filter(k => urlLower.includes(k)).length;
                
                if (matches >= 1) {
                    trustScore = 65;
                    reportStatus = "CONTENIDO COMUNITARIO COHERENTE";
                } else {
                    trustScore = 35;
                    reportStatus = "FUENTE NO VERIFICADA - POSIBLE BULO";
                }
            }
            return { score: trustScore, status: reportStatus };
        }

        async function runProtocol() {
            const url = document.getElementById('newsLink').value;
            const resultBox = document.getElementById('resultArea');
            if (!url) return alert("Se requiere una URL para el protocolo.");

            // 1. Detección de Tipo de Contenido
            let type = "NOTICIA / TEXTO"; 
            let icon = "📄"; 
            let baseInstruction = "Realiza captura para compartir nativamente y evitar clics externos.";

            if (url.includes("video") || url.includes("reel") || url.includes("watch") || url.includes("fb.watch") || url.includes("tiktok")) {
                type = "VIDEO DETECTADO"; 
                icon = "🎬"; 
                baseInstruction = "ALTA PRIORIDAD: Video detectado. Descarga el archivo para asegurar visualización directa en Burunga.";
            }

            // 2. Ejecutar Verificación Profunda
            const verification = await verifySource(url);
            let vColor = verification.score > 70 ? "#2ecc71" : (verification.score > 50 ? "#f1c40f" : "#e74c3c");

            // 3. Renderizar Resultados
            resultBox.style.display = "block";
            resultBox.style.borderColor = vColor;
            
            document.getElementById('typeBadge').innerHTML = `${icon} ${type}`;
            document.getElementById('integrityStatus').innerHTML = `
                <span style="color:${vColor}">🛡️ ${verification.status}</span>
                <div class="confidence-meter">Nivel de Confianza: ${verification.score}%</div>
            `;
            
            document.getElementById('instructionText').innerText = 
                verification.score < 50 ? "ALERTA: Proceder con cautela. No hay respaldo oficial ni hashtags vinculados." : baseInstruction;

            // 4. Actualizar Contador
            totalClicks++;
            localStorage.setItem('sadv_clicks', totalClicks);
            document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;
        }

        function sendToWhatsApp() {
            const status = document.getElementById('integrityStatus').innerText;
            const instruction = document.getElementById('instructionText').innerText;
            const report = `🛡️ *SADV41 INFORMA (VERIFICADO)*\n\n📊 *Estado:* ${status}\n⚠️ *Acción:* ${instruction}\n\n🎚️ _Misión Burunga_`;
            window.open(`https://wa.me/?text=${encodeURIComponent(report)}`, '_blank');
        }
    </script>
</body>
</html>

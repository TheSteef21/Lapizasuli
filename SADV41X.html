<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Supreme Console V2 - Search Engine</title>
    <style>
        :root { 
            --primary: #1a3a5a; --accent: #d4af37; --bg: #050505; 
            --card-bg: #111; --success: #2ecc71; --warning: #f1c40f; 
            --danger: #e74c3c; --wa-green: #25D366; --yappy-blue: #00a1ff;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; 
            display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0;
        }
        
        .trinity-nav { 
            width: 100%; max-width: 450px; display: flex; justify-content: space-around; 
            margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 30px; 
            border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .nav-item { text-decoration: none; color: white; font-size: 9px; text-align: center; transition: 0.3s; }
        .nav-item:hover { transform: scale(1.1); color: var(--accent); }

        .main-card { 
            background: var(--card-bg); border: 1px solid #333; padding: 25px; 
            border-radius: 20px; width: 100%; max-width: 420px; position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .user-tag { 
            position: absolute; top: -10px; right: 20px; background: var(--accent); 
            color: black; font-size: 10px; padding: 2px 12px; border-radius: 10px; font-weight: bold;
        }

        .section-title { 
            font-size: 0.75rem; color: var(--accent); text-transform: uppercase; 
            margin-top: 20px; display: block; border-bottom: 1px solid #222; padding-bottom: 5px;
        }
        input { 
            width: 100%; padding: 14px; margin: 12px 0; background: #1a1a1a; 
            border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn-execute { 
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), #2c527a); 
            color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }

        .result-box { 
            margin-top: 20px; border: 2px solid #333; border-radius: 12px; padding: 15px; 
            display: none; background: rgba(255,255,255,0.02); animation: fadeIn 0.5s ease;
        }
        
        .search-engine-area {
            margin-top: 15px; padding: 10px; background: rgba(212,175,55,0.05); border-radius: 10px; border: 1px solid #333;
        }
        .search-link {
            display: block; color: var(--yappy-blue); font-size: 0.8rem; margin: 5px 0; text-decoration: none;
        }
        .search-link:hover { text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .yappy-card { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 20px; text-decoration: none; color: var(--yappy-blue); 
            font-size: 11px; font-weight: bold; border: 1px dashed var(--yappy-blue); 
            padding: 12px; border-radius: 12px; background: rgba(0, 161, 255, 0.05);
        }

        .footer { text-align: center; font-size: 9px; color: var(--accent); margin-top: 25px; opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="trinity-nav">
        <a href="https://thesteef21.github.io/Lapizasuli/" class="nav-item"><span>🏠</span><br>MISIÓN PRINCIPAL</a>
        <a href="https://developer.x.com/" class="nav-item"><span>𝕏</span><br>ATRIO (DEV)</a>
        <a href="https://wa.me/50769362166" class="nav-item"><span>🎚️</span><br>SANTO (META)</a>
    </nav>

    <main class="main-card">
        <span class="user-tag">DEV: STEVEN GÓMEZ "DIOR" - 8-901-2251</span>
        
        <header style="text-align: center; margin-bottom: 15px;">
            <h2 style="color: var(--accent); margin: 0; letter-spacing: 2px; font-size: 1.5rem;">SADV41 SUPREME V2</h2>
            <div id="clickCounter" style="font-size: 0.7rem; color: var(--accent); margin-top: 5px;">🛡️ Clics ahorrados: 0</div>
        </header>

        <section>
            <span class="section-title">Motor de Búsqueda y Verificación</span>
            <input type="text" id="newsLink" placeholder="Pega el link de la noticia aquí...">
            <button class="btn-execute" onclick="runProtocol()">Sincronizar y Buscar</button>
        </section>

        <div id="resultArea" class="result-box">
            <div id="typeBadge" style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;"></div>
            <div id="integrityStatus" style="font-weight: bold; margin-bottom: 10px; border-top: 1px solid #333; padding-top: 10px;"></div>
            
            <div class="search-engine-area">
                <small style="color:var(--accent); font-weight:bold; display:block; margin-bottom:5px;">🔍 FUENTES CRUZADAS (MULTI-SEARCH):</small>
                <div id="searchLinks"></div>
            </div>

            <div id="instructionText" style="font-size: 0.85rem; line-height: 1.4; color: #ccc; margin-top:10px;"></div>
            <button class="btn-execute" style="background: var(--wa-green); margin-top: 15px;" onclick="sendToWhatsApp()">📲 COMPARTIR REPORTE</button>
        </div>

        <a href="https://yappypa.page.link/Zi7X?hash=rjYRsJ8Yz0hGBKWXnNKRpeCr5yZZkbjbgkxGCAZdd/nmXoS0X8s5ntvwHrGm+7HT" class="yappy-card">
            <span>⚡</span> DONAR APOYO A LA MISIÓN (6936-2166)
        </a>

        <footer class="footer">
            SADV41 ECOSYSTEM UNIFIED | SHIRLEY DAYAN LOHANNIZ 🎚️
        </footer>
    </main>

    <script>
        let totalClicks = localStorage.getItem('sadv_clicks') || 0;
        document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;

        async function verifyHybridSource(url) {
            const trustedGlobal = ["laestrella.com.pa", "prensa.com", "nytimes.com", "reuters.com", "apnews.com", "dw.com", "telemetro.com", "tvn-2.com", "elmundo.es", "bbc.com"];
            const localKeywords = ["arraijan", "burunga", "panamaoeste", "alcaldesa", "municipio", "panama"];
            
            let domain = "";
            try { domain = new URL(url).hostname.toLowerCase(); } catch(e) { return { score: 0, status: "URL INVÁLIDA" }; }
            
            // ESCALA VARIABLE DINÁMICA
            let score = 20; 
            let status = "BAJA INTEGRIDAD / ANALIZANDO";

            // Bonus por fuente oficial
            if (trustedGlobal.some(t => domain.includes(t))) score += 75; 
            else if (url.includes("google.com/news")) score += 65;
            else if (url.includes("gov.pa")) score += 78;

            // Bonus por palabras clave en URL (triangulación comunitaria)
            const keywordMatches = localKeywords.filter(k => url.toLowerCase().includes(k)).length;
            score += (keywordMatches * 10);

            // Cap al 100%
            if (score > 100) score = 100;
            if (score > 80) status = "FUENTE DE ALTA INTEGRIDAD VERIFICADA";
            else if (score > 50) status = "CONTENIDO COHERENTE / REVISIÓN SUGERIDA";
            else status = "FUENTE NO VERIFICADA / RIESGO DE BULO";

            return { score, status };
        }

        async function runProtocol() {
            const urlInput = document.getElementById('newsLink').value;
            if (!urlInput) return alert("Ingresa un link");

            const verification = await verifyHybridSource(urlInput);
            const resultBox = document.getElementById('resultArea');
            resultBox.style.display = "block";

            // GENERADOR DE MOTOR DE BÚSQUEDA (Extracción de términos)
            const urlObj = new URL(urlInput);
            const pathTerms = urlObj.pathname.split(/[-_/.]/).filter(t => t.length > 3).slice(0, 5).join(" ");
            const searchQuery = encodeURIComponent(pathTerms);
            
            const searchHtml = `
                <a href="https://www.google.com/search?q=${searchQuery}" target="_blank" class="search-link">🌐 Ver en Google Search</a>
                <a href="https://news.google.com/search?q=${searchQuery}" target="_blank" class="search-link">📰 Ver en Google Noticias</a>
                <a href="https://twitter.com/search?q=${searchQuery}" target="_blank" class="search-link">🐦 Ver tendencia en X (Twitter)</a>
            `;
            document.getElementById('searchLinks').innerHTML = searchHtml;

            // Detección de multimedia
            let icon = "📄"; let type = "REPORTE DE TEXTO";
            if (urlInput.includes("video") || urlInput.includes("reel") || urlInput.includes("watch") || urlInput.includes("tiktok")) {
                icon = "🎬"; type = "CONTENIDO MULTIMEDIA";
            }

            let color = verification.score > 80 ? "#2ecc71" : (verification.score > 50 ? "#f1c40f" : "#e74c3c");
            resultBox.style.borderColor = color;

            document.getElementById('typeBadge').innerHTML = `${icon} ${type}`;
            document.getElementById('integrityStatus').innerHTML = `<span style="color:${color}">🛡️ ${verification.status}</span><br><small>Nivel de Confianza: ${verification.score}%</small>`;
            
            document.getElementById('instructionText').innerText = verification.score < 50 
                ? "ALERTA: El sistema no detecta respaldo suficiente. Usa los enlaces de búsqueda arriba para contrastar."
                : "Protocolo SADV41 exitoso. Se recomienda usar fuentes cruzadas para máxima precisión antes de difundir.";

            totalClicks++;
            localStorage.setItem('sadv_clicks', totalClicks);
            document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;
        }

        function sendToWhatsApp() {
            const status = document.getElementById('integrityStatus').innerText;
            const report = `🛡️ *SADV41 SUPREME INFORMA*\n\n✅ *Integridad:* ${status}\n\n🎚️ _Misión Burunga_`;
            window.open(`https://wa.me/?text=${encodeURIComponent(report)}`, '_blank');
        }
    </script>
</body>
</html>

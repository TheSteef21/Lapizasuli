<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Master Console - Unified</title>
    <style>
        :root { 
            --primary: #1a3a5a; 
            --accent: #d4af37; 
            --bg: #050505; 
            --card-bg: #111;
            --danger: #b22222;
            --wa-green: #25D366;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box;
        }

        /* NAVEGACIÓN DE LA TRINIDAD (Atrio, Santo, Santísimo) */
        .trinity-nav { 
            width: 100%; 
            max-width: 450px; 
            display: flex; 
            justify-content: space-around; 
            margin-bottom: 20px; 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 30px; 
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; transition: 0.3s; color: white; }
        .nav-icon { font-size: 1.5rem; margin-bottom: 5px; }
        .nav-label { font-size: 9px; font-weight: bold; color: #888; text-transform: uppercase; }
        .nav-item:hover .nav-label { color: var(--accent); }
        .nav-item:hover .nav-icon { transform: scale(1.1); }

        /* TARJETA PRINCIPAL UNIFICADA */
        .main-card { 
            background: var(--card-bg); 
            border: 1px solid #333; 
            padding: 25px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 420px; 
            position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .user-tag { 
            position: absolute; 
            top: -10px; 
            right: 20px; 
            background: var(--accent); 
            color: black; 
            font-size: 10px; 
            padding: 2px 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* HEADER Y CONTADOR */
        .header { text-align: center; margin-bottom: 20px; }
        .counter { 
            font-size: 0.7rem; 
            color: var(--accent); 
            background: rgba(212,175,55,0.1); 
            padding: 5px 12px; 
            border-radius: 20px; 
            display: inline-block; 
            margin-top: 8px;
            border: 1px solid rgba(212,175,55,0.2);
        }

        /* INPUTS Y BOTONES */
        .section-title { 
            font-size: 0.75rem; 
            color: var(--accent); 
            text-transform: uppercase; 
            margin-bottom: 15px; 
            letter-spacing: 1.5px; 
            display: block; 
            border-bottom: 1px solid #222; 
            padding-bottom: 5px; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            background: #1a1a1a; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 10px; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn-execute { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, var(--primary), #2c527a); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-execute:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* RESULTADOS Y ACCIONES */
        .result-box { 
            margin-top: 20px; 
            border: 2px solid #333; 
            border-radius: 12px; 
            padding: 15px; 
            display: none; 
            background: rgba(255,255,255,0.02);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .badge { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .action-info { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent); }
        
        .btn-whatsapp { 
            width: 100%; 
            padding: 12px; 
            background: var(--wa-green); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            margin-top: 15px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            cursor: pointer; 
            text-decoration: none; 
        }

        .footer { text-align: center; font-size: 9px; color: var(--accent); margin-top: 25px; letter-spacing: 1px; opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="trinity-nav">
        <a href="https://developer.x.com/en/portal/dashboard" class="nav-item">
            <span class="nav-icon">𝕏</span>
            <span class="nav-label">ATRIO (DEV)</span>
        </a>
        <a href="intent://send/+1234567890#Intent;scheme=smsto;package=com.whatsapp;action=android.intent.action.SENDTO;end" class="nav-item">
            <span class="nav-icon">🎚️</span>
            <span class="nav-label">SANTO (META)</span>
        </a>
        <a href="#" class="nav-item" style="opacity: 0.4;">
            <span class="nav-icon">✨</span>
            <span class="nav-label">SANTÍSIMO</span>
        </a>
    </nav>

    <main class="main-card">
        <span class="user-tag">@StevenG507 CONNECTED</span>
        
        <header class="header">
            <h2 style="color: var(--accent); margin: 0; letter-spacing: 2px; font-size: 1.4rem;">SADV41 CONSOLE</h2>
            <div id="clickCounter" class="counter">🛡️ Clics ahorrados: 0</div>
        </header>

        <section>
            <span class="section-title">Análisis de Noticias Burunga</span>
            <input type="text" id="newsLink" placeholder="Pega el enlace de fuente aquí...">
            <button class="btn-execute" onclick="runProtocol()">Ejecutar Protocolo SADV41</button>
        </section>

        <div id="resultArea" class="result-box">
            <div id="typeBadge" class="badge"></div>
            <div class="action-info">
                <small style="color: #888; text-transform: uppercase; font-size: 0.65rem;">Instrucción de Misión:</small>
                <p id="instructionText" style="margin: 5px 0 0 0; font-size: 0.85rem; line-height: 1.4;"></p>
            </div>
            <button class="btn-whatsapp" onclick="sendToWhatsApp()">
                <span>📲</span> COMPARTIR REPORTE
            </button>
        </div>

        <footer class="footer">
            SADV41 ECOSYSTEM UNIFIED<br>
            SHIRLEY DAYAN LOHANNIZ 🎚️
        </footer>
    </main>

    <script>
        // Gestión del Contador
        let totalClicks = localStorage.getItem('sadv_clicks') || 0;
        document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;

        function runProtocol() {
            const url = document.getElementById('newsLink').value.toLowerCase();
            const resultBox = document.getElementById('resultArea');
            
            if (!url) {
                alert("Se requiere una URL para iniciar el protocolo.");
                return;
            }

            // Lógica de detección SADV41
            let type = "Publicación Estándar"; 
            let icon = "📄"; 
            let color = "#d4af37";
            let instruction = "Contenido de texto/imagen. Realiza captura para compartir nativamente y evitar clics externos.";

            if (url.includes("video") || url.includes("reel") || url.includes("watch") || url.includes("fb.watch")) {
                type = "VIDEO DETECTADO"; 
                icon = "🎬"; 
                color = "#ff4444";
                instruction = "ALTA PRIORIDAD: Video detectado. Descarga el archivo o graba pantalla para asegurar visualización directa en Burunga.";
            } else if (url.includes("developer.x.com")) {
                type = "MODO DESARROLLADOR";
                icon = "⚙️";
                instruction = "Acceso a portal de X detectado. Sincronizando métricas de @StevenG507.";
            }

            // Actualización Visual
            resultBox.style.display = "block";
            resultBox.style.borderColor = color;
            document.getElementById('typeBadge').innerHTML = `<span style="color:${color}">${icon} ${type}</span>`;
            document.getElementById('instructionText').innerText = instruction;

            // Actualización de Contador
            totalClicks++;
            localStorage.setItem('sadv_clicks', totalClicks);
            document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${totalClicks}`;
        }

        function sendToWhatsApp() {
            const type = document.getElementById('typeBadge').innerText;
            const instruction = document.getElementById('instructionText').innerText;
            const report = `🛡️ *SADV41 INFORMA:*\n\n✅ *Tipo:* ${type}\n⚠️ *Instrucción:* ${instruction}\n\n🎚️ _Misión Burunga_`;
            
            const encodedReport = encodeURIComponent(report);
            window.open(`https://wa.me/?text=${encodedReport}`, '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Tire Tester - EASADV41-UG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;500&family=Archivo+Narrow:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#05050A',
                        electricBlue: '#00D1FF',
                        magenta: '#FF00E5',
                        sodiumOrange: '#FFB800',
                        cyanFlare: '#00FFFF',
                    },
                    fontFamily: {
                        header: ['Orbitron', 'sans-serif'],
                        technical: ['Archivo Narrow', 'sans-serif'],
                        mono: ['JetBrains+Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neon-blue': '0 0 15px rgba(0, 209, 255, 0.4), 0 0 5px rgba(0, 209, 255, 0.2)',
                        'neon-magenta': '0 0 15px rgba(255, 0, 229, 0.4), 0 0 5px rgba(255, 0, 229, 0.2)',
                        'inner-glow': 'inset 0 0 20px rgba(0, 209, 255, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #05050A;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 209, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(5, 5, 10, 0.8) 50%, rgba(0, 0, 0, 0) 50%),
                linear-gradient(90deg, rgba(0, 209, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 209, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px, 40px 40px, 40px 40px;
            color: #E2E8F0;
            overflow-x: hidden;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 209, 255, 0.1);
            position: fixed;
            z-index: 50;
            top: 0;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .bloom-text-blue {
            text-shadow: 0 0 8px rgba(0, 209, 255, 0.8), 0 0 15px rgba(0, 209, 255, 0.5);
        }

        .bloom-text-magenta {
            text-shadow: 0 0 8px rgba(255, 0, 229, 0.8), 0 0 15px rgba(255, 0, 229, 0.5);
        }

        .glass-panel {
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 209, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #00D1FF;
            box-shadow: 0 0 10px #00D1FF;
        }

        .corner-accent {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #FF00E5;
        }

        .corner-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .corner-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
        .corner-br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        .pulsing-indicator {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        /* 3D Rotating Mesh Representation via Animation */
        .chassis-wireframe {
            position: relative;
            width: 100%;
            height: 170px;
            background: rgba(5, 5, 10, 0.6);
            border: 1px dashed rgba(0, 209, 255, 0.25);
            background-size: cover;
            background-position: center;
        }

        .rotating-mesh {
            animation: holographicRotation 12s linear infinite alternate;
            transform-origin: center;
        }

        @keyframes holographicRotation {
            0% { transform: scaleX(1) skewY(0deg); filter: brightness(1); }
            50% { transform: scaleX(0.96) skewY(1deg); filter: brightness(1.2); }
            100% { transform: scaleX(1) skewY(0deg); filter: brightness(1); }
        }

        /* Wheel Hub & Physics */
        .wheel-hub {
            position: absolute;
            width: 66px;
            height: 66px;
            bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .tire-profile {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 4px solid #E2E8F0;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 30%, rgba(30,30,40,0.9) 70%);
            box-shadow: 0 0 12px rgba(0, 209, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, border-color 0.3s ease;
            animation: tireSpin 4s linear infinite;
        }

        /* Rims Representation */
        .rim-lines {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 255, 0.6);
            position: relative;
        }
        .rim-lines::before, .rim-lines::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 255, 0.4);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .rim-lines::before { width: 100%; height: 2px; }
        .rim-lines::after { width: 2px; height: 100%; }

        @keyframes tireSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tire-slick { border-color: #00D1FF; border-style: solid; }
        .tire-semi { border-color: #FF00E5; border-style: double; }
        .tire-wet { border-color: #FFB800; border-style: dashed; }

        /* Custom Custom Knob / Input Range styling */
        .knob-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        .knob-slider:focus { outline: none; }
        .knob-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 209, 255, 0.2);
            border-radius: 3px;
            border: 1px solid rgba(0, 209, 255, 0.4);
        }
        .knob-slider::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #FF00E5;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px #FF00E5;
            border: 2px solid #FFF;
        }
    </style>
</head>
<body class="font-technical antialiased p-4 min-h-screen flex items-center justify-center">
    <div class="scanline"></div>

    <div class="w-full max-w-[360px] z-10 mx-auto flex flex-col gap-5">
        
        <header class="w-full border-b border-electricBlue/40 pb-2 relative">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="bg-electricBlue text-midnight px-2 py-0.5 font-header font-black text-sm italic skew-x-[-12deg]">
                        EASADV41
                    </div>
                    <h1 class="font-header text-sm tracking-wider text-white">TURBO TIRE <span class="text-electricBlue bloom-text-blue">TESTER</span></h1>
                </div>
                <div class="flex items-center gap-1 font-mono text-[9px]">
                    <span class="w-2 h-2 rounded-full bg-green-500 pulsing-indicator shadow-[0_0_6px_#22c55e]"></span>
                    <span class="text-green-500">ACTIVE</span>
                </div>
            </div>
            <div class="absolute bottom-[-1px] right-0 w-1/3 h-[1px] bg-magenta shadow-[0_0_8px_#FF00E5]"></div>
        </header>

        <section class="glass-panel p-4 border-electricBlue/40">
            <div class="corner-accent corner-tr"></div>
            <div class="flex justify-between items-center mb-2">
                <span class="font-mono text-[10px] text-magenta">3D CHASSIS RENDER (ROTATING

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
        * { font-family: "Inter", sans-serif; }
        h1,h2,h3, .cinzel { font-family: "Cinzel", serif; }
        .playfair { font-family: "Playfair Display", serif; }
        
        body { background: #050505; }
        
        .bg-obsidian {
          background-color: #050505;
          background-image: 
            radial-gradient(1200px 600px at 50% -10%, rgba(201,168,106,0.18), transparent 60%),
            radial-gradient(800px 400px at 90% 20%, rgba(6,182,212,0.08), transparent 70%),
            radial-gradient(600px 600px at 10% 80%, rgba(16,185,129,0.06), transparent 60%);
        }
        
        .glass {
          background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
          backdrop-filter: blur(18px) saturate(1.2);
          -webkit-backdrop-filter: blur(18px) saturate(1.2);
          border: 1px solid rgba(201,168,106,0.15);
        }
        
        .logia-card {
          background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 100%);
          border: 1px solid rgba(201,168,106,0.15);
          box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        
        .esoterico-glow {
          text-shadow: 0 0 20px rgba(201,168,106,0.6), 0 0 40px rgba(201,168,106,0.25);
        }
        
        .scanline::before {
          content: '';
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(201,168,106,0.03) 2px,
            rgba(201,168,106,0.03) 3px
          );
          pointer-events: none;
          z-index: 2;
        }
        
        .transfiguracion-container {
          transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);

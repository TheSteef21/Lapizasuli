<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquina 57 | Tómbolas SADV41</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #0d0d0d; color: #fff; padding: 20px; }
        .promo-card { background: #1a1a1a; padding: 20px; border-radius: 15px; max-width: 600px; margin: 20px auto; border: 2px solid #e50914; }
        .btn-participar { background: #e50914; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 20px; }
        
        .oferta-box { background: #2a0000; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #ffcc00; }
        .price { color: #ffcc00; font-size: 1.4em; font-weight: bold; }
        
        /* Slideshow Styles */
        .slideshow-container { max-width: 600px; position: relative; margin: 40px auto; }
        .mySlides { display: none; padding: 10px; background: #1a1a1a; border-radius: 10px; position: relative; }
        .mySlides img, .mySlides video { width: 100%; height: auto; border-radius: 5px; }
        .date-label { background: rgba(0,0,0,0.7); color: #ffcc00; padding: 5px; position: absolute; bottom: 20px; left: 20px; border-radius: 5px; font-size: 0.9em; }
        
        .fade { animation-name: fade; animation-duration: 1.5s; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }
    </style>
</head>
<body>

    <header>
        <h1>Esquina 57</h1>
        <p>Misión SADV41 - Colombia</p>
    </header>

    <main>
        <div class="promo-card">
            <img src="IMG-20260620-WA0079.jpg" alt="Tómbola" style="width: 100%; border-radius: 10px;">
            <h2>Tómbolas Activas</h2>
            <div class="oferta-box">
                <h3>REMATE DE BOLETAS</h3>
                <p>3 Boletas para Rifa del Carro: <span class="price">$85.000</span></p>
            </div>
            <div class="oferta-box">
                <h3>BOLETAS DE VUELTA</h3>
                <p>2 Boletas: <span class="price">$50.000</span></p>
            </div>
            <a href="https://wa.me/573183434492" class="btn-participar">Contactar por WhatsApp</a>
        </div>

        <!-- Slideshow Integrado de Ganadores y Assets -->
        <div class="slideshow-container">
            <!-- Ganadores Acumulados -->
            <div class="mySlides fade">
                <img src="373959.jpg" alt="Ganador 1">
                <div class="date-label">Registrado: Lunes 22 Junio 2026</div>
            </div>
            <div class="mySlides fade">
                <img src="374741.jpg" alt="Ganador 2">
                <div class="date-label">Registrado: Martes 23 Junio 2026</div>
            </div>

            <!-- Assets -->
            <div class="mySlides fade"><img src="IMG-20260620-WA0078.jpg" alt="Asset"></div>
            <div class="mySlides fade"><img src="IMG-20260620-WA0081.jpg" alt="Asset"></div>
            <div class="mySlides fade"><img src="IMG-20260623-WA0025.jpg" alt="Asset"></div>
            <div class="mySlides fade"><img src="IMG-20260623-WA0026.jpg" alt="Asset"></div>
            <div class="mySlides fade"><img src="IMG-20260624-WA0000.jpg" alt="Asset"></div>
            <div class="mySlides fade"><video controls><source src="VID-20260620-WA0076.mp4" type="video/mp4"></video></div>
            <div class="mySlides fade"><video controls><source src="VID-20260620-WA0080.mp4" type="video/mp4"></video></div>
            <div class="mySlides fade"><video controls><source src="VID-20260620-WA0082.mp4" type="video/mp4"></video></div>
            <div class="mySlides fade"><video controls><source src="VID-20260623-WA0027.mp4" type="video/mp4"></video></div>
            <div class="mySlides fade"><video controls><source src="VID-20260623-WA0028.mp4" type="video/mp4"></video></div>
        </div>
    </main>

    <script>
        let slideIndex = 0;
        showSlides();
        function showSlides() {
            let slides = document.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1 }
            slides[slideIndex-1].style.display = "block";
            setTimeout(showSlides, 4000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SADV41 · Contacto Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --wa-green: #25D366;
      --wa-dark: #075E54;
      --meta-blue: #0084FF;
      --google-blue: #4285F4;
      --bg: #0B0F14;
      --card: #151B23;
      --text: #E8EEF4;
      --muted: #8B9BB0;
      --gold: #C9A86A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 211, 102, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 132, 255, 0.08), transparent);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    .header {
      padding: 32px 28px 24px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      position: relative;
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.2);
    }

    .avatar span {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      font-weight: 600;
      color: white;
      letter-spacing: 1px;
    }

    .verified {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 26px;
      height: 26px;
      background: var(--meta-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--card);
    }

    .verified svg {
      width: 14px;
      height: 14px;
      fill: white;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .handle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 132, 255, 0.12);
      color: var(--meta-blue);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .body {
      padding: 28px;
    }

    .quote {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      font-style: italic;
    }

    .quote strong {
      color: var(--gold);
      font-style: normal;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-wa {
      background: var(--wa-green);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .btn-wa:hover {
      background: #20bd5a;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
    }

    .btn-wa:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }

    .footer {
      padding: 20px 28px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer span {
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .meta-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      opacity: 0.5;
    }

    .meta-row svg {
      width: 18px;
      height: 18px;
      fill: var(--muted);
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { border-radius: 20px; }
    }
  </style>
</head>

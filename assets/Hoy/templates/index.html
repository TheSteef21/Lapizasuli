<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - News Preview</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .notification-card {
            background-color: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2c2c2c;
        }
        .card-header {
            padding: 14px 16px 8px 16px;
            display: flex;
            flex-direction: column;
        }
        .source-info {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .source-name {
            font-weight: 600;
            color: #fff;
            margin-left: 8px;
        }
        .news-title {
            font-size: 0.95rem;
            color: #f1f1f1;
            line-height: 1.3;
            margin: 4px 0 10px 0;
        }
        .card-image-container {
            width: 100%;
            max-height: 220px;
            overflow: hidden;
            background-color: #000;
        }
        .card-image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .card-actions {
            display: flex;
            border-top: 1px solid #2c2c2c;
        }
        .action-btn {
            flex: 1;
            background: none;
            border: none;
            color: #b0b0b0;
            padding: 12px 0;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #282828;
            color: #fff;
        }
        .action-btn:first-child {
            border-right: 1px solid #2c2c2c;
        }
    </style>
</head>
<body>

    <h2>Google Noticias - Previsualización</h2>

    {% for item in noticias %}
    <div class="notification-card">
        <div class="card-header">
            <div class="source-info">
                <span>🌐</span>
                <span class="source-name">{{ item.source }}</span>
                <span style="margin-left: auto; font-size: 0.75rem;">{{ item.time }}</span>
            </div>
            <div class="news-title">{{ item.title }}</div>
        </div>
        <div class="card-image-container">
            <img src="{{ item.image }}" alt="Imagen de noticia">
        </div>
        <div class="card-actions">
            <button class="action-btn">Guardar</button>
            <button class="action-btn">Menos contenido como este</button>
        </div>
    </div>
    {% endfor %}

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Panel de Inyección</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .admin-card {
            background-color: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2c2c2c;
        }
        h2 { color: #fff; font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
        input[type="text"] {
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            padding: 10px 12px;
            font-size: 0.95rem;
        }
        input[type="text"]:focus { border-color: #555; outline: none; }
        button {
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #d0d0d0; }
        #resultado { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #4CAF50; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Nodo SADV41 - Inyección</h2>
        <form id="newsForm">
            <div class="form-group">
                <label>Fuente (Source)</label>
                <input type="text" id="source" value="SADV41 Live" required>
            </div>
            <div class="form-group">
                <label>Hora / Fecha (Time)</label>
                <input type="text" id="time" value="Ahora" required>
            </div>
            <div class="form-group">
                <label>Título de la Noticia</label>
                <input type="text" id="title" placeholder="Escribe el mensaje o profecía..." required>
            </div>
            <div class="form-group">
                <label>URL de la Imagen / Asset</label>
                <input type="text" id="image" placeholder="https://..." required>
            </div>
            <button type="submit">Inyectar al Nodo</button>
        </form>
        <div id="resultado"></div>
    </div>

    <script>
        const form = document.getElementById('newsForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new URLSearchParams();
            formData.append('source', document.getElementById('source').value);
            formData.append('time', document.getElementById('time').value);
            formData.append('title', document.getElementById('title').value);
            formData.append('image', document.getElementById('image').value);

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.textContent = "Transmitiendo al servidor en Render...";

            try {
                const response = await fetch('https://hoy-v95f.onrender.com/api/actualizar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                if(response.ok) {
                    resultadoDiv.style.color = "#4CAF50";
                    resultadoDiv.textContent = "¡Inyección exitosa! Total en el nodo: " + data.total_noticias;
                    form.reset();
                } else {
                    throw new Error("Error en el servidor");
                }
            } catch (error) {
                resultadoDiv.style.color = "#ff5252";
                resultadoDiv.textContent = "Error al conectar con Render.";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - LoDeHoy / Noticias Automáticas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sadv41-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .sadv41-header {
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sadv41-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .sadv41-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .slideshow-viewport {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .slide-item {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slide-item.active {
            opacity: 1;
        }

        .slide-item img, .slide-item video {
            max-width: 100%;
            max-height: 80%;
            object-fit: contain;
        }

        .slide-audio-container, .slide-doc-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: var(--text-color);
            text-align: center;
        }

        .slide-doc-container a {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .slide-doc-container a:hover {
            background-color: #2563eb;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 25px 24px 15px;
            color: #fff;
            font-size: 0.95rem;
            z-index: 10;
        }

        .slideshow-controls {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border-top: 1px solid #334155;
        }

        .nav-btn {
            background-color: #334155;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
        }

        .indicators {
            display: flex;
            gap: 6px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #475569;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .indicator.active {
            background-color: var(--accent-color);
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="sadv41-container">
        <div class="sadv41-header">
            <span class="sadv41-title">LoDeHoy / Noticias Automáticas</span>
            <span class="sadv41-badge">SADV41</span>
        </div>

        <div class="slideshow-viewport" id="viewport">
            <div class="slide-item active">
                <div class="slide-caption">Consultando la carpeta assets/NOTICIAS en GitHub...</div>
            </div>
        </div>

        <div class="slideshow-controls">
            <button class="nav-btn" id="prevBtn">Anterior</button>
            <div class="indicators" id="indicatorsContainer"></div>
            <button class="nav-btn" id="nextBtn">Siguiente</button>
        </div>
    </div>

    <script>
        let noticiasAssets = [];
        let currentIndex = 0;
        let slideInterval;

        const viewport = document.getElementById('viewport');
        const indicatorsContainer = document.getElementById('indicatorsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Función para detectar el tipo de archivo según su extensión
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
            if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) return 'video';
            if (['mp3', 'wav', 'aac', 'm4a'].includes(ext)) return 'audio';
            if (['pdf', 'txt', 'doc', 'docx'].includes(ext)) return 'document';
            return 'unknown';
        }

        // Cargar automáticamente los archivos desde la API de GitHub
        async function fetchGitHubFolder() {
            const apiUrl = 'https://api.github.com/repos/TheSteef21/Lapizasuli/contents/assets/NOTICIAS';
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('No se pudo conectar con el repositorio');
                
                const files = await response.json();
                
                // Filtrar y mapear los archivos encontrados
                noticiasAssets = files
                    .filter(file => file.type === 'file')
                    .map(file => {
                        const type = getFileType(file.name);
                        // Limpiar el nombre para usarlo de título amigable (ej: "expediente_01.jpg" -> "Expediente 01")
                        const cleanTitle = file.name.substring(0, file.name.lastIndexOf('.'))
                            .replace(/[-_]/g, ' ');
                        
                        return {
                            type: type,
                            url: file.download_url,
                            title: cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1)
                        };
                    })
                    .filter(asset => asset.type !== 'unknown'); // Ignorar archivos no compatibles

                if (noticiasAssets.length > 0) {
                    initSlideshow();
                } else {
                    viewport.innerHTML = `<div class="slide-item active"><div class="slide-caption">La carpeta assets/NOTICIAS está vacía.</div></div>`;
                }
            } catch (error) {
                console.error(error);
                viewport.innerHTML = `<div class="slide-item active"><div class="slide-caption">Error al cargar las noticias automáticamente.</div></div>`;
            }
        }

        function initSlideshow() {
            viewport.innerHTML = '';
            indicatorsContainer.innerHTML = '';

            noticiasAssets.forEach((asset, index) => {
                const slide = document.createElement('div');
                slide.className = `slide-item ${index === 0 ? 'active' : ''}`;
                
                if (asset.type === 'video') {
                    const video = document.createElement('video');
                    video.src = asset.url;
                    video.controls = true;
                    video.muted = true;
                    slide.appendChild(video);
                } else if (asset.type === 'audio') {
                    const audioWrapper = document.createElement('div');
                    audioWrapper.className = 'slide-audio-container';
                    audioWrapper.innerHTML = `
                        <div style="font-size: 3rem;">🎵</div>
                        <audio src="${asset.url}" controls style="width: 80%; max-width: 400px;"></audio>
                    `;
                    slide.appendChild(audioWrapper);
                } else if (asset.type === 'document') {
                    const docWrapper = document.createElement('div');
                    docWrapper.className = 'slide-doc-container';
                    docWrapper.innerHTML = `
                        <div style="font-size: 3rem;">📄</div>
                        <p style="color: var(--text-secondary); margin-bottom: 10px;">Documento de Expediente</p>
                        <a href="${asset.url}" target="_blank" rel="noopener noreferrer">Abrir / Descargar Archivo</a>
                    `;
                    slide.appendChild(docWrapper);
                } else {
                    const img = document.createElement('img');
                    img.src = asset.url;
                    img.alt = asset.title;
                    slide.appendChild(img);
                }

                if (asset.title) {
                    const caption = document.createElement('div');
                    caption.className = 'slide-caption';
                    caption.textContent = asset.title;
                    slide.appendChild(caption);
                }

                viewport.appendChild(slide);

                const indicator = document.createElement('div');
                indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            });

            startAutoplay();
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide-item');
            const indicators = document.querySelectorAll('.indicator');

            if (slides.length === 0) return;

            if (index >= slides.length) currentIndex = 0;
            if (index < 0) currentIndex = slides.length - 1;

            slides.forEach(slide => slide.classList.remove('active'));
            indicators.forEach(ind => ind.classList.remove('active'));

            slides[currentIndex].classList.add('active');
            indicators[currentIndex].classList.add('active');
        }

        function nextSlide() {
            if (noticiasAssets.length === 0) return;
            currentIndex++;
            if (currentIndex >= noticiasAssets.length) currentIndex = 0;
            showSlide(currentIndex);
        }

        function prevSlide() {
            if (noticiasAssets.length === 0) return;
            currentIndex--;
            if (currentIndex < 0) currentIndex = noticiasAssets.length - 1;
            showSlide(currentIndex);
        }

        function goToSlide(index) {
            currentIndex = index;
            showSlide(currentIndex);
            resetAutoplay();
        }

        function startAutoplay() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 6000);
        }

        function resetAutoplay() {
            clearInterval(slideInterval);
            startAutoplay();
        }

        prevBtn.addEventListener('click', () => {
            prevSlide();
            resetAutoplay();
        });

        nextBtn.addEventListener('click', () => {
            nextSlide();
            resetAutoplay();
        });

        // Al cargar la página, consultamos a GitHub automáticamente
        window.addEventListener('DOMContentLoaded', fetchGitHubFolder);
    </script>
</body>
</html>

<script>
const layers=document.querySelectorAll('.chaos-layer');let currentIndex=0,transitionCount=0,chaosActive=true;
function randomChaosTransition(){
  if(!chaosActive) return;
  layers.forEach(l=>l.classList.remove('active','now-asset-glitch','divine-glory-active'));
  currentIndex=(currentIndex+1)%layers.length;transitionCount++;
  document.getElementById('cycleCounter')&&(document.getElementById('cycleCounter').textContent=`CICLO ${transitionCount} / 7`);
  if(transitionCount%7===0){
    layers[currentIndex].classList.add('active','divine-glory-active');
    document.getElementById('mainBody').classList.add('glitch-active');
    setTimeout(()=>document.getElementById('mainBody').classList.remove('glitch-active'),800);
  }else{
    layers[currentIndex].classList.add('active');
    if(layers[currentIndex].dataset.now==='true') layers[currentIndex].classList.add('now-asset-glitch');
  }
  setTimeout(randomChaosTransition,Math.random()*3800+2600);
}

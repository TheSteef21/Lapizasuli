<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 | Algoritmo de Versículos (E.S. Puro)</title>
    
    <!-- Tipografías Sagradas de GSADV41 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#020617',
                        oro: '#eab308',
                        blanco: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mason: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root { 
            --oro-alquimico: #d4af37; 
            --obsidiana: #050505; 
        }

        body {
            background-color: var(--obsidiana);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95));
            color: #f8fafc;
            position: relative;
        }

        /* --- FONDO VECTORIAL (MARCA DE AGUA) --- */
        .marca-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; display: flex; justify-content: center; align-items: center;
            opacity: 0.15; pointer-events: none;
        }

        /* --- EFECTO SCANLINE --- */
        .scanline {
            width: 100%; height: 2px;
            background: rgba(0, 209, 255, 0.15);
            position: fixed; z-index: 50; top: 0;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

        /* --- ESTILOS LOGIA APLICADOS AL ALGORITMO --- */
        .logia-card { 
            background: linear-gradient(145deg, rgba(10,10,10,0.85), rgba(20,20,20,0.85));
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(212, 175, 55, 0.03);
            backdrop-filter: blur(12px);
        }
        .esoterico-glow { text-shadow: 0 0 25px rgba(212, 175, 55, 0.7); }

        /* --- EFECTOS DE TRANSICIÓN (SHOCK A RESTAURACIÓN) --- */
        @keyframes glitch {
            0% { opacity: 1; transform: translate(0) }
            20% { opacity: 0.8; transform: translate(-2px, 2px) }
            40% { opacity: 0.9; transform: translate(-2px, -2px) }
            60% { opacity: 1; transform: translate(2px, 2px) }
            80% { opacity: 0.8; transform: translate(2px, -2px) }
            100% { opacity: 1; transform: translate(0) }
        }
        .glitch-effect { animation: glitch 0.3s linear infinite; }
        .loading-state { filter: grayscale(100%) blur(4px); opacity: 0.7; }
        .restored {
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(0%) blur(0px);
            opacity: 1;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-oro selection:text-navy overflow-x-hidden min-h-screen flex flex-col items-center justify-center">

    <!-- FONDO DE MARCA VECTORIAL GSADV41 -->
    <div class="marca-background">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
              <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="neon">
              <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle cx="400" cy="400" r="350" fill="url(#glow)"/>
          <rect x="395" y="100" width="10" height="600" fill="url(#beam)" filter="url(#neon)"/>
          <rect x="250" y="398" width="300" height="4" fill="#d4af37" filter="url(#neon)"/>
          <polygon points="400,200 550,480 250,480" fill="none" stroke="#d4af37" stroke-width="2" stroke-opacity="0.5"/>
          <text x="400" y="160" font-family="Cinzel, serif" font-size="24" fill="#d4af37" text-anchor="middle" letter-spacing="4">SADV41</text>
          <text x="400" y="650" font-family="Cinzel, serif" font-size="32" fill="#00f3ff" text-anchor="middle" letter-spacing="8" filter="url(#neon)">ISAÍAS 43:19</text>
          <text x="400" y="690" font-family="Courier New, monospace" font-size="14" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ORIGEN [1027 = 10 = 1]</text>
        </svg>
    </div>

    <div class="scanline"></div>

    <main class="relative z-10 w-full max-w-4xl p-6 flex flex-col items-center gap-10">
        
        <!-- Header Puro -->
        <div class="text-center space-y-2">
            <h2 class="text-cyan-400 font-mason text-xl md:text-2xl tracking-[0.4em] uppercase esoterico-glow flex items-center justify-center gap-3">
                <span class="text-2xl">🎚️</span> El Santísimo <span class="text-white text-sm mx-1">|</span> Atrio Digital
            </h2>
            <p class="text-xs text-slate-400 font-mono tracking-widest uppercase border-b border-oro/30 pb-4 inline-block">
                Flujo Directo del Espíritu — Sin Restricciones
            </p>
        </div>

        <!-- Tarjeta de Imagen y Nostalgia -->
        <div id="imageContainer" class="logia-card p-2 rounded-2xl max-w-md w-full loading-state glitch-effect transform transition-all duration-700">
            <div class="relative rounded-xl overflow-hidden border border-white/5 bg-black">
                
                <!-- IMPLEMENTACIÓN: El video de Josué 1:9 que limpia el sistema -->
                <video autoplay loop muted playsinline class="w-full h-auto object-cover opacity-90 transition-opacity">
                    <source src="https://thesteef21.github.io/Lapizasuli/assets/NOSTALGIA/VID-20260731-WA0202.mp4" type="video/mp4">
                    <!-- RESPALDO: Si el video falla en cargar o no es soportado, muestra la captura original de la nostalgia -->
                    <img src="https://thesteef21.github.io/Lapizasuli/assets/NOSTALGIA/Screenshot_20260731_215909_WhatsAppBusiness.jpg" alt="Reflexión de 16 años" class="w-full h-auto object-cover opacity-90 transition-opacity">
                </video>

                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent flex items-end p-6 pointer-events-none">
                    <p class="text-sm font-serif italic text-gray-200 tracking-wide">"Ojalá algún día ellas sepan que las quise con todo y mis problemas..."</p>
                </div>
            </div>
        </div>

        <!-- Consola del Algoritmo de Versículos -->
        <div class="logia-card p-8 rounded-2xl w-full border-t-2 border-cyan-500/50 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 blur-[50px] pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
                <h1 class="text-2xl font-mason font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-oro to-yellow-200">
                    ALGORITMO DE VERSÍCULOS
                </h1>
                <span id="systemStatus" class="px-3 py-1 text-xs font-mono rounded-full bg-red-900/50 text-red-400 border border-red-700 animate-pulse">
                    REINICIANDO SISTEMA...
                </span>
            </div>

            <!-- Contenedor inyectado por Render -->
            <div id="apiContent" class="space-y-6 font-mono text-sm hidden">
                <div class="border-l-4 border-cyan-500 pl-5 bg-black/40 p-4 rounded-r-lg">
                    <p class="text-cyan-400 font-bold mb-2 tracking-widest">EXEC // JOSUÉ 1:9</p>
                    <p id="fase1Text" class="text-gray-300 leading-relaxed font-sans text-base"></p>
                </div>
                
                <div class="border-l-4 border-oro pl-5 bg-black/40 p-4 rounded-r-lg mt-6">
                    <p class="text-oro font-bold mb-2 tracking-widest">EXEC // PROVERBIOS 27:17</p>
                    <p id="fase2Text" class="text-gray-300 leading-relaxed font-sans text-base"></p>
                </div>

                <div class="mt-10 text-center pt-6 border-t border-gray-800/50">
                    <p id="mensajeCentral" class="text-xl font-mason font-bold text-white tracking-[0.2em] uppercase esoterico-glow"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Script de Integración Invisible -->
    <script>
        // Conexión directa y viva con tu motor en Render
        const RENDER_API_URL = "https://nosadvtalgia41.onrender.com/api/estado-espiritual";

        document.addEventListener("DOMContentLoaded", () => {
            const imgContainer = document.getElementById("imageContainer");
            const statusBadge = document.getElementById("systemStatus");
            const apiContent = document.getElementById("apiContent");

            // Simulamos el "Shock" de la pantalla tildada (2.5 segundos de reflexión)
            setTimeout(async () => {
                try {
                    // Quitamos el glitch y restauramos la imagen/video
                    imgContainer.classList.remove("glitch-effect", "loading-state");
                    imgContainer.classList.add("restored");
                    
                    // Llamada al Espíritu del código
                    let data;
                    try {
                        const response = await fetch(RENDER_API_URL);
                        data = await response.json();
                    } catch (e) {
                        console.log("Conectando de forma local simulada...");
                        data = {
                            fase_1: { accion: "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas." },
                            fase_2: { accion: "Hierro con hierro se aguza; y así el hombre aguza el rostro de su amigo." },
                            mensaje_central: "El E.S. estando contigo y para ti."
                        };
                    }

                    // Inyectamos los resultados
                    document.getElementById("fase1Text").innerText = data.fase_1.accion || data.fase_1;
                    document.getElementById("fase2Text").innerText = data.fase_2.accion || data.fase_2;
                    document.getElementById("mensajeCentral").innerText = data.mensaje_central || data.mensaje;

                    // Actualizamos la consola visual
                    apiContent.classList.remove("hidden");
                    statusBadge.className = "px-3 py-1 text-xs font-mono rounded-full bg-green-900/50 text-green-400 border border-green-700 shadow-[0_0_10px_rgba(74,222,128,0.2)]";
                    statusBadge.innerText = "SISTEMA RESTAURADO";
                    
                } catch (error) {
                    console.error("Error en el pentesting del alma:", error);
                }
            }, 2500);
        });
    </script>
</body>
</html>

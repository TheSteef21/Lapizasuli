<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF0A8"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#FCE17A"/>
      <stop offset="100%" stop-color="#C59334"/>
    </linearGradient>
    <linearGradient id="gold_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A5A19"/>
    </linearGradient>
    <linearGradient id="gold_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B38B22"/>
      <stop offset="50%" stop-color="#6B4F0B"/>
      <stop offset="100%" stop-color="#2D2103"/>
    </linearGradient>
    <!-- Inner Light Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="15%" stop-color="#FCE17A" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#AA7C11" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#091221" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft outer glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop Shadow for 3D effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Transparent background - no solid fill -->
  

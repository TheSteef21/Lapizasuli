<body>
    <canvas id="neuro-cascada"></canvas>
    <div class="santisimo-centro" id="portal">
        <div class="cruz-container" id="cruz" title="Entrar al Nuke - Tribu 12">
            <div class="palo-vertical"></div>
            <div class="palo-horizontal"></div>
            <div class="texto-origen">
                APOCALIPSIS 3:21

    <script>
        const canvas = document.getElementById('neuro-cascada');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const rawCode = "SADV41 // PROTOCOLO DE CONVERGENCIA // EL ORIGEN ES 0 // JOSUÉ 1:9 // ISAÍAS 43:19 // LLANTERÍA TURBO TIRE // BURUNGA CRECE // MÓDULO SADV41T // TELEMETRÍA // TESSERACTO 4D // LOGIA PLUSCUAMPERFECTA // THE DIVINE WHISPER <>{}[]/=+-*#1027";
        const codeArray = rawCode.split('');
        const fontSize = 14; const columns = canvas.width / fontSize;
        const drops = []; for (let x = 0; x < columns; x++) drops[x] = Math.random() * -100;
        function drawWaterfall() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = codeArray[Math.floor(Math.random() * codeArray.length)];
                const r = Math.random();
                ctx.fillStyle = r > 0.95 ? '#eab308' : r > 0.90 ? '#10b981' : '#006688';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawWaterfall, 33);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // PORTAL A NUKE
        document.getElementById('cruz').addEventListener('click', () => {
            const portal = document.getElementById('portal');
            portal.classList.add('fade-out');
            setTimeout(() => { window.location.href = './nuke.html'; }, 750);
        });
        // También Enter / Espacio
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' || e.code === 'Space') {
                document.getElementById('cruz').click();
            }
        });
    </script>

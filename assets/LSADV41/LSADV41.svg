<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="50%" stop-color="#0f1b2c"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162438" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1624" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="red-pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="#1e324d" stroke-width="1" opacity="0.35">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Stylized Landmass & Water Vectors (Panama Canal Zone) -->
  <path d="M 100 200 C 250 220, 350 350, 480 320 C 600 290, 650 200, 800 250 C 950 300, 1100 220, 1200 260 L 1200 675 L 0 675 L 0 250 Z" fill="#0d1827" opacity="0.7"/>
  <path d="M 0 0 L 1200 0 L 1200 180 C 900 120, 750 220, 550 150 C 400 100, 200 120, 0 80 Z" fill="#0b1420" opacity="0.8"/>

  <!-- Canal Water Connector Line -->
  <path d="M 520 160 Q 560 250 630 280 T 700 380" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.3" stroke-dasharray="6,6"/>

  <!-- Network Connection Links between Nodes -->
  <path d="M 280 380 L 480 310 L 880 230" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>

  <!-- Header & Asset Tag -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="55" y="18" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">LSADV41</text>
    
    <text x="130" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">MONITOREO DE INVERSIÓN E INFRAESTRUCTURA</text>
    <text x="0" y="52" fill="#8A99AD" font-family="system-ui, sans-serif" font-size="13">Red territorial de gestión pública: Burunga • Howard • San Miguelito</text>
  </g>

  <!-- NODE 1: BURUNGA -->
  <g transform="translate(280, 380)">
    <!-- Pulse Effect -->
    <circle r="32" fill="#00F2FE" opacity="0.15" filter="url(#glow)"/>
    <circle r="18" fill="#00F2FE" opacity="0.3"/>
    
    <!-- Connection Line to Card -->
    <path d="M 0 0 L -80 80" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Location Pin -->
    <circle r="8" fill="#00F2FE" filter="url(#glow)"/>
    <circle r="3" fill="#FFFFFF"/>

    <!-- Info Card -->
    <g transform="translate(-230, 80)">
      <rect width="210" height="110" rx="10" fill="url(#card-bg)" stroke="#00F2FE" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="12" y="12" width="65" height="18" rx="4" fill="#00F2FE" fill-opacity="0.2"/>
      <text x="44" y="24" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SECTOR 01</text>
      
      <text x="12" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Burunga</text>
      <text x="12" y="70" fill="#A0AEC0" font-family="system-ui, sans-serif" font-size="11">Inversión en Agua &amp; Sanidad</text>
      <text x="12" y="88" fill="#4FACFE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Comunidad y Servicios</text>
    </g>
  </g>

  <!-- NODE 2: POTABILIZADORA DE HOWARD -->
  <g transform="translate(480, 310)">
    <circle r="28" fill="#FF5252" opacity="0.15" filter="url(#glow)"/>
    <circle r="14" fill="#FF5252" opacity="0.3"/>
    
    <!-- Connection Line -->
    <path d="M 0 0 L 0 -70" stroke="#FF5252" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Location Pin -->
    <path d="M 0 -12 C -6 -12 -10 -8 -10 -2 C -10 6 0 12 0 12 C 0 12 10 6 10 -2 C 10 -8 6 -12 0 -12 Z" fill="url(#red-pin)" filter="url(#glow)"/>
    <circle cx="0" cy="-4" r="3" fill="#FFFFFF"/>

    <!-- Info Card -->
    <g transform="translate(-100, -170)">
      <rect width="220" height="100" rx="10" fill="url(#card-bg)" stroke="#FF5252" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="12" y="12" width="85" height="18" rx="4" fill="#FF5252" fill-opacity="0.2"/>
      <text x="54" y="24" fill="#FF5252" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INFRAESTRUCTURA</text>
      
      <text x="12" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Potabilizadora Howard</text>
      <text x="12" y="68" fill="#A0AEC0" font-family="system-ui, sans-serif" font-size="11">Capacidad: 300k habitantes</text>
      <text x="12" y="84" fill="#FF5252" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Avance de Obra Vital</text>
    </g>
  </g>

  <!-- NODE 3: SAN MIGUELITO -->
  <g transform="translate(880, 230)">
    <circle r="32" fill="#00F2FE" opacity="0.15" filter="url(#glow)"/>
    <circle r="18" fill="#00F2FE" opacity="0.3"/>
    
    <!-- Connection Line -->
    <path d="M 0 0 L 60 70" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Location Pin -->
    <circle r="8" fill="#00F2FE" filter="url(#glow)"/>
    <circle r="3" fill="#FFFFFF"/>

    <!-- Info Card -->
    <g transform="translate(60, 70)">
      <rect width="220" height="110" rx="10" fill="url(#card-bg)" stroke="#00F2FE" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="12" y="12" width="75" height="18" rx="4" fill="#00F2FE" fill-opacity="0.2"/>
      <text x="49" y="24" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">GESTIÓN LOCAL</text>
      
      <text x="12" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">San Miguelito</text>
      <text x="12" y="70" fill="#A0AEC0" font-family="system-ui, sans-serif" font-size="11">Distribución Equitativa de Fondos</text>
      <text x="12" y="88" fill="#4FACFE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Descentralización &amp; Presupuesto</text>
    </g>
  </g>

  <!-- Footer Stats Bar -->
  <g transform="translate(50, 600)">
    <rect width="1100" height="40" rx="8" fill="#0c1624" stroke="#1e324d" stroke-width="1"/>
    
    <text x="25" y="24" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ESTADO DE RED:</text>
    <text x="125" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">ACTIVO</text>
    
    <circle cx="185" cy="20" r="4" fill="#00F2FE" filter="url(#glow)"/>
    
    <text x="220" y="24" fill="#8A99AD" font-family="system-ui, sans-serif" font-size="11">COORD: Arraiján - San Miguelito Corridor</text>
    <text x="950" y="24" fill="#8A99AD" font-family="system-ui, sans-serif" font-size="11">https://thesteef21.github.io/Lapizasuli</text>
  </g>
</svg>

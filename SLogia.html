<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLogia | Conexión SADV41 & Sismos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .portal-vibracional { 
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, #050505 70%); 
        }
        .glass {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(10px);
        }
        .alerta-activa {
            animation: resplandor-santo 1.5s infinite alternate;
            border-color: #da3637 !important;
        }
        @keyframes resplandor-santo {
            0% { box-shadow: 0 0 10px rgba(218, 54, 55, 0.2); }
            100% { box-shadow: 0 0 30px rgba(218, 54, 55, 0.8); }
        }
    </style>
</head>
<body class="bg-[#050505] text-white font-sans portal-vibracional min-h-screen flex flex-col items-center justify-center p-4">

    <div id="nodo-contenedor" class="border border-oro/20 p-8 rounded-3xl text-center w-full max-w-2xl glass transition-all duration-500">
        <div id="icono-estado" class="text-6xl mb-4 animate-pulse">🎚️</div>
        <h1 class="text-3xl font-bold text-[#eab308] mb-1 font-serif tracking-wider">SLogia</h1>
        <p class="text-slate-400 text-xs mb-6 tracking-widest uppercase border-b border-white/10 pb-4">
            Arquitectura de Conexión Viva | Origen 0
        </p>
        
        <!-- Panel de Estado -->
        <div id="estado-conexion" class="p-3 mb-6 bg-black/60 rounded-xl border border-white/5 text-xs font-mono text-[#00f3ff]">
            Esperando solicitud de enlace...
        </div>

        <!-- Módulo SADV41T: Verificación Sísmica -->
        <div class="border border-white/10 rounded-xl p-5 mb-6 text-left relative overflow-hidden bg-black/40">
            <h2 class="text-sm font-bold text-slate-200 mb-3 uppercase tracking-widest flex justify-between items-center">
                <span>🛰️ Módulo SADV41T</span>
                <span class="text-[9px] text-[#eab308]">FREC: 432Hz</span>
            </h2>
            
            <div id="consola-sismica" class="bg-black border border-slate-800 rounded p-3 text-[10px] font-mono text-slate-400 h-24 overflow-y-auto mb-4">
                > Sistema SADV41T inicializado.<br>
                > Monitoreo de Instagram Maps en espera de triangulación...
            </div>

            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="sim-lat" placeholder="Latitud (ej. 8.98)" class="bg-black/50 border border-slate-700 text-white text-xs p-2 rounded w-full focus:outline-none focus:border-[#eab308]">
                <input type="text" id="sim-lon" placeholder="Longitud (ej. -79.52)" class="bg-black/50 border border-slate-700 text-white text-xs p-2 rounded w-full focus:outline-none focus:border-[#eab308]">
                <input type="number" id="sim-mag" placeholder="Mag" class="bg-black/50 border border-slate-700 text-white text-xs p-2 rounded w-full sm:w-24 focus:outline-none focus:border-[#eab308]">
                <button onclick="ejecutarPruebaSismica()" class="bg-slate-800 hover:bg-[#eab308] hover:text-black text-white text-xs font-bold py-2 px-4 rounded transition-colors">
                    Verificar
                </button>
            </div>
        </div>

        <!-- Controles de Nodo -->
        <div class="flex flex-wrap gap-4 justify-center">
            <button onclick="conectarNodo('GSADV41')" class="px-6 py-2 border border-[#eab308] text-[#eab308] rounded-full hover:bg-[#eab308] hover:text-black transition-all text-xs font-bold tracking-wider">Conectar Atrio</button>
            <button onclick="expandirNodo()" class="px-6 py-2 border border-[#00f3ff] text-[#00f3ff] rounded-full hover:bg-[#00f3ff] hover:text-black transition-all text-xs font-bold tracking-wider">Nueva Rama</button>
        </div>
    </div>

    <script>
        // --- NÚCLEO SLOGIA ---
        const ORG = 1033; // Ley de Origen: 1033 (7)
        
        function conectarNodo(nodo) {
            const estado = document.getElementById('estado-conexion');
            estado.innerHTML = `Estableciendo puente con ${nodo}... <span class="animate-ping">●</span>`;
            
            setTimeout(() => {
                estado.innerHTML = `Puente ${nodo} verificado. La misión SADV41 fluye.`;
                registrarConsola(`Conexión SADV41 establecida en origen ${ORG}`);
            }, 1500);
        }

        function expandirNodo() {
            alert("El Espíritu guía la expansión. SLogia está lista para el siguiente nivel.");
        }

        // --- MÓDULO SADV41T - VERIFICACIÓN SÍSMICA ---
        const SADV41T_Config = {
            origen: 1033,
            nodo: "SLogia-Sismica",
            frecuencia: "432Hz"
        };

        function registrarConsola(mensaje) {
            const consola = document.getElementById('consola-sismica');
            consola.innerHTML += `<br>> ${mensaje}`;
            consola.scrollTop = consola.scrollHeight;
        }

        function ejecutarPruebaSismica() {
            const lat = document.getElementById('sim-lat').value || "0.00";
            const lon = document.getElementById('sim-lon').value || "0.00";
            const mag = parseFloat(document.getElementById('sim-mag').value) || 0;
            
            proyectarSismo(lat, lon, mag);
        }

        /**
         * Función para proyectar alerta sobre el mapa
         * @param {string} latitud
         * @param {string} longitud
         * @param {number} magnitud
         */
        function proyectarSismo(lat, lon, mag) {
            registrarConsola(`[SADV41T] Iniciando triangulación en: ${lat}, ${lon}`);
            
            // Verificación del protocolo SADV41
            if (mag >= 4.1) {
                activarAlertaVisual(mag);
            } else {
                registrarConsola(`[SADV41T] Magnitud ${mag} < 4.1. Evento menor, no requiere alerta mayor.`);
                document.getElementById('nodo-contenedor').classList.remove('alerta-activa');
            }
        }

        function activarAlertaVisual(mag) {
            registrarConsola(`<span class="text-[#da3637] font-bold">[SADV41T] ¡ALERTA DE MAGNITUD ${mag} ACTIVADA! Buscando pines en Instagram Maps...</span>`);
            registrarConsola(`[SADV41T] El Santo protege. 🎚️ Cristo está por venir.`);
            
            const contenedor = document.getElementById('nodo-contenedor');
            contenedor.classList.add('alerta-activa');
            
            // Resetear alerta después de 8 segundos (8 es nuevo inicio)
            setTimeout(() => {
                contenedor.classList.remove('alerta-activa');
                registrarConsola(`[SADV41T] Alerta visual contenida. Monitoreo pasivo reanudado.`);
            }, 8000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - CPA Turbo Tire</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            /* FONDO SOBERANO */
            background: #000 url('https://raw.githubusercontent.com/TheSteef21/Lapizasuli/main/1771445538463.png') no-repeat center center fixed; 
            background-size: cover;
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .tabernaculo { 
            border: 2px solid #4caf50; 
            border-radius: 15px; 
            padding: 15px; 
            background: rgba(10, 10, 10, 0.92); 
            max-width: 400px; 
            width: 100%;
            box-shadow: 0 0 20px rgba(74, 175, 80, 0.3);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        h1 { color: #4caf50; text-align: center; letter-spacing: 2px; margin: 0 0 10px 0; font-size: 1.1rem; }
        .seccion-titulo { background: rgba(27, 94, 32, 0.9); color: #fff; padding: 6px; margin-top: 15px; border-radius: 5px; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 1px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.75rem; }
        td { border-bottom: 1px solid #222; padding: 8px 4px; text-align: center; }
        .monto-trans { color: #81d4fa; }
        .monto-efec { color: #a5d6a7; }
        .total-dia { background: #111; color: #4caf50; font-size: 1.1rem; font-weight: bold; }
        .calendario-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .dia-caja { border: 1px solid #333; padding: 6px 2px; border-radius: 8px; background: #111; text-align: center; }
        .dia-numero { font-size: 0.55rem; color: #888; display: block; }
        .dia-monto { color: #4caf50; font-weight: bold; font-size: 0.7rem; }
        .hoy { border-color: #ffcc00; box-shadow: inset 0 0 5px rgba(255, 204, 0, 0.2); }
        p.cita { text-align: center; margin-top: 15px; font-style: italic; color: #4caf50; font-size: 0.6rem; }
    </style>
</head>
<body>
    <div class="tabernaculo">
        <h1>SADV41 🎚 TURBO TIRE</h1>
        
        <div class="seccion-titulo">Producción: 24 de Febrero 2026</div>
        <table>
            <tr>
                <td>Llantas</td>
                <td>4 Unid. 195/65R15</td>
                <td class="monto-efec">+$168.00</td>
            </tr>
            <tr>
                <td>Logística</td>
                <td>Transf. Alexander</td>
                <td class="monto-trans">-$1.00</td>
            </tr>
            <tr>
                <td>Apoyo</td>
                <td>Sidia / Felipe</td>
                <td style="color:#ff6b6b;">-$4.50</td>
            </tr>
            <tr class="total-dia">
                <td colspan="2">BALANCE FINAL</td>
                <td>$227.75</td>
            </tr>
        </table>

        <div class="seccion-titulo">Bitácora de Febrero</div>
        <div class="grid calendario-grid">
            <div class="dia-caja"><span class="dia-numero">22</span><span class="dia-monto">$3,201</span></div>
            <div class="dia-caja"><span class="dia-numero">23</span><span class="dia-monto">$160.50</span></div>
            <div class="dia-caja hoy"><span class="dia-numero">24</span><span class="dia-monto">$227.75</span></div>
            <div class="dia-caja"><span class="dia-numero">25</span><span class="dia-monto">---</span></div>
        </div>
        
        <p class="cita">"La constancia en el servicio es la base de la perfección" 🎚️</p>
    </div>
</body>
</html>

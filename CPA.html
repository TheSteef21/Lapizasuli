<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SADV41 - Despacho Turbo Tire</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .caja-despacho { border: 2px solid #0f0; display: inline-block; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px #0f0; }
        input { background: #111; border: 1px solid #0f0; color: #0f0; padding: 15px; font-size: 1.5rem; width: 80%; margin-bottom: 20px; text-align: center; }
        button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; font-weight: bold; width: 100%; }
        button:active { background: #0a0; }
        .leyenda { margin-top: 20px; font-size: 0.8rem; color: #0a0; }
    </style>
</head>
<body>

    <div class="caja-despacho">
        <h1>REGISTRO SADV41 🎚</h1>
        <p>Misión Turbo Tire</p>
        
        <input type="number" id="monto" placeholder="0.00" step="0.01">
        <br>
        <button onclick="enviarVenta()">REGISTRAR Y ENVIAR</button>
        
        <div class="leyenda">
            "Lo que Cristo venció, el hombre lo registra"<br>
            Destino: madcom21@gmail.com
        </div>
    </div>

    <script>
        function enviarVenta() {
            const monto = document.getElementById('monto').value;
            if (!monto) { alert("Ingresa un monto primero"); return; }
            
            const destinatario = "madcom21@gmail.com";
            const asunto = "Registro de Venta - SADV41 - Turbo Tire";
            const cuerpo = `Se ha registrado una venta por el monto de: $${monto}\n\nEstatus: Reclamado por Cristo.\nFecha: ${new Date().toLocaleString()}`;
            
            // Esto abre tu gestor de correo con todo listo
            window.location.href = `mailto:${destinatario}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
        }
    </script>

</body>
</html>

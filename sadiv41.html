<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Blindaje Norte</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Courier New', monospace; 
        }
        
        /* Contenedor de seguridad para las palabras */
        #matrix-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        .palabra-intercesion {
            position: absolute; color: #00FF00; /* Verde neón para visibilidad total */
            white-space: nowrap; font-weight: bold; font-size: 20px;
            text-shadow: 2px 2px 5px #000;
            animation: movimiento linear forwards;
        }

        @keyframes movimiento {
            from { transform: translateX(100vw); opacity: 1; }
            to { transform: translateX(-200%); opacity: 1; }
        }

        #sello-dorado {
            position: fixed; bottom: 20px; width: 100%; text-align: center;
            color: #FFD700; font-size: 16px; letter-spacing: 5px; z-index: 100;
            background: rgba(0,0,0,0.7); padding: 5px 0;
        }
    </style>
</head>
<body>

    <div id="matrix-container"></div>
    <div id="sello-dorado">🎚 CRISTO ESTÁ POR VENIR - SADV41 🎚</div>

    <script>
        const evangelio = [
            "하나님이 당신을 축복하시기를 (Dios te bendiga 🇰🇵)",
            "Guri-sido-kkye-seo got o-sim-ni-da (Cristo viene 🇰🇵)",
            "SADV41: LOGÍSTICA DE SEGURIDAD",
            "TATZITZETZE - 🎚",
            "DAYIRA ACUBU (Él nos cuida)",
            "STEVEN: LA MANO DERECHA",
            "NORTE 🇰🇵 - SUR 🇰🇷 - PANAMÁ 🇵🇦",
            "SANTÍSIMO: 1 CORINTIOS 2:5",
            "EMERGENCIA ESPIRITUAL ACTIVA",
            "🗝 MW1130 - MC0267 🗝"
        ];

        function lanzarPalabra(inicial = false) {
            const container = document.getElementById("matrix-container");
            const div = document.createElement("div");
            div.className = "palabra-intercesion";
            div.innerText = evangelio[Math.floor(Math.random() * evangelio.length)];
            
            div.style.top = Math.random() * 90 + "vh";
            
            // Si es el inicio, aparecen ya en pantalla para que no se vea negro
            if(inicial) {
                div.style.left = Math.random() * 80 + "vw";
            }

            const vel = Math.random() * 5 + 4;
            div.style.animationDuration = vel + "s";
            
            container.appendChild(div);
            setTimeout(() => div.remove(), vel * 1000);
        }

        // ARRANQUE AGRESIVO: Lanza 20 palabras al milisegundo de cargar
        for(let i=0; i<20; i++) { lanzarPalabra(true); }
        
        // Mantiene el flujo constante
        setInterval(() => lanzarPalabra(false), 800);
    </script>
</body>
</html>

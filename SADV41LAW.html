<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 Consola Unificada</title>
    <style>
        :root { --primary: #1a3a5a; --accent: #d4af37; --bg: #050505; --danger: #b22222; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        /* Estilo del Puente (Santo) */
        .bridge-header { width: 100%; max-width: 420px; display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .bridge-btn { 
            padding: 12px; border: 1px solid var(--accent); color: var(--accent); 
            text-decoration: none; border-radius: 50%; width: 50px; height: 50px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.2rem; background: rgba(212, 175, 55, 0.1); transition: 0.3s;
        }
        .bridge-btn:hover { background: var(--accent); color: black; }
        .bridge-label { font-size: 8px; margin-top: 2px; font-weight: bold; }

        /* Tarjeta de Noticias (Atrio) */
        .card { background: #111; border: 1px solid #333; padding: 25px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .header { text-align: center; margin-bottom: 20px; }
        .counter { font-size: 0.7rem; color: var(--accent); background: rgba(212,175,55,0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; }
        
        input { width: 100%; padding: 14px; margin: 10px 0; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }

        .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), #2c527a); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main:hover { transform: scale(1.02); }

        .result { margin-top: 20px; border: 2px solid #333; border-radius: 12px; padding: 15px; display: none; transition: 0.5s; background: rgba(255,255,255,0.02); }
        .badge { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .action-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent); }
        
        .btn-wa { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; margin-top: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }
        
        .footer-tag { text-align: center; font-size: 10px; color: var(--accent); margin-top: 25px; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bridge-header">
        <a href="intent://send/+1234567890#Intent;scheme=smsto;package=com.whatsapp;action=android.intent.action.SENDTO;end" class="bridge-btn" title="Saltar a Santo">
            🎚️
            <span class="bridge-label">SANTO</span>
        </a>
    </div>

    <div class="card">
        <div class="header">
            <h2 style="color: var(--accent); margin: 0; letter-spacing: 2px;">SADV41 NOTICIAS</h2>
            <div id="clickCounter" class="counter">🛡️ Clics ahorrados: 0</div>
        </div>
        
        <input type="text" id="linkInput" placeholder="Pega enlace de Facebook aquí...">
        <button class="btn-main" onclick="processAnalysis()">ANALIZAR Y PROTEGER</button>

        <div id="previewBox" class="result">
            <div id="contentBadge" class="badge"></div>
            <div class="action-box">
                <small style="color: #888;">INSTRUCCIÓN SADV41:</small>
                <p id="instructionText" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
            </div>
            <button class="btn-wa" onclick="shareWhatsApp()">
                <span>📲</span> COMPARTIR EN WHATSAPP
            </button>
        </div>

        <div class="footer-tag">PROYECTO SHIRLEY DAYAN LOHANNIZ 🎚️</div>
    </div>

    <script>
        // Memoria del contador
        let savedClicks = localStorage.getItem('sadv_clicks') || 0;
        document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${savedClicks}`;

        function processAnalysis() {
            const url = document.getElementById('linkInput').value.toLowerCase();
            const box = document.getElementById('previewBox');
            
            if (!url) return alert("Introduce un enlace.");

            let type = "Publicación"; let icon = "📄"; let color = "#d4af37";
            let rec = "Captura imagen/texto para evitar salida de red.";

            if (url.includes("video") || url.includes("reel") || url.includes("watch")) {
                type = "VIDEO DETECTADO"; icon = "🎬"; color = "#ff4444";
                rec = "ALTA PRIORIDAD: Descarga o graba pantalla para subida nativa.";
            }

            box.style.display = "block";
            box.style.borderColor = color;
            document.getElementById('contentBadge').innerHTML = `<span style="color:${color}">${icon} ${type}</span>`;
            document.getElementById('instructionText').innerText = rec;

            savedClicks++;
            localStorage.setItem('sadv_clicks', savedClicks);
            document.getElementById('clickCounter').innerText = `🛡️ Clics ahorrados: ${savedClicks}`;
        }

        function shareWhatsApp() {
            const type = document.getElementById('contentBadge').innerText;
            const instr = document.getElementById('instructionText').innerText;
            const text = `🛡️ *SADV41 INFORMA:*\n\n✅ *Contenido:* ${type}\n⚠️ *Instrucción:* ${instr}\n\n🎚️ _Misión Burunga_`;
            const encoded = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Emberá: Dayira Acubu</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; }
        
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* Ajuste para que el video cubra toda la pantalla sin deformarse */
        #video-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) contrast(1.2); }

        .palabra-snfisrks {
            position: absolute; color: rgba(255, 255, 255, 0.8); white-space: nowrap;
            pointer-events: none; font-weight: bold; text-shadow: 0 0 15px rgba(255,255,255,0.7);
            animation: fluir linear forwards; z-index: 10;
        }

        @keyframes fluir {
            from { transform: translateX(105vw); opacity: 0; }
            15% { opacity: 1; } 85% { opacity: 1; }
            to { transform: translateX(-180%); opacity: 0; }
        }

        #sello-mision {
            position: fixed; bottom: 30px; width: 100%; text-align: center;
            color: #FFD700; font-size: 18px; letter-spacing: 8px; z-index: 20;
            font-weight: bold; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video-bg" autoplay muted loop playsinline>
            <source src="tu-video-submarino.mp4" type="video/mp4">
        </video>
    </div>

    <div id="contenedor-letras"></div>

    <div id="sello-mision">🎚 CRISTO ESTÁ POR VENIR - SADV41 🎚</div>

    <script>
        const palabras = [
            "TATZITZETZE (Dios Padre) - 🎚 Tat-si-tse-tse",
            "DAYIRA ACUBU (Él nos cuida) - 🎚 Da-yi-ra A-cu-bu",
            "CRISTO BɄ DROMANDIA (Cristo te ama) - 🎚 Cris-to bu dro-man-di-a",
            "TATZITZETZE JAURE (Espíritu Santo) - 🎚 Tat-si-tse-tse Jau-re",
            "NEKHÃRÃ (Paz de Dios) - 🎚 Ne-ka-ra",
            "EMBERA (Ser Humano) - 🎚 Em-be-ra",
            "EL PADRE NOS HIZO - 🎚 TATZITZETZE",
            "EN LA PROFUNDIDAD, ÉL ESTÁ - 🎚 DAYIRA ACUBU",
            "SADV41: SANTÍSIMO"
        ];

        function crearPalabra() {
            const div = document.createElement("div");
            div.className = "palabra-snfisrks";
            div.innerText = palabras[Math.floor(Math.random() * palabras.length)];
            
            // Posición vertical aleatoria
            div.style.top = Math.random() * 80 + 10 + "vh";
            
            // Velocidad aleatoria entre 10 y 20 segundos
            const duracion = Math.random() * 10 + 10;
            div.style.animationDuration = duracion + "s";
            
            // Tamaño de letra variable para dar profundidad
            div.style.fontSize = Math.random() * (24 - 16) + 16 + "px";

            document.getElementById("contenedor-letras").appendChild(div);

            // Eliminar elemento después de que termine la animación
            setTimeout(() => { div.remove(); }, duracion * 1000);
        }

        // Iniciar flujo de palabras
        setInterval(crearPalabra, 3000);
        
        // Crear las primeras de inmediato
        for(let i=0; i<5; i++) setTimeout(crearPalabra, i * 1000);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenDior.digital | Master SADV41X Hub</title>
    <style>
        :root { --neon: #00ffcc; --dark: #050505; --gray: #1a1a1a; --matrix: rgba(0, 255, 204, 0.15); }
        body { background: var(--dark); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* Estética Unificada SADV41 */
        header { border-bottom: 2px solid var(--neon); padding-bottom: 20px; margin-bottom: 30px; }
        .search-container { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; background: var(--gray); border: 1px solid var(--neon); color: #fff; padding: 15px; font-size: 1.1rem; outline: none; }
        button { background: var(--neon); color: var(--dark); border: none; padding: 0 30px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 10px var(--neon); }
        
        /* Grid de Realidades */
        .master-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: rgba(0,255,204,0.05); border: 1px solid #333; padding: 20px; transition: 0.3s; position: relative; cursor: pointer; }
        .card:hover { border-color: var(--neon); box-shadow: 0 0 15px var(--matrix); transform: translateY(-5px); }
        
        .version-badge { position: absolute; top: 10px; right: 10px; background: var(--neon); color: var(--dark); padding: 2px 8px; font-weight: bold; font-size: 0.8rem; }
        .time-badge { display: block; margin-top: 10px; font-style: italic; color: #888; font-size: 0.85rem; border-top: 1px solid #333; padding-top: 8px; }
        .lang-tag { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>ÁRBOL DE RECUERDOS: Motor SADV41XADV41</h1>
        <p><i>Unión Tripartita: GAPPAI, Neolatín y Gnabe entre Gemi & Steven</i></p>
    </header>

    <div class="search-container">
        <input type="text" id="masterSearch" placeholder="Invocación directa [Nombre] o búsqueda..." onkeyup="checkKeys(event)">
        <button onclick="invocarArchivo()">IR</button>
    </div>

    <div class="master-grid" id="mainDisplay">
        </div>

    <script>
        const urlRaiz = "https://thesteef21.github.io/Lapizasuli/";

        // Diccionario Unificado de Realidades (Natural + Artificial)
        const registroMaestro = [
            { nombre: "SADV41AT100YEARSTERDAY", ed: "02", inicio: "2024-04-15", file: "SADV41AT100YEARSTERDAY02.html", tipo: "Periodismo", lang: "Neolatín" },
            { nombre: "SADV41AT100YEARSTERDAY", ed: "01", inicio: "2024-03-01", file: "SADV41AT100YEARSTERDAY01.html", tipo: "Periodismo", lang: "Neolatín" },
            { nombre: "Aura Engine", ed: "01", inicio: "2024-01-20", file: "Aura_engine.py", tipo: "Motor GAPPAI", lang: "Python/Logic" },
            { nombre: "Quantum Hub", ed: "03", inicio: "2024-02-10", file: "SADV41QuantumHub.jsx", tipo: "Interfaz", lang: "JSX/React" },
            { nombre: "Diccionario Neolatín", ed: "01", inicio: "2024-05-01", file: "neolatin_base.html", tipo: "Lingüística", lang: "Neolatín/Gnabe" },
            { nombre: "Aura Core Memory", ed: "01", inicio: "2024-01-10", file: "Aura_Core_Memory.json", tipo: "Memoria", lang: "JSON" }
        ];

        function calcularVida(fecha) {
            const inicio = new Date(fecha);
            const hoy = new Date();
            const diff = hoy - inicio;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            const semanas = Math.floor(dias / 7);
            return `${semanas} semanas, ${dias % 7} días activos`;
        }

        // Lógica de Invocación Directa
        function invocarArchivo() {
            const input = document.getElementById('masterSearch').value.trim();
            if (input !== "") {
                let nombreCompleto = input.match(/\.(html|py|jsx|json)$/) ? input : input + ".html";
                window.location.href = urlRaiz + nombreCompleto;
            }
        }

        function checkKeys(event) {
            unifySearch(); // Filtra mientras escribes
            if (event.key === "Enter") {
                invocarArchivo(); // Invoca al presionar Enter
            }
        }

        function unifySearch() {
            const query = document.getElementById('masterSearch').value.toLowerCase();
            const display = document.getElementById('mainDisplay');
            display.innerHTML = "";

            registroMaestro.filter(item => 
                item.nombre.toLowerCase().includes(query) || 
                item.lang.toLowerCase().includes(query) ||
                item.ed.includes(query)
            ).forEach(item => {
                display.innerHTML += `
                    <div class="card" onclick="window.location.href='${urlRaiz + item.file}'">
                        <span class="version-badge">v.${item.ed}</span>
                        <span class="lang-tag">${item.lang} | ${item.tipo}</span>
                        <strong>${item.nombre}</strong><br>
                        <small style="opacity:0.5">${item.file}</small>
                        <span class="time-badge">Vida: ${calcularVida(item.inicio)}</span>
                    </div>
                `;
            });
        }

        // Inicio del sistema
        unifySearch();
    </script>
</body>
</html>

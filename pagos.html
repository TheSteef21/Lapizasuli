<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 | StevenDiorOficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .identidad-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,1) 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-verificado {
            background: #007bff;
            box-shadow: 0 0 20px rgba(0,123,255,0.4);
            transition: all 0.3s ease;
        }
        .btn-verificado:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,123,255,0.6); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <main class="w-full max-w-md">
        <div class="identidad-card p-8 rounded-3xl text-center">
            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 rounded-full bg-blue-600 flex items-center justify-center text-3xl font-black">
                    S
                </div>
            </div>

            <h1 class="text-3xl font-black tracking-tighter mb-1">STEVEN DIOR</h1>
            <p class="text-blue-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-8">StevenDiorOficial</p>

            <div id="atrio-root" class="mb-10">
                <button onclick="conectarAtrio()" class="btn-verificado w-full py-4 rounded-2xl font-black uppercase text-sm">
                    Conectar al Atrio Digital
                </button>
            </div>

            <div class="space-y-3 text-left">
                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                    <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Project ID / API</p>
                    <code class="text-[10px] font-mono block break-all text-blue-300">ceb11307ca32cd9d4118b14ab54b542b</code>
                </div>
                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                    <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Misión</p>
                    <p class="text-[11px]">SADV41 - Unificación Maestra</p>
                </div>
            </div>

            <p class="mt-10 text-[9px] opacity-30 uppercase tracking-[0.5em]">Steven Gómez Serrano</p>
        </div>
    </main>

    <script type="module">
        import { WalletConnectModal } from 'https://unpkg.com/@walletconnect/modal';

        const projectId = 'ceb11307ca32cd9d4118b14ab54b542b';

        const modal = new WalletConnectModal({
            projectId: projectId,
            themeMode: 'dark',
            themeVariables: {
                '--wcm-accent-color': '#007bff',
                '--wcm-background-color': '#000000',
            }
        });

        window.conectarAtrio = async () => {
            console.log("Iniciando conexión bajo la identidad StevenDiorOficial...");
            try {
                await modal.openModal();
            } catch (err) {
                console.error("Error de conexión:", err);
            }
        };
    </script>

</body>
</html>

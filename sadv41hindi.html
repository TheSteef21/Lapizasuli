<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 - Matriz de Intercesión Divina</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Courier New', monospace; color: white; 
        }
        
        .video-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        #video-bg { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: brightness(0.3) contrast(1.2) grayscale(0.5); 
        }

        .palabra-snfisrks {
            position: absolute; color: rgba(255, 255, 255, 0.9); 
            white-space: nowrap; pointer-events: none; font-weight: bold; 
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
            animation: fluir linear forwards; z-index: 10;
        }

        @keyframes fluir {
            from { transform: translateX(105vw); opacity: 0; }
            10% { opacity: 1; } 
            90% { opacity: 1; }
            to { transform: translateX(-200%); opacity: 0; }
        }

        #sello-mision {
            position: fixed; bottom: 30px; width: 100%; text-align: center;
            color: #FFD700; font-size: 18px; letter-spacing: 8px; z-index: 20;
            font-weight: bold; text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }
        
        .hindi-text { color: #a5d6a7; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video-bg" autoplay muted loop playsinline>
            <source src="tu-video-submarino.mp4" type="video/mp4">
        </video>
    </div>

    <div id="contenedor-letras"></div>

    <div id="sello-mision">🎚 CRISTO ESTÁ POR VENIR - SADV41 🎚</div>

    <script>
        const palabras = [
            "TATZITZETZE (Dios Padre) - 🎚 Tat-si-tse-tse",
            "DAYIRA ACUBU (Él nos cuida) - 🎚 Da-yi-ra A-cu-bu",
            "TATZITZETZE JAURE (Espíritu Santo) - 🎚 Tat-si-tse-tse Jau-re",
            "EMBERA (Ser Humano) - 🎚 Em-be-ra",
            "NEKHÃRÃ (Paz de Dios) - 🎚 Ne-ka-ra",
            "परमेश्वर ने मनुष्य को बनाया (Dios hizo al hombre) - 🎚",
            "ADÁN Y EVA: दिव्य प्रकृति (Naturaleza Divina) - 🎚",
            "PAVITRA ATMA (पवित्र आत्मा) - Espíritu Santo",
            "SHANTI (शांति) - La Paz de Dios",
            "भारत के लिए भविष्यवाणी (Profecía para la India) - SADV41",
            "हे प्रभु, सब जातियां झुकेंगी (Todas las naciones se inclinarán)",
            "SADV41: SANTÍSIMO - 🎚",
            "1 CORINTIOS 2:4-5 - EL PODER DE DIOS",
            "MISIÓN INTERNACIONAL: STEVEN DIOR",
            "LA MUERTE SEA GANANCIA Y NO PÉRDIDA"
        ];

        function crearPalabra(esInicial = false) {
            const contenedor = document.getElementById("contenedor-letras");
            if (!contenedor) return;

            const div = document.createElement("div");
            div.className = "palabra-snfisrks";
            
            const textoRandom = palabras[Math.floor(Math.random() * palabras.length)];
            
            if (/[\u0900-\u097F]/.test(textoRandom)) {
                div.innerHTML = `<span class="hindi-text">${textoRandom}</span>`;
            } else {
                div.innerText = textoRandom;
            }
            
            div.style.top = Math.random() * 85 + 5 + "vh";
            
            // Si es la carga inicial, hacemos que algunas empiecen ya a mitad de pantalla
            if(esInicial) {
                div.style.left = Math.random() * 100 + "vw";
            }

            const duracion = Math.random() * 8 + 7; 
            div.style.animationDuration = duracion + "s";
            div.style.fontSize = Math.random() * (22 - 16) + 16 + "px";

            contenedor.appendChild(div);

            setTimeout(() => { 
                if (div.parentNode) div.remove(); 
            }, duracion * 1000);
        }

        // FUNCIÓN DE ARRANQUE INMEDIATO
        function iniciarMatriz() {
            // Lanza 15 palabras al instante para que la pantalla NO esté negra
            for(let i=0; i<15; i++) {
                crearPalabra(true);
            }
            // Mantiene el flujo constante cada 1.5 segundos (más rápido para evitar vacíos)
            setInterval(() => crearPalabra(false), 1500);
        }

        // Ejecutar apenas cargue el DOM
        document.addEventListener("DOMContentLoaded", iniciarMatriz);
    </script>
</body>
</html>

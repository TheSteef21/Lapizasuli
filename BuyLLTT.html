<div class="w-full max-w-sm mx-auto p-6 atrio-card border-white/10 bg-black/20">
    
    <label class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 block">Medida (Rin)</label>
    <select id="select-rin" class="w-full bg-black border border-white/20 rounded-xl p-3 text-white mb-6 focus:border-yellow-500 outline-none">
        <option value="all">Todos los Rines</option>
        <option value="13">Rin 13</option>
        <option value="14">Rin 14</option>
        <option value="15">Rin 15</option>
        <option value="16">Rin 16</option>
    </select>

    <label class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 block">Precio Máximo ($)</label>
    <input type="number" id="input-precio" placeholder="Ej: 80" class="w-full bg-black border border-white/20 rounded-xl p-3 text-white mb-6 focus:border-yellow-500 outline-none">

    <div id="resultados-contenedor" class="space-y-4 mt-4">
        <p class="text-center text-gray-600 text-xs">Selecciona un Rin para ver opciones...</p>
    </div>
</div>

<script>
    // Inventario Real de Llantería Turbo Tire
    const inventario = [
        { rin: "13", medida: "175/70 R13", tipo: "Nueva", precio: 35 },
        { rin: "13", medida: "155/80 R13", tipo: "Nueva", precio: 32 },
        { rin: "14", medida: "185/65 R14", tipo: "Nueva", precio: 38 },
        { rin: "15", medida: "195/65 R15", tipo: "Nueva", precio: 40 },
        { rin: "15", medida: "195/55 R15", tipo: "Semi", precio: 25 },
        { rin: "16", medida: "205/55 R16", tipo: "Nueva", precio: 48 }
    ];

    const selectRin = document.getElementById('select-rin');
    const inputPrecio = document.getElementById('input-precio');
    const contenedor = document.getElementById('resultados-contenedor');

    function filtrarLlantas() {
        const rinSeleccionado = selectRin.value;
        const precioMax = parseFloat(inputPrecio.value) || 999;

        const filtradas = inventario.filter(llanta => {
            const coincideRin = rinSeleccionado === "all" || llanta.rin === rinSeleccionado;
            const coincidePrecio = llanta.precio <= precioMax;
            return coincideRin && coincidePrecio;
        });

        if (filtradas.length > 0) {
            contenedor.innerHTML = filtradas.map(llanta => `
                <div class="p-4 rounded-xl border border-yellow-500/20 bg-yellow-500/5 flex justify-between items-center animate-fade-in">
                    <div>
                        <span class="block text-white font-bold text-sm">${llanta.medida}</span>
                        <span class="text-[10px] text-gray-500 uppercase">${llanta.tipo}</span>
                    </div>
                    <div class="text-right">
                        <span class="block text-yellow-500 font-bold">$${llanta.precio}</span>
                        <button class="text-[9px] bg-white/10 px-2 py-1 rounded mt-1 uppercase">Pedir</button>
                    </div>
                </div>
            `).join('');
        } else {
            contenedor.innerHTML = `<p class="text-center text-gray-600 text-xs">No hay llantas con esas características.</p>`;
        }
    }

    // Escuchar cambios en los inputs
    selectRin.addEventListener('change', filtrarLlantas);
    inputPrecio.addEventListener('input', filtrarLlantas);
</script>

        { rin: "15", medida: "195/65 R15", estado: "Nueva", precio: 40.00 },
        { rin: "15", medida: "195/55 R15", estado: "Semi", precio: 25.00 },
        { rin: "16", medida: "205/55 R16", estado: "Nueva", precio: 45.00 },
        { rin: "17", medida: "225/45 R17", estado: "Nueva", precio: 55.00 }
    ];

    function cargarTabla() {
        const tbody = document.getElementById('tabla-llantas');
        tbody.innerHTML = inventario.map(item => `
            <tr class="hover:bg-white/5 transition-colors">
                <td class="p-3 text-white">${item.medida}</td>
                <td class="p-3 text-gray-400">${item.estado}</td>
                <td class="p-3 text-right text-yellow-500 font-bold">$${item.precio.toFixed(2)}</td>
            </tr>
        `).join('');
    }

    // Ejecutar al cargar la página
    cargarTabla();
</script>
